# Original XOR-DAT payload; camera-specific missing tail starts erased.
# One backing is shared with serial flash and DMA; CPU aperture stores fail.
# Explicit console f7 seed in update defaults; no original DAT mutation.
[[device]]
base = 0xf0000000
size = 0x08000000
kind = "flash-storage"
[device.options]
dat_origin = 0x2bc
xor = 0xff
erased_tail = 0xff
seed = [{ offset = 0x6600f7, value = 3 }]

[[device]]
base = 0xff90a000
size = 0x1000
kind = "flash-storage-controller"
[device.options]
# Selected stock descriptor geometry; not an observed camera chip ID.
jedec_id = 0x20bb20

[[device]]
# Functional 1us completion, level INTID225 until masked ACK at +1c.
base = 0xff939000
size = 0x1000
kind = "flash-storage-dma"

[[device]]
# Known gate/reset latches start zero; this is a session assumption.
base = 0xff90c000
size = 0x1000
kind = "clock-gates"
[device.options]
configuration_word = 0

[[device]]
base = 0xff91c000
size = 0x1000
kind = "reset-handshake"
[device.options]
trigger_offset = 0x1c

# "Table-driven controller apertures".
[[device]]
base = 0xfaf05000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf15000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf25000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf35000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfae00000
size = 0x3000
kind = "write-only-registers"

[[device]]
base = 0xff90d000
size = 0x1000
kind = "power-gates"

# It also reads 0x68000000, which is DRAM now that the manifest's [dram] extends the map to
# 0x80000000; this window at 0x80000000 is the body's drain peripheral, moved off the new RAM.
[[device]]
base = 0x80000000
size = 4
kind = "discarded-read"

[[device]]
base = 0x1c0000000
size = 4
kind = "discarded-read"
