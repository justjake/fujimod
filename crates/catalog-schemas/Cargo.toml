[package]
name = "fujimod-catalog-schemas"
description = "Generates and checks the committed JSON Schemas of every catalog document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
fujimod-catalog.workspace = true
fujimod-catalog-configuration.workspace = true
fujimod-catalog-resolution.workspace = true
fujimod-catalog-bulk.workspace = true
fujimod-catalog-construction.workspace = true
fujimod-catalog-controls.workspace = true
fujimod-catalog-remote.workspace = true
fujimod-catalog-run-inputs.workspace = true
fujimod-catalog-settings.workspace = true
schemars.workspace = true
serde_json.workspace = true
fujimod-workspace-hack.workspace = true

[features]
# The JSON Schema derives of every catalog crate; the generator needs them.
schema = [
  "fujimod-catalog/schema",
  "fujimod-catalog-configuration/schema",
  "fujimod-catalog-resolution/schema",
  "fujimod-catalog-bulk/schema",
  "fujimod-catalog-construction/schema",
  "fujimod-catalog-controls/schema",
  "fujimod-catalog-remote/schema",
  "fujimod-catalog-run-inputs/schema",
  "fujimod-catalog-settings/schema",
]

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }

[[bin]]
name = "catalog-schemas"
required-features = ["schema"]

[[test]]
name = "catalog_schemas"
required-features = ["schema"]
