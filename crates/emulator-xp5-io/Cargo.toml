[package]
name = "fujimod-emulator-xp5-io"
description = "XP5 GPIO, serial, ADC, timers, mailbox, clocks and gates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-devices.workspace = true
fujimod-emulator-parts-io.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
fujimod-workspace-hack.workspace = true

[dev-dependencies]
fujimod-emulator-parts-controls.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
