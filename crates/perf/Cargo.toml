[package]
name = "fujimod-perf"
description = "Always-on walkthrough and emulator performance ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "fujimod_perf"

[features]
default = []
# Browser builds record spans only when this is passed. Native builds are
# always on; published browser builds never pass it.
perf = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
fujimod-workspace-hack.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fastrace = { version = "0.7", features = ["enable"] }
quanta = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fujimod_perf_off)'] }
