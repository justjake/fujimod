[package]
name = "fujimod-catalog-resolution"
description = "Run configurations resolved against the reference catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-catalog.workspace = true
fujimod-catalog-configuration.workspace = true
fujimod-catalog-construction.workspace = true
fujimod-catalog-run-inputs.workspace = true
fujimod-catalog-identity.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
tsify.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
fujimod-workspace-hack.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
# JSON Schema derives, used only to generate and check the committed schemas.
schema = ["fujimod-catalog/schema", "fujimod-catalog-configuration/schema"]
