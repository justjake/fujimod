[package]
name = "fujimod-emulator-exr2-display"
description = "EXR II display controller and scanout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-exr2-plan.workspace = true
fujimod-emulator-imaging.workspace = true
fujimod-emulator-devices.workspace = true
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
fujimod-workspace-hack.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
