[package]
name = "fujimod-emulator-exr2-board"
description = "EXR II board construction: builds the device models of a plan and wires their resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-exr2-resources.workspace = true
fujimod-emulator-exr2-images.workspace = true
fujimod-emulator-devices.workspace = true
fujimod-emulator-exr2-plan.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
fujimod-emulator-imaging.workspace = true
fujimod-emulator-ip.workspace = true
fujimod-emulator-exr2-system.workspace = true
fujimod-emulator-exr2-serial.workspace = true
fujimod-emulator-exr2-i2c.workspace = true
fujimod-emulator-exr2-display.workspace = true
fujimod-emulator-models.workspace = true
