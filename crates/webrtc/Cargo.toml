[package]
name = "fujimod-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "WebRTC data channels between peers that meet in an end-to-end sealed share-link room"

[lib]
doctest = false

[features]
signaling = ["dep:axum", "dep:tokio"]

[dependencies]
url = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.23"
fujimod-workspace-hack.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-smol", "crypto-ring"] }
async-trait = "0.1"
bytes = "1"
async-channel = "2"
socket2 = "0.6"
async-io = "2"
aes-gcm = "0.11"
rand = "0.10"
sha2.workspace = true
if-addrs = "0.15"
futures-lite.workspace = true
futures-timer.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
async-tungstenite = { version = "0.35", features = ["smol-runtime", "smol-native-tls"] }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "signal",
], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hmac = "0.13"
sha1 = "0.11"
md5 = "0.8"

[[bin]]
name = "fujimod-webrtc-bench"
path = "src/bin/webrtc_bench.rs"
required-features = ["signaling"]
