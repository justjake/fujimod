[package]
name = "fujimod-emulator-ip-dmp"
description = "DMP SMAPH rendering and transfer engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
libm = "0.2.16"
naga = { version = "=30.0.1", default-features = false, features = ["glsl-in", "wgsl-in", "wgsl-out"] }
fujimod-emulator-devices.workspace = true
fujimod-emulator-gpu.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
sha2.workspace = true
ciborium.workspace = true
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "webgpu", "wgsl", "fragile-send-sync-non-atomic-wasm"] }
