[package]
name = "fujimod-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
default = ["board", "ff80"]
board = ["dep:fujimod-emulator"]
ff80 = ["dep:async-io", "dep:fujimod-usb"]

[dependencies]
fujimod-emulator-session.workspace = true
fujimod-catalog-controls.workspace = true
fujimod-catalog-remote.workspace = true
fujimod-recording.workspace = true
fujimod-emulator = { workspace = true, optional = true }
fujimod-usb = { workspace = true, optional = true }
async-io = { version = "2", optional = true }
futures-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
fujimod-workspace-hack.workspace = true

[dev-dependencies]
fujimod-usb.workspace = true
