[package]
name = "fujimod-emulator-exr2-isp-output"
description = "EXR II combination, output channels, still processor, scaler, warp and AVC codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
videotoolbox-tests = []

[dependencies]
fujimod-emulator-exr2-resources.workspace = true
fujimod-emulator-exr2-images.workspace = true
fujimod-emulator-image-formation.workspace = true
fujimod-emulator-image-processing.workspace = true
fujimod-emulator-exr2-plan.workspace = true
fujimod-emulator-imaging.workspace = true
fujimod-emulator-image-codecs.workspace = true
fujimod-catalog-construction.workspace = true
fujimod-emulator-devices.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
fujimod-workspace-hack.workspace = true

[dev-dependencies]
fujimod-emulator-exr2-isp-testing.workspace = true
fujimod-emulator-exr2-codecs.workspace = true
fujimod-emulator-exr2-isp-input.workspace = true
fujimod-emulator-exr2-isp-statistics.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
openh264 = "=0.9.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
