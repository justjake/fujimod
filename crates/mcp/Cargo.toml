[package]
name = "fujimod-mcp"
description = "The fujimod-mcp server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "fujimod-mcp"
path = "src/main.rs"

[dependencies]
fujimod-mcp-core.workspace = true
fujimod-mcp-camera.workspace = true
fujimod-emulator-models.workspace = true
fujimod-emulator-exr2-board.workspace = true
fujimod-workspace-hack.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmcp = { workspace = true, features = ["transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
