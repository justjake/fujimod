[package]
name = "fujimod-emulator-parts-wifi"
description = "SDIO Wi-Fi module part: enumeration, ROM download, MT5931 HIF and a virtual access point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-devices.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
smoltcp.workspace = true
aes-kw = { version = "0.3", default-features = false }
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
fujimod-workspace-hack.workspace = true

[dev-dependencies]
ciborium = "0.2.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
