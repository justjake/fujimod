# I2C instance 2 at ff926000 (controllers at ff924000 + n*0x1000; the open
# routine 0x1387a0c writes 0xff924018 + (n << 12) through 0x13871e8). Its
# interrupt is selector 5 of the driver's table 0x18e9248, descriptor
# "I2C controllers"). The bus-2 clients of the driver's table 0x18e9258 are
# 0x24, 0x1d, 0x0e (fast mode) and 0x6a; the boot opens 0x6a first
# (0x13e3680, chosen by configuration byte 0x89ea = 0). No part on this bus is
# identified (camera-needs.md 1.18), so none is declared and every address is
# not acknowledged. byte_ns is the functional latency of instance 1, not a
# bus rate.
[[device]]
kind = "i2c-controller"
base = 0xff926000
size = 0x1000
[device.options]
interrupt = 290
byte_ns = 1000000
