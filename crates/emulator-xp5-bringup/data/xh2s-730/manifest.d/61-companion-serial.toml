# Companion (M-core) serial controllers. The M-core's request table at its local
# 0x22580 (accessor 0x1a7cc, 4 slots of 28 bytes; opener 0x1995c -> 0x1a318 -> SSP open
# 0x1a25c, which addresses (n + 0x5f910) << 12) names SSP instances 2, 9, 7 and 9:
#   slot 0: SSP2, mode (1,1), 8-bit, divisor 0x1c
#   slot 1: SSP9, mode (0,0), 8-bit, divisor 0x1c
#   slot 2: SSP7, mode (1,1), 8-bit, divisor 6
#   slot 3: SSP9, mode (0,0), 16-bit, divisor 0x1c
# The X-T5 M-core's table (local 0x320ec) has one slot, SSP1, mode (1,1), 8-bit, divisor
# 6: its companion serial (xt5-431.d/60-mcore.toml). So SSP7 carries the same link here
# with the X-T5's two endpoint models. Their selects: the X-H2S transfer routines 0xa2b4
# and 0xa320 drive GPIO literal 0x000f000c (port 15 pin 12) and 0x000f000d (15.13) low
# around a transfer (0x1a9b4), in the shape of the X-T5 routines 0xa9d4 (BIS, 11.5) and
# 0xaa40 (LSM6DS, 11.3); run 7 refused the 11.5/11.3 wiring ("serial wire requires
# exactly one selected part", 70.7 ms). The
# peer of SSP9 is not identified: its wire is unconnected, so its first transfer refuses.
# The X-T5 pairing of SSP1 with DMA requests 2/3 and NVIC line 99 is
# taken as requests 2n/2n+1 and line 98+n for instance n; UNVERIFIED (no code writes the
# request numbers on the X-T5).
[[device]]
base = 0xff917000
size = 0x1000
kind = "pl022"
[device.options]
source_hz = 48000000
ticks_per_second = 1000000000
receive_request = 14
transmit_request = 15
companion_irq_line = 105
[device.options.wire]
kind = "gpio-selected"
[[device.options.wire.endpoints]]
[device.options.wire.endpoints.select]
port = 15
pin = 12
active_high = false
[device.options.wire.endpoints.part]
kind = "bis-configuration-registers"
revision = [0, 0]
samples = [0, 0]
idle_high = false
# DISCOVERY (UNVERIFIED): the companion sampler (table 0x22ba0) reads 0a..0f with
# command 8a each period; the six bytes are an arbitrary at-rest input.
block = [0, 0, 0, 0, 0, 0]
[[device.options.wire.endpoints]]
[device.options.wire.endpoints.select]
port = 15
pin = 13
active_high = false
[device.options.wire.endpoints.part]
kind = "lsm6ds-configuration-registers"
temperature = 0
# DISCOVERY (UNVERIFIED): a body at rest. Zero angular rate and 1 g on Z at the
# +-2 g reset scale (0.061 mg/LSB -> 0x4000); the mounting axis is not measured.
# The companion reads OUT_TEMP..OUTZ_H_A as one burst once the peer is ready.
[device.options.wire.endpoints.part.motion]
angular_rate = [0, 0, 0]
acceleration = [0, 0, 0x4000]

[[device]]
base = 0xff912000
size = 0x1000
kind = "pl022"
[device.options]
source_hz = 48000000
ticks_per_second = 1000000000
receive_request = 4
transmit_request = 5
companion_irq_line = 100
# SSP2's peer is an unidentified controller on port 10 pins 6/7/8 (SCK/MOSI/MISO) with no
# chip select. The M-core bridges main-core requests to it as a full-duplex framed link
# (state table at local 0x20688: send a frame 0x5c2c/0x607c, acknowledge 0x5d90/0x5b10,
# frame check 0x5824). The peer's own frame repeats the last command frame it received:
# in REC the camera's M-core held 0x00000a6a, request 0xa40 (command 0x29, which the main
# core polls) with its check, in its receive word (local 0x25d3c) and its forwarded-reply
# word (0x25dc4), and the main core requires a reply's command field to match its request
# (0x1717cec). initial_frame is the frame before the first command. The same reads show
# the peer acknowledgments 0x0a008022 and 0x0900801a. Payload transfers and the
# resynchronization words are refused.
[device.options.wire]
kind = "dedicated"
[device.options.wire.part]
kind = "framed-command-peer"
initial_frame = 0x00000a6a

[[device]]
base = 0xff919000
size = 0x1000
kind = "pl022"
[device.options]
source_hz = 48000000
ticks_per_second = 1000000000
receive_request = 18
transmit_request = 19
companion_irq_line = 107
# DISCOVERY (UNVERIFIED): SSP9 slot 3 carries the companion stabilizer task's
# (0x142f0) drive output. Each servo period 0x169a2..0x169f8 raises GPIO 1.9
# (literal 0x10009), writes six 16-bit words (the halves of three 32-bit axis
# drive values at +0x718/+0x714/+0x71c) through 0x19f5c -> 0x1a5b4 and drops 1.9;
# no caller reads a received word. The peer is an off-chip actuator driver; its
# MISO is not used, so the wire is an explicit fixed low input. On the camera in REC
# SSP9 is an enabled 16-bit mode-0 master (CR0 0xf, CR1 0xa, CPSR 0x1c) whose receive
# FIFO is full and overrun (SR 0xf, RIS 0xf), and 1.9 rests low: nothing reads MISO.
[device.options.wire]
kind = "input-level"
high = false
