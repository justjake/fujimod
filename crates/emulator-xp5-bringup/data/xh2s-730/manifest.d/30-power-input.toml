# Pin control, SoC temperature, ADC, GPIO and the SPI8 power controller: the same SoC
# windows as xt5-431.d/30-power-input.toml. The power controller is client 18 of the
# X-H2S serial descriptor table 0x1c072f8 (lookup 0x169ce88): instance 8, select GPIO
# 15.15 active-high, mode 3, 8-bit words, the X-T5's descriptor 19 word for word.
[[device]]
base = 0xff904000
size = 0x1000
kind = "pin-control"

[[device]]
base = 0xff905000
size = 0x1000
kind = "soc-temperature"

[[device]]
base = 0xff906000
size = 0x1000
kind = "adc"
[device.options]
# The X-T5 placeholder samples (xt5-431.d/30-power-input.toml); the X-H2S channel
# assignment is not decoded. UNVERIFIED.
samples = [2713, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095]

[[device]]
base = 0xff907000
size = 0x1000
kind = "gpio"
[device.options]
# The same XP5 GPIO block as x100vi-131: an output pin's pad word is its data latch (+0)
# with +4 as the output enable. The firmware drives pins through +0 (0x16a0ac8, e.g. 1.14
# at companion START) and sets +8 on input pins: the companion START configures pad 0.4
# (0x16a0a18(4, 1)), which the original model (+8 enable, +4 data) then read as a driven 0,
# so the companion never reported its peer-ready status bit (STATUS 0xd; 0xf on the camera
# in REC).
pad_model = "data-latch"
# Panel selects GPIO 12.8 (LCD, client 3) and 12.10 (EVF, clients 7 and 8) start
# inactive (output latch 1), the xt5-431 assumption for the same clients.
initial_outputs = [{ port = 12, levels = 0x500 }]
# Nothing in the hot shoe: GPIO 11.4 (client 13, instance 3) reads 0. The camera's
# reset pad word for port 11 is 0x0040 (bit 4 clear; hardware-info buffer +0x2c).
initial_inputs = [{ port = 11, pin = 4, high = false }]
# DISCOVERY peer-ready (UNVERIFIED, not camera-confirmed): the companion START drives
# 1.14 high (0x17176b4) and the companion reads pad 0.4 low at boot (0x18bd8), then
# reports STATUS bit1 on its rise (0x18c54, or IRQ handler 0x18d50 on NVIC 27). The
# peer answers 1.14 on 0.4 after rise_delay ticks (ns); the delay is a board guess.
feedback = [{ port = 1, register = 0, bit = 14, input_port = 0, input_pin = 4, rise_delay = 30000000 }]
companion_input_irqs = [{ port = 0, pin = 4, line = 27, active_high = true }]


[[device]]
base = 0xff90b000
size = 0x1000
kind = "gpio-port3"

[[device]]
base = 0xff918000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
# Power controller on SPI8, chip select GPIO 15.15 active-high (client 18). The
# calendar is an arbitrary virtual input (seconds since 2000-01-01); source_hz is
# the X100VI value, UNVERIFIED.
[[device.options.endpoints]]
select = { port = 15, pin = 15, active_high = true }
[device.options.endpoints.part]
kind = "power-controller"
rtc_seconds = 0x325ffea2
rtc_valid = true
