# I2C controllers at 0xff924000 + n*0x1000. The X-H2S open routine 0x16a6d28 is the
# X-T5's 0x13871e8 instruction for instruction (it writes 3 to +0x18 of instance n),
# and the interrupt descriptor table 0x1c09f98 is byte-identical to the X-T5's
# 0x18ea918: instance n raises line 0x120 + n (xt5-431.d/30-power-input.toml and
# 44-i2c.toml). byte_ns is a functional latency, not a bus rate.
#
# Instance 1: the targets the X-T5 run declares (fuel gauge 0x36, TMD2772-class eye
# sensor 0x39, retained power registers 0x66/0x68), inherited and UNVERIFIED for the
# X-H2S; other clients are not acknowledged.
[[device]]
kind = "i2c-controller"
base = 0xff925000
size = 0x1000
[device.options]
interrupt = 289
byte_ns = 1000000
[[device.options.targets]]
address = 0x36
part = { kind = "fuel-gauge" }
[[device.options.targets]]
address = 0x39
part = { kind = "tmd2772-proximity" }
[[device.options.targets]]
address = 0x66
part = { kind = "retained-registers" }
[[device.options.targets]]
address = 0x68
part = { kind = "retained-registers" }

# Instance 2: first opened at 1.09 ms guest (run 1, write 3 to 0xff926018 from
# 0x16a6d28, caller 0x16a754c). No part on this bus is identified, so every address is
# not acknowledged.
[[device]]
kind = "i2c-controller"
base = 0xff926000
size = 0x1000
[device.options]
interrupt = 290
byte_ns = 1000000
