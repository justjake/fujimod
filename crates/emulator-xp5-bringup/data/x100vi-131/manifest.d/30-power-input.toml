# Power/input models; stock ADC/GPIO/SPI drivers remain intact.
[[device]]
base = 0xff904000
size = 0x1000
kind = "pin-control"

[[device]]
base = 0xff905000
size = 0x1000
kind = "soc-temperature"

[[device]]
base = 0xff906000
size = 0x1000
kind = "adc"
[device.options]
# ADC7 neutral compensation detent (guest cfg3722/3720:2140..2343).
# Other declared channels are thermal or open-circuit samples.
samples = [2712, 4095, 4095, 4095, 4095, 4095, 4095, 2241, 4095, 4095, 2712, 4095, 4095, 4095, 4095]

# Explicit body resistor samples, chosen inside the default 1.31 bands.
# These are synthetic input levels, not hardware measurements.
[device.options.resistor_keys]
detent_return_ns = 60000000
shutter_half_delay_ns = 30000000

[device.options.resistor_keys.layout]
shutter_half = { port = 0, pin = 0 }
shutter_full = { port = 0, pin = 1 }
rear_dial = [{ port = 5, pin = 7 }, { port = 5, pin = 9 }]
front_dial = [{ port = 5, pin = 8 }, { port = 13, pin = 5 }]

[device.options.resistor_keys.samples]
menu = 3472
back = 2227
menu_back = 1999
up = 1558
down = 3409
left = 2829
right = 2068

[[device.options.resistor_keys.initial_levels]]
pin = { port = 0, pin = 0 }
high = true
[[device.options.resistor_keys.initial_levels]]
pin = { port = 0, pin = 1 }
high = true
[[device.options.resistor_keys.initial_levels]]
pin = { port = 5, pin = 7 }
high = false
[[device.options.resistor_keys.initial_levels]]
pin = { port = 5, pin = 9 }
high = false
[[device.options.resistor_keys.initial_levels]]
pin = { port = 5, pin = 8 }
high = false
[[device.options.resistor_keys.initial_levels]]
pin = { port = 13, pin = 5 }
high = false
[[device.options.resistor_keys.initial_levels]]
pin = { port = 11, pin = 4 }
high = false
[[device.options.resistor_keys.initial_levels]]
pin = { port = 4, pin = 4 }
high = false

[[device]]
base = 0xff907000
size = 0x1000
kind = "gpio"
[device.options]
# The pad word of an output pin is its data latch (+0), with +4 as the output enable. The original
# model (+8 enable, +4 data) read every pin as an output once a reset stage had set +8 on all
# boot's frames are the same under either model.
pad_model = "data-latch"
input_irqs = [{ port = 0, pin = 0, line = 116, active_high = false }, { port = 0, pin = 1, line = 117, active_high = false }]
# EL1 handoff assumption: calibration CS12.8 is initially inactive, power
# CS12.10 low/inactive. These latch levels are not a captured reset state.
initial_outputs = [{ port = 12, levels = 0x100 }]
# Sensor power drive is sensed back on GPIO4.4.
feedback = [{ port = 4, register = 0, bit = 4, input_port = 4, input_pin = 4 }]

[[device]]
base = 0xff90b000
size = 0x1000
kind = "gpio-port3"

[[device]]
base = 0xff910000
size = 0x1000
kind = "spi-controller"
[device.options]
# Declared emulated serial input clock; not a measured camera frequency.
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 12, pin = 10, active_high = true }
[device.options.endpoints.part]
kind = "power-controller"
# Explicit RTC input (seconds since 2000-01-01), then guest time only.
# Set rtc_valid=false for the stock unset-calendar path.
rtc_seconds = 0x325ffea2
rtc_valid = true
[[device.options.endpoints]]
select = { port = 12, pin = 8, active_high = false }
[device.options.endpoints.part]
kind = "serial-calibration-registers"
# Undriven receive level is an explicit input; the stock writer discards RX.
miso_high = false
# I2C instance 1 (controllers at ff924000 + n*0x1000; interrupt 288 + n from
# the driver's selector table 0x19e6030 -> descriptors 0x19e7780). Targets carried over
# unchanged from the former battery-i2c kind: fuel gauge 0x36, retained power
# registers 0x66/0x68 and the TMD2772-class eye sensor 0x39. Other addresses
# are not acknowledged. byte_ns is a functional latency, nine bit times at 100 kHz, not a
# short delay) gives up on a byte that takes 1 ms and resets the controller mid-byte, which the
# model refuses (BCR 0x40 at 0xff925004, 1.73 s). That is Unicorn's exact, instruction-counted
# timing; the macOS HVF boot passed at 1 ms. On Unicorn 73f5a7f0, 25, 90 and 250 us passed and
# 1 ms stopped; the current pin is verified at 90 us only, and HVF at 90 us is unverified.
[[device]]
kind = "i2c-controller"
base = 0xff925000
size = 0x1000
[device.options]
interrupt = 289
byte_ns = 90000
[[device.options.targets]]
address = 0x36
part = { kind = "fuel-gauge" }
[[device.options.targets]]
address = 0x39
part = { kind = "tmd2772-proximity" }
[[device.options.targets]]
address = 0x66
part = { kind = "retained-registers" }
[[device.options.targets]]
address = 0x68
part = { kind = "retained-registers" }
