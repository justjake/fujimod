fujimod-emulator-imaging.workspace = true
fujimod-emulator-devices.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
fujimod-workspace-hack.workspace = true

[dev-dependencies]
fujimod-emulator-exr2-isp-testing.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
