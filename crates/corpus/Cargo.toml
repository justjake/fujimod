[package]
name = "fujimod-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Address-free ARM function families and locator queries"

[lib]
doctest = false

[dependencies]
fujimod-firmware.workspace = true
capstone = { version = "0.14", default-features = false, features = [
  "std",
  "full",
  "arch_arm",
  "arch_arm64",
] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
regex = "1"
sha2 = "0.11"
rusqlite.workspace = true
fujimod-workspace-hack.workspace = true
