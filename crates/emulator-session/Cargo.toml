[package]
name = "fujimod-emulator-session"
description = "Emulator sessions: a board with its EXR II resources, inputs, media, history and checkpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator.workspace = true
fujimod-emulator-cpu.workspace = true
fujimod-emulator-devices.workspace = true
fujimod-emulator-exr2-resources.workspace = true
fujimod-emulator-storage.workspace = true
fujimod-recording.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tsify.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
fujimod-workspace-hack.workspace = true

[dev-dependencies]
fujimod-emulator-ip.workspace = true
fujimod-emulator-imaging.workspace = true
fujimod-emulator-exr2-images.workspace = true
fujimod-emulator-exr2-io.workspace = true
fujimod-emulator-exr2-storage.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
