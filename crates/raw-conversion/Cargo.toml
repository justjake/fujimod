[package]
name = "fujimod-raw-conversion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Batch RAW conversion on a Fujifilm camera over PTP"

[lib]
doctest = false

[[bin]]
name = "fujimod-raw-convert"
path = "src/bin/raw_convert.rs"
test = false

[dependencies]
fujimod-usb = { path = "../usb" }
futures-lite.workspace = true
futures-timer.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
fujimod-workspace-hack.workspace = true
