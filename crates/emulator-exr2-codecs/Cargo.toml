[package]
name = "fujimod-emulator-exr2-codecs"
description = "EXR II LZ and JPEG engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-exr2-resources.workspace = true
fujimod-emulator-exr2-images.workspace = true
fujimod-emulator-image-processing.workspace = true
fujimod-emulator-exr2-plan.workspace = true
fujimod-emulator-imaging.workspace = true
fujimod-emulator-image-codecs.workspace = true
fujimod-emulator-devices.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
