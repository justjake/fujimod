[package]
name = "fujimod-camera-mount"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Camera SD files and read-only live memory as a mounted filesystem"

[dependencies]
fujimod-usb.workspace = true
fujimod-catalog.workspace = true
fujimod-catalog-bulk.workspace = true
fujimod-workflows.workspace = true
fujimod-workspace-hack.workspace = true
futures-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
fskit-rs = "=0.2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros"] }

[[bin]]
name = "fujimod-mount"
path = "src/main.rs"
