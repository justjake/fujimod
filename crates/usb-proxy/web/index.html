<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>USB proxy · FujiMod</title>
  <style>
    :root {
      font: 16px system-ui;
      color-scheme: light dark;
    }
    body {
      max-width: 760px;
      margin: 8vh auto;
      padding: 24px;
    }
    h1 {
      font-size: 28px;
    }
    form,
    nav {
      display: flex;
      gap: 12px;
      margin: 24px 0;
      flex-wrap: wrap;
    }
    input,
    button {
      font: inherit;
      padding: 10px 14px;
      border: 1px solid #8886;
      border-radius: 7px;
    }
    input {
      flex: 1;
      min-width: 200px;
    }
    button {
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td,
    th {
      text-align: left;
      padding: 14px 8px;
      border-bottom: 1px solid #8885;
    }
    output {
      display: block;
      margin: 20px 0;
    }
    code {
      font-size: 14px;
    }
  </style>
  <h1>USB proxy</h1>
  <form id="connect-form">
    <input
      id="token"
      type="password"
      aria-label="Relay token"
      placeholder="Relay token"
      autocomplete="off"
      required
    /><button id="connect">Connect</button>
  </form>
  <nav>
    <button id="add" disabled>Add USB device</button><button id="refresh" disabled>Refresh</button
    ><button id="disconnect" disabled>Disconnect</button>
  </nav>
  <output id="status">Disconnected</output>
  <table>
    <thead>
      <tr>
        <th>Device</th>
        <th>USB ID</th>
        <th>State</th>
      </tr>
    </thead>
    <tbody id="devices"></tbody>
  </table>
  <script type="module" src="./exporter.js"></script>
</html>
