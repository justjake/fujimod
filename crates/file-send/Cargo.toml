[package]
name = "fujimod-file-send"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
description = "Send files between two computers over a direct WebRTC data channel using the photo sync exchange"

[lib]
doctest = false

[[bin]]
name = "fujimod-send"
path = "src/bin/fujimod_send.rs"
test = false

[dependencies]
fujimod-sync-protocol.workspace = true
fujimod-webrtc = { path = "../webrtc" }
crc32fast = "1.5"
sha2.workspace = true
futures-lite.workspace = true
async-channel = "2"
fujimod-workspace-hack.workspace = true
