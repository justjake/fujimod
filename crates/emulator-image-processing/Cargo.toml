[package]
name = "fujimod-emulator-image-processing"
description = "Image processing: analysis laws, RAW development, resampling and separable filters, RAF reading, the scene optical blur, the clocked frame source and the ISP parameter bank"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-devices.workspace = true
fujimod-emulator-image-formation.workspace = true
fujimod-emulator-imaging.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
