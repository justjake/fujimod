[package]
name = "fujimod-emulator-ip-dmp-webgpu"
description = "WebGPU WebAssembly module for DMP command-list rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false
crate-type = ["cdylib"]

[dependencies]
ciborium.workspace = true
fujimod-emulator-gpu.workspace = true
fujimod-emulator-exr2-gpu.workspace = true
fujimod-emulator-ip-dmp.workspace = true
fujimod-emulator-devices.workspace = true
fujimod-workspace-hack.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
