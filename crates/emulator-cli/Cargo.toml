[package]
name = "fujimod-emulator-cli"
description = "The fujimod-emulator command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "fujimod-emulator"
path = "src/bin/fujimod-emulator.rs"

[features]
dynarmic = ["fujimod-emulator-boot/dynarmic"]

[dependencies]
fujimod-emulator-models = { path = "../../crates/emulator-models" }
fujimod-emulator-boot = { workspace = true, features = ["xp5-startup"] }
fujimod-camera.workspace = true
fujimod-emulator-camera.workspace = true
fujimod-catalog-configuration.workspace = true
fujimod-catalog-resolution.workspace = true
fujimod-emulator-controls.workspace = true
fujimod-emulator-cpu = { path = "../emulator-cpu" }
fujimod-emulator-exr2-board = { path = "../emulator-exr2-board" }
fujimod-emulator-gui.workspace = true
serde = { workspace = true }
serde_json = "1"
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
