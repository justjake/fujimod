[package]
name = "fujimod-emulator-cpu-hvf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
doctest = false

[dependencies]
fujimod-emulator-cpu = { path = "../emulator-cpu" }
serde_json = "1"
fujimod-workspace-hack.workspace = true

[build-dependencies]
cc = "1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
fujimod-emulator = { path = "../emulator", default-features = false }
fujimod-emulator-devices = { path = "../emulator-devices" }

[[example]]
name = "check"
path = "examples/check.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
fujimod-emulator-xp5-io = { path = "../../crates/emulator-xp5-io" }
fujimod-emulator-ip-arm = { path = "../../crates/emulator-ip-arm" }
