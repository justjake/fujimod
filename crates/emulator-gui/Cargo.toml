[package]
name = "fujimod-emulator-gui"
description = "Native emulator session host and desktop protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
fujimod-emulator-boot = { workspace = true, features = ["xp5-startup"] }
fujimod-catalog.workspace = true
fujimod-emulator-controls.workspace = true
fujimod-emulator-devices.workspace = true
fujimod-emulator-session.workspace = true
futures-lite.workspace = true
async-channel = "2"
fujimod-usb.workspace = true
fujimod-usb-proxy = { path = "../usb-proxy" }
fujimod-webrtc = { path = "../webrtc", features = ["signaling"] }
openh264 = "=0.9.9"
serde.workspace = true
serde_json.workspace = true
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
