[package]
name = "fujimod-emulator-parts-io"
description = "Serial, SPI, I2C, USB endpoint, HDMI and audio sink parts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-devices.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
tsify.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
smoltcp.workspace = true
aes = "0.9"
aes-kw = { version = "0.3", default-features = false }
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
fujimod-workspace-hack.workspace = true

[dev-dependencies]
ciborium = "0.2.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
