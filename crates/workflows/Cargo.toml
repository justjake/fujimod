[package]
name = "fujimod-workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Camera workflows composed from fujimod-usb operations: service mode, mod install"

[lib]
doctest = false

[features]
service-capture = []
artifact-build = ["dep:fujimod-firmware", "dep:fujimod-corpus"]

[dependencies]
fujimod-firmware = { workspace = true, optional = true }
fujimod-corpus = { path = "../corpus", optional = true }
fujimod-catalog.workspace = true
sha2.workspace = true
fujimod-catalog-camera.workspace = true
fujimod-catalog-bulk.workspace = true
fujimod-usb.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
fujimod-workspace-hack.workspace = true

[[example]]
name = "service_capture_plan"
required-features = ["service-capture"]

[dev-dependencies]
nusb.workspace = true
fujimod-catalog-firmware-identity.workspace = true
futures-lite.workspace = true

[[example]]
name = "flash_reader_build"
required-features = ["artifact-build"]
