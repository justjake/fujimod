[package]
name = "fujimod-emulator-cpu-dynarmic"
description = "Dynarmic ARM32 CPU backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[features]
jit = ["dep:cmake"]

[dependencies]
fujimod-emulator-cpu.workspace = true
fujimod-workspace-hack.workspace = true

[build-dependencies]
cmake = { version = "0.1", optional = true }

[target.'cfg(all(any(target_arch = "aarch64", target_arch = "x86_64"), any(target_os = "linux", target_os = "macos")))'.dev-dependencies]
fujimod-emulator-cpu-unicorn.workspace = true
