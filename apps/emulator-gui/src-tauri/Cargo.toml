[package]
name = "fujimod-emulator-gui-app"
description = "FujiMod native emulator desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "fujimod_emulator_gui_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
fujimod-catalog-configuration.workspace = true
fujimod-catalog-resolution.workspace = true
fujimod-emulator-boot = { workspace = true, features = ["xp5-startup"] }
fujimod-emulator-cpu.workspace = true
fujimod-emulator-exr2-board = { path = "../../../crates/emulator-exr2-board" }
fujimod-emulator-gui.workspace = true
fujimod-emulator-models = { path = "../../../crates/emulator-models" }
fujimod-emulator-xp5-board.workspace = true
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2"
fujimod-workspace-hack.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
