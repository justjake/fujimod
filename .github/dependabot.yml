version: 2
# Each ecosystem's minor and patch updates arrive together in one monthly PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: [/, /apps/web, /apps/usb-sharing, /bindings/javascript, /crates/simulation/tools]
    schedule:
      interval: monthly
    groups:
      javascript:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        update-types: [minor, patch]
