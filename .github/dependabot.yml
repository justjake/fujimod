version: 2
# Each ecosystem's updates, major ones included, arrive together in one monthly PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/, /apps/web, /apps/usb-sharing, /bindings/javascript, /crates/simulation/tools]
    schedule:
      interval: monthly
    groups:
      javascript:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    exclude-paths:
      - "crates/workspace-hack/Cargo.toml"
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
