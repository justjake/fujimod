name: FujiMod toolchains
description: Install the repository's pinned toolchains and development dependencies
inputs:
  javascript:
    description: Install all JavaScript packages and matching Wasm tools
    default: 'false'
  desktop:
    description: Install the Linux headers the desktop GUI crate builds against
    default: 'false'
runs:
  using: composite
  steps:
    # Caches are saved only by runs on main, and every other run restores
    # main's. Pull requests (PR CI's pull_request_target) run their code in
    # main's cache scope, so they must never save; branch runs would only add
    # entries no other run can restore and push main's out of the 10 GB limit.
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        # The version developers run; later releases refuse emsdk, whose plugin
        # downloads a moving branch that the lockfile cannot checksum.
        version: 2026.9.15
        cache_save: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target' }}
    - name: Install Linux desktop headers
      if: runner.os == 'Linux' && inputs.desktop == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev protobuf-compiler mesa-vulkan-drivers
    # One Cargo cache per job: each job builds a different set of crates and
    # targets, so a shared key would keep whichever job saved first. A failed
    # test still leaves valid dependency builds worth keeping.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: v1-rust
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target' }}
    - id: package-caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/pnpm/store
        key: packages-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
        restore-keys: packages-${{ runner.os }}-
    - shell: bash
      run: |
        pnpm config set store-dir ~/.local/share/pnpm/store
        uv sync --locked
    - name: Install TypeScript compiler for Cargo browser assets
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.javascript == 'true'
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter fujimod run setup:tooling
        echo "$GITHUB_WORKSPACE/target/tooling/bin" >> "$GITHUB_PATH"
    - if: >-
        github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target' &&
        steps.package-caches.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/pnpm/store
        key: ${{ steps.package-caches.outputs.cache-primary-key }}
