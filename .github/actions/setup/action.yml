name: FujiMod toolchains
description: Install the repository's pinned toolchains and development dependencies
inputs:
  javascript:
    description: Install all JavaScript packages and matching Wasm tools
    default: 'false'
runs:
  using: composite
  steps:
    # Pull request runs (PR CI's pull_request_target) execute the pull request's
    # code in main's cache scope, so they restore caches but never save them.
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        cache_save: ${{ github.event_name != 'pull_request_target' }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ runner.os }}-ci
        save-if: ${{ github.event_name != 'pull_request_target' }}
    - shell: bash
      run: uv sync --locked
    - name: Install TypeScript compiler for Cargo browser assets
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.javascript == 'true'
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter fujimod run setup:tooling
        echo "$GITHUB_WORKSPACE/target/tooling/bin" >> "$GITHUB_PATH"
