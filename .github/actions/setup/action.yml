name: FujiMod toolchains
description: Install the repository's pinned toolchains and development dependencies
inputs:
  javascript:
    description: Install all JavaScript packages and matching Wasm tools
    default: 'false'
  desktop:
    description: Install the Linux headers the desktop GUI crate builds against
    default: 'false'
  build:
    description: Set up compile caches and JavaScript and Python packages; test shards that only run built tests skip it
    default: 'true'
runs:
  using: composite
  steps:
    # Every run restores and saves caches. GitHub keeps them within the
    # repository's 10 GB, evicting the least recently used.
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        # The version developers run; later releases refuse emsdk, whose plugin
        # downloads a moving branch that the lockfile cannot checksum.
        version: 2026.9.15
    # Every Rust build compiles protobuf schemas, links libjpeg and runs GPU
    # tests on the software Vulkan driver; only the desktop app needs GTK.
    - name: Install Linux build packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
      run: |
        packages=(protobuf-compiler mesa-vulkan-drivers libjpeg-dev libboost-dev)
        if [ "$DESKTOP" = true ]; then
          packages+=(libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev)
        fi
        sudo apt-get update
        sudo apt-get install -y "${packages[@]}"
    # Rust compiles go through sccache's GitHub cache backend: each entry is
    # keyed by what that compile reads, so a change recompiles only the crates
    # it touches, in any job. rust-cache keeps the downloaded crates.
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      if: inputs.build == 'true'
    - shell: bash
      if: inputs.build == 'true'
      run: |
        {
          echo SCCACHE_GHA_ENABLED=true
          echo RUSTC_WRAPPER=sccache
          echo CARGO_INCREMENTAL=0
        } >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.build == 'true'
      with:
        prefix-key: v1-rust
        shared-key: crates
        cache-targets: false
        cache-on-failure: true
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.build == 'true'
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/pnpm/store
        key: packages-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
        restore-keys: packages-${{ runner.os }}-
    - shell: bash
      if: inputs.build == 'true'
      run: |
        pnpm config set store-dir ~/.local/share/pnpm/store
        uv sync --locked
    - name: Install TypeScript compiler for Cargo browser assets
      if: inputs.build == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.javascript == 'true'
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter fujimod run setup:tooling
        echo "$GITHUB_WORKSPACE/target/tooling/bin" >> "$GITHUB_PATH"
