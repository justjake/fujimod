name: Simulator feedback
description: Share a simulator bug, idea, or improvement
labels: [Simulator]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware ID
    validations:
      required: true
  - type: input
    id: mod-build
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    id: simulator-build
    attributes:
      label: Simulator version
    validations:
      required: true
  - type: upload
    id: simulator-report
    attributes:
      label: Simulator report
      description: Drag and drop the downloaded simulator report ZIP here to upload it before submitting this issue.
    validations:
      required: true
      accept: '.zip'
