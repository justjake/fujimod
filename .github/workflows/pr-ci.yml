name: PR CI
run-name: >-
  PR CI · #${{ github.event.pull_request.number }} ·
  ${{ github.event.action == 'labeled' && github.event.label.name ||
      github.event.action == 'synchronize' && 'new commits' ||
      github.event.action == 'ready_for_review' && 'marked ready' || github.event.action }}

# The checks run the pull request's own code and workflow files as an
# untrusted pull_request run: a read-only token, no secrets, and cache writes
# scoped to the pull request. PR CI requests posts the pending status and
# handles the ci:run label; PR CI result posts the outcome and merges.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    branches: [main]

permissions: {}

concurrency:
  # A request replaces the pull request's run in progress; a push or any other
  # label gets a group of its own, so it cancels nothing.
  group: >-
    pr-checks-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'synchronize' || github.event.action == 'labeled' && github.event.label.name != 'ci:run') && github.run_id || 'request' }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge into main
    # The rule PR CI requests applies: a ready pull request runs when opened
    # or marked ready, and on the ci:run label; a push waits for the label.
    if: >-
      !github.event.pull_request.draft && (
        github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
        (github.event.action == 'labeled' && github.event.label.name == 'ci:run'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # GitHub refreshes refs/pull/N/merge only when asked, so it can trail main
      # by hours. Reading the pull request asks; wait for a merge onto main's head.
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for _ in $(seq 60); do
            main=$(gh api "repos/$REPO/commits/main" --jq .sha)
            read -r mergeable sha < <(gh api "repos/$REPO/pulls/$NUMBER" --jq '"\(.mergeable) \(.merge_commit_sha)"')
            if [ "$mergeable" = false ]; then
              echo "::error::The pull request conflicts with main; rebase it"; exit 1
            fi
            if [ "$mergeable" = true ] &&
              [ "$(gh api "repos/$REPO/commits/$sha" --jq '.parents[0].sha')" = "$main" ]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub did not merge the pull request onto main's head"; exit 1

  checks:
    name: Checks
    needs: merge
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.merge.outputs.sha }}
