name: Web checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'bindings/javascript/**'
      - 'bindings/generator/**'
      - 'crates/usb/**'
      - 'crates/defs/**'
      - 'Cargo.*'
      - 'bindings/python/python/fujimod/presentation/controls.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'bindings/javascript/**'
      - 'bindings/generator/**'
      - 'crates/usb/**'
      - 'crates/defs/**'
      - 'Cargo.*'
      - 'bindings/python/python/fujimod/presentation/controls.json'
      - '.github/workflows/web.yml'
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Set up USB Wasm tools
        working-directory: .
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          npm --prefix bindings/javascript ci
          npm --prefix bindings/javascript run setup:tooling
      - run: npm ci
      - run: npm run check
      - name: Check USB protocol core
        working-directory: .
        run: cargo test -p fujimod-usb --features testing
      - run: npm test
      - run: npm run build
      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:dev-tools:browser
