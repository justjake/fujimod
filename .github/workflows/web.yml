name: Web checks
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up USB Wasm tools
        working-directory: .
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          pnpm install --frozen-lockfile
          pnpm --filter fujimod run setup:tooling
      - run: pnpm --filter fujimod-web run check
      - name: Check USB protocol core
        working-directory: .
        run: cargo test -p fujimod-usb -p fujimod-usb-app80
      - name: Check shared simulation
        working-directory: .
        run: cargo test --locked --manifest-path crates/simulation/Cargo.toml --lib
      - run: pnpm --filter fujimod-web test
      - run: pnpm --filter fujimod-web run build
      - name: Install browser test runtimes
        run: pnpm --filter fujimod-web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter fujimod-web run test:prerender
      - run: pnpm --filter fujimod-web run test:dev-tools:browser
