name: Publish Fujimod to Cloudflare
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (blank uses newest published release)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    defaults:
      run:
        working-directory: apps/web
    # Review branches cannot redeploy the web app, even via workflow dispatch.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.release.target_commitish == 'main')
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://fujimod.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - name: Fetch model LFS objects
        run: git lfs pull
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Set up USB Wasm tools
        working-directory: .
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          npm --prefix bindings/javascript ci
          npm --prefix bindings/javascript run setup:tooling
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Fetch verified release artifacts
        run: npm run prepare:release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - run: npm run build
        env:
          FUJIMOD_SIGNAL_URL: wss://share.fujimod.com/usb-proxy/signal
      - name: Deploy static site to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1edee8e500839ee3dbf7338f44503075
          workingDirectory: apps/web
          wranglerVersion: '4.151.1'
          command: deploy
