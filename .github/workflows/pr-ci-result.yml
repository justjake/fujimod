name: PR CI result

# Runs main's copy when a PR CI run finishes, without checking out any code.
# It posts the CI required status for the tested commit and lands an admin's
# pull request with auto-merge on.
on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]

permissions: {}

jobs:
  result:
    name: Post result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: write
      pull-requests: read
    outputs:
      land: ${{ steps.post.outputs.land }}
      number: ${{ steps.post.outputs.number }}
      sha: ${{ steps.post.outputs.sha }}
    steps:
      - id: post
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # A run whose checks were skipped (a push waiting for ci:run, another
          # label) posts nothing. A replaced run was canceled; its replacement
          # owns the status.
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[]')
          merge=$(jq -r 'select(.name == "Merge into main") | .conclusion' <<< "$jobs")
          result=$(jq -r 'select(.name == "Checks / CI required") | .conclusion' <<< "$jobs")
          [ "$merge" = failure ] && result=unmerged
          echo "number=" >> "$GITHUB_OUTPUT"
          case "$result" in
            success) state=success description='Passed' ;;
            failure) state=failure description='Failed: see the run' ;;
            unmerged) state=failure description='Could not merge into main: see the run' ;;
            *) echo "Checks did not finish ($result); nothing to post."; echo "land=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          gh api -X POST "repos/$REPO/statuses/$SHA" -f context='CI required' \
            -f state="$state" -f description="$description" -f target_url="$RUN_URL" > /dev/null
          # The pull request whose head is still this commit; a fork's run
          # carries no pull request in its event, so look it up by head branch.
          pull=$(gh api "repos/$REPO/pulls?state=open&base=main&head=$HEAD_OWNER:$HEAD_BRANCH" \
            --jq "[.[] | select(.head.sha == \"$SHA\")][0] // empty")
          land=false
          if [ "$state" = success ] && [ -n "$pull" ]; then
            # GitHub's auto-merge waits for a code owner's approval, which an
            # admin cannot give their own pull request.
            author=$(jq -r .user.login <<< "$pull")
            if [ "$(jq -r '.auto_merge != null' <<< "$pull")" = true ] &&
              [ "$(gh api "repos/$REPO/collaborators/$author/permission" --jq .permission)" = admin ]; then
              land=true
              echo "number=$(jq -r .number <<< "$pull")" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "land=$land" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge
    needs: result
    if: needs.result.outputs.land == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only main may deploy to this environment: its merge key is a
    # fine-grained token for this repository alone, with contents and pull
    # requests write, from an account that bypasses the approval rule.
    environment: pr-ci-merge
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PR_CI_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.result.outputs.number }}
          SHA: ${{ needs.result.outputs.sha }}
        run: |
          gh api -X PUT "repos/$REPO/pulls/$NUMBER/merge" -f merge_method=rebase -f sha="$SHA" > /dev/null
          echo "Merged #$NUMBER into main by rebase." >> "$GITHUB_STEP_SUMMARY"
