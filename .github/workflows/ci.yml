name: CI
on:
  workflow_dispatch:
  # Runs on main keep the caches warm: GitHub shares the default branch's
  # caches with pull requests, and pull request runs only read them.
  push:
    branches: [main]
  # PR CI calls this with the pull request's head commit.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out and test
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # A call from PR CI runs in main's context, so the group names the tested commit.
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  python-quality:
    name: Python lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
      - uses: ./.github/actions/setup
        with:
          javascript: 'true'
      - run: mise run python-lint
      - if: ${{ !cancelled() }}
        run: mise run python-format-check
      - if: ${{ !cancelled() }}
        run: mise run python-typecheck

  rust-quality:
    name: Rust format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - run: mise run rust-format-check
      - if: ${{ !cancelled() }}
        name: Check catalog record formatting
        run: mise run catalog-format-check
      - name: Build the emulator GUI frontend the desktop crate embeds
        run: pnpm --filter @fujimod/emulator-gui run build
      - if: ${{ !cancelled() }}
        run: mise run rust-check
      - name: Check the generated workspace-hack crate
        if: ${{ !cancelled() }}
        run: mise run rust-hack-check

  javascript-quality:
    name: TypeScript lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
      - uses: ./.github/actions/setup
        with:
          javascript: 'true'
      - run: pnpm run check:typescript-policy
      - run: pnpm run check:types
      - run: pnpm --filter fujimod run build
      - run: mise run javascript-lint
      - run: pnpm --filter fujimod-web exec -- playwright install --with-deps chromium
      - if: ${{ !cancelled() }}
        run: mise run web-check
      - if: ${{ !cancelled() }}
        run: mise run javascript-format-check

  # The Rust tests compile once, then run in parallel shards. Doc tests run
  # in the build job because nextest cannot archive them.
  rust-test-build:
    name: Rust test build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
      - run: mise run rust-test-archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests
          path: target/nextest/rust-tests.tar.zst
          retention-days: 1
          compression-level: 0

  rust-doc-tests:
    name: Rust doc tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
      - run: mise run rust-doc-test

  rust-tests:
    name: Rust tests ${{ matrix.shard }}/3
    needs: rust-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests
          path: target/nextest
      - run: mise run rust-test-shard -- ${{ matrix.shard }}/3

  desktop-app:
    name: Desktop app tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Build the emulator GUI frontend the desktop crate embeds
        run: pnpm --filter @fujimod/emulator-gui run build
      - run: mise run rust-desktop-test

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
      - run: mise run python-test

  javascript-tests:
    name: JavaScript and Wasm tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          lfs: true
          persist-credentials: false
          # PR CI checks out fork pull requests from pull_request_target; these
          # jobs hold a read-only token and no secrets.
          allow-unsafe-pr-checkout: true
      - uses: ./.github/actions/setup
        with:
          javascript: 'true'
      - run: mise run javascript-node-test
      - if: ${{ !cancelled() }}
        run: mise run rust-wasm-test
      - if: ${{ !cancelled() }}
        run: mise run web-test
      - if: ${{ !cancelled() }}
        # The build reads the published release history from GitHub's API;
        # unauthenticated requests from shared runner addresses stall.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run web-build
      - if: ${{ !cancelled() }}
        run: pnpm --filter fujimod-usb-sharing run check

  required:
    name: CI required
    if: always()
    needs:
      [
        python-quality,
        rust-quality,
        javascript-quality,
        rust-test-build,
        rust-tests,
        python-tests,
        javascript-tests,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = 'success,success,success,success,success,success,success,success,success'
