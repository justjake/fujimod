name: CI
on:
  workflow_dispatch:
  # Runs on main keep the caches warm: GitHub shares the default branch's
  # caches with pull requests, and pull request runs only read them.
  push:
    branches: [main]
  # PR CI calls this with the pull request's head commit.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out and test
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # A call from PR CI runs in main's context, so the group names the tested commit.
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  python-quality:
    name: Python lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          javascript: 'true'
      - run: mise run python-lint
      - if: ${{ !cancelled() }}
        run: mise run python-format-check
      - if: ${{ !cancelled() }}
        run: mise run python-typecheck

  rust-quality:
    name: Rust format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Install JPEG development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev
      - run: mise run rust-format-check
      - if: ${{ !cancelled() }}
        name: Check catalog record formatting
        run: mise run catalog-format-check
      - if: ${{ !cancelled() }}
        run: mise run rust-check
      - name: Check the generated workspace-hack crate
        if: ${{ !cancelled() }}
        run: mise run rust-hack-check

  javascript-quality:
    name: TypeScript lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          javascript: 'true'
      - run: pnpm run check:typescript-policy
      - run: pnpm run check:types
      - run: pnpm --filter fujimod run build
      - run: mise run javascript-lint
      - run: pnpm --filter fujimod-web exec -- playwright install --with-deps chromium
      - if: ${{ !cancelled() }}
        run: mise run web-check
      - if: ${{ !cancelled() }}
        run: mise run javascript-format-check

  native-tests:
    name: Rust and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: recursive
          lfs: true
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Install coverage and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev
      - run: mise run rust-test
      - name: Python tests
        if: ${{ !cancelled() }}
        run: mise run python-test

  javascript-tests:
    name: JavaScript and Wasm tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          javascript: 'true'
      - run: mise run javascript-node-test
      - if: ${{ !cancelled() }}
        run: mise run rust-wasm-test
      - if: ${{ !cancelled() }}
        run: mise run web-test
      - if: ${{ !cancelled() }}
        run: mise run web-build
      - if: ${{ !cancelled() }}
        run: pnpm --filter fujimod-usb-sharing run check

  required:
    name: CI required
    if: always()
    needs: [python-quality, rust-quality, javascript-quality, native-tests, javascript-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = 'success,success,success,success,success'
