name: Web deploy
# The schedule is an exception to running workflows only when started by hand;
# remove it to keep deploys manual.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if fujimod.com already serves this commit
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: web-deploy
  cancel-in-progress: false
env:
  SITE: https://fujimod.com/
jobs:
  changed:
    name: Compare with the deployed commit
    if: github.repository == 'justjake/fujimod' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - id: compare
        env:
          FORCE: ${{ inputs.force || false }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          deployed=$(curl -fsS "${SITE}deployment.json" | jq -r 'select(.dirty == false) | .commit' || true)
          echo "main: $HEAD_SHA; deployed: ${deployed:-unknown}"
          if [ "$FORCE" = true ] || [ "$deployed" != "$HEAD_SHA" ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo deploy=false >> "$GITHUB_OUTPUT"
          fi
  checks:
    name: Web checks
    needs: changed
    if: needs.changed.outputs.deploy == 'true'
    uses: ./.github/workflows/web.yml
  deploy:
    name: Deploy fujimod.com
    needs: [changed, checks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fujimod.com/
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up USB Wasm tools
        working-directory: .
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          pnpm install --frozen-lockfile
          pnpm --filter fujimod run setup:tooling
      - name: Install browser test runtimes
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Deploy with the assets fujimod.com serves
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FUJIMOD_SIGNAL_URL: wss://share.fujimod.com/usb-proxy/signal
        run: pnpm run deploy -- --carry-from "$SITE"
