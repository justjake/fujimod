[project]
name = "fujimod-development"
version = "0.0.0"
requires-python = ">=3.14"
license = "GPL-2.0-only"
license-files = ["LICENSE"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
preview = true
extend-exclude = [
  "target",
  "node_modules",
  "dist",
  "dist-local-preview",
  "pkg",
  "mods/lib/settings/upstream",
  "crates/emulator-cpu-unicorn/vendor",
]

[tool.ruff.lint]
# Astral's recommended core groups, plus complete signatures and stub hygiene.
select = ["E4", "E7", "E9", "F", "UP", "B", "SIM", "I", "ANN", "PYI", "PGH003", "RUF100"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = [
  "target/python-types",
  "typings",
  "bindings/python/python",
  "bindings/python",
  "bindings/python/tests",
  "scripts/ci",
  "scripts/git",
]

[tool.ty.src]
exclude = [
  "target",
  "**/node_modules",
  "**/dist",
  "**/dist-local-preview",
  "bindings/javascript/pkg",
  "mods/lib/settings/upstream",
  "crates/emulator-cpu-unicorn/vendor",
]

[tool.ty.rules]
# Astral's stricter-checking guidance; no blanket ignores or untyped returns.
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "error"
unsound-assignment = "error"
unsound-return = "error"
unsound-yield = "error"
unused-ignore-comment = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = [
  ".*",
  "node_modules",
  "target",
  "build",
  "dist",
  "dist-local-preview",
  "pkg",
  "upstream",
  "crates/emulator-cpu-unicorn/vendor",
]
addopts = "--strict-config --strict-markers --continue-on-collection-errors -ra"

[dependency-groups]
dev = [
  "pillow>=12.3",
  "playwright>=1.65.2",
  "pyodide-py>=314.0.8",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "ruff>=0.17.6",
  "ty>=0.0.109",
]
