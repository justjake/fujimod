[package]
name = "fujimod-python-remote"
description = "Python bindings for remote cameras over USB and emulator boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[features]
emulator = ["dep:fujimod-python-base", "dep:fujimod-emulator", "fujimod-remote/board"]

[dependencies]
fujimod-emulator-session.workspace = true
fujimod-python-usb-base = { path = "../usb-base" }
fujimod-python-base = { path = "../base", optional = true }
fujimod-emulator = { workspace = true, optional = true }
fujimod-catalog.workspace = true
fujimod-catalog-remote.workspace = true
fujimod-remote = { workspace = true, default-features = false, features = ["ff80"] }
fujimod-usb.workspace = true
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-lite.workspace = true
fujimod-workspace-hack.workspace = true
