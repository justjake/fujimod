[project]
name = "fujimod"
version = "0.1.0"
requires-python = ">=3.14"
description = "FujiMod camera tools"
readme = "README.md"
license-files = ["NOTICE"]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1"]
walkthroughs = ["pillow>=12.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
