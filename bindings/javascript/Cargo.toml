[package]
name = "fujimod-javascript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
fujimod-usb.workspace = true
serde_json.workspace = true
async-channel = "2"
async-lock = "3"
fujimod-usb-proxy = { path = "../../crates/usb-proxy" }
futures-timer.workspace = true
fujimod-workflows.workspace = true
fujimod-catalog.workspace = true
fujimod-recovery.workspace = true
fujimod-catalog-bulk.workspace = true
fujimod-catalog-camera.workspace = true
fujimod-catalog-firmware-identity.workspace = true
fujimod-catalog-service.workspace = true
fujimod-usb-app80.workspace = true
fujimod-usb-app80-types.workspace = true
nusb.workspace = true
js-sys.workspace = true
web-sys = { version = "0.3", features = ["UsbDevice"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
futures-channel.workspace = true
futures-lite.workspace = true

[build-dependencies]
fujimod-bindgen = { path = "../generator" }

[dependencies]
fujimod-workspace-hack.workspace = true
