# Native emulator builds use release optimization for the runtime library.
# Sixteen codegen units with incremental compilation boot the X70 firmware as
# fast as one unit did and cut an emulator-device rebuild from about 1,040 to
# 260 CPU seconds; ThinLTO keeps cross-crate inlining (without it the boot took
# 7% more CPU). CI's rust-cache disables incremental compilation.
# Every optimized local build: `cargo build --release`, the Python extension,
# and the worker share this one set of artifacts. FujiMod crates use
# opt-level 2 without LTO and with incremental compilation, dependencies
# opt-level 3. A device edit rebuilds the X70 boot binary in about 9 CPU
# seconds; ThinLTO would add about 40 seconds of linking to each build for a
# boot about 5% faster.
[profile.release]
opt-level = 2
lto = "off"
codegen-units = 256
incremental = true
# Release builds carry no debug info; stripping the rest from the 85 MB Python
# extension took 0.6 s of every rebuild. Published artifacts strip it below.
strip = "none"

[profile.release.package."*"]
opt-level = 3

# Published artifacts only (wheels, the web emulator): ThinLTO.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"

# Build executables stay unstripped; distribution profiles apply to libraries.
# The binding generator's build scripts parse the App80 and service sources on
# every USB or service edit, so they are optimized.
[profile.release.build-override]
strip = "none"
opt-level = 3
