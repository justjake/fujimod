# VERIFIED X-E5 1.12 SLVS-EC PHY base. The reset clears +0x0 bit 0,
# preserves bit 1, and polls bit 0 for 1 (0x0335c8d4, 0x014837a8,
# 0x01483818). The global accessors also use +0x4, +0x8, and +0xc
# (0x01483850, 0x014838dc, 0x01483978).
# The lane stride is 0x100 (0x01483a10). The initialization tables program
# lane words +0x04 and +0x44 (0x034f5e34, 0x04375b70). Calibration updates
# bits 11:8 at +0x104 and +0x204 (0x034f6040). The diagnostic table lists
# lane offsets through +0x4c (0x04360c20, 0x04360cb0).
# Exact aperture size and general last-write read-back are UNVERIFIED.
[[device]]
base = 0xff944000
size = 0x1000
kind = "imaging-phy"
