# X-E5 1.12 VERIFIED: 0x15592f8 selects descriptor 4 (0x1a5fe90), which specifies
# SSP 9, GPIO 15.14 active low, clock selector 2, divisor 16, mode 0, and 8 bits.
# 0x1495228 programs the frame format at 0xff919000 with a 0x1000 instance stride.
# 0x15593c8 and 0x1494a34 drive the descriptor's select before transfer;
# 0x1494b54 drives it high afterward. This replaces the inherited GPIO 12.8.
# 0x1559404 sends the LCD command shifted left once, so writes clear bit 0.
# The read-flag interpretation and 48 MHz source are UNVERIFIED.
# The panel's replies remain HARDWARE-ONLY. MISO low during writes is a model input.
# The 0x1000 aperture follows the controller stride.
[[device]]
base = 0xff919000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 15, pin = 14, active_high = false }
part = { kind = "serial-command-registers", bits = 8, mode = 0, read_flag = 0x01, miso_high = false }

# X-E5 1.12 VERIFIED: 0x155afb8 selects descriptor 0xc (0x1a60010) for EVF
# writes. GPIO 12.10 is active low as before. The driver uses SSP 5
# at 0xff915000, mode 0 instead of mode 2, clock selector 2, divisor 20, and 8 bits.
# 0x155c7f8 chooses descriptor 0xb (0x1a5ffe0) for the 16-bit read path on the
# same select, and 0x155c848 sends the read frame. Replies remain HARDWARE-ONLY.
# The 48 MHz source and the MISO level during writes are UNVERIFIED.
[[device]]
base = 0xff915000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 12, pin = 10, active_high = false }
part = { kind = "serial-command-registers", bits = 8, mode = 0, miso_high = false }
