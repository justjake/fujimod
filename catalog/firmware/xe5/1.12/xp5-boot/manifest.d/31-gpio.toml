# GPIO block. The panel selects and the accessory input come from the run's GPIO input block, not from here.
[[device]]
base = 0xff907000
size = 0x1000
kind = "gpio"
[device.options]
# Stabilizer GPIO model inherited from the X-H2S. X-E5 application code enables output
# 1.14 at 0x01519444 and clears its +0 latch at 0x015178fc. The X-E5 companion
# reports readiness through mailbox status at local 0x3f76 and 0x3f9c.
# UNVERIFIED for this startup path: the pad read behavior, a feedback wire to 0.4,
# its 30 ms delay and high latch, and a rising input interrupt on NVIC 27.
# Emulator finding (not firmware evidence): without the data-latch pad model the shooting
# screen stays black; removing the feedback or the NVIC 27 route leaves the screen and the
# key walk unchanged. Only the pad model is needed to light the screen.
pad_model = "data-latch"
feedback = [{ port = 1, register = 0, bit = 14, input_port = 0, input_pin = 4, rise_delay = 30000000, latch_high = true }]
companion_input_irqs = [{ port = 0, pin = 4, line = 27, active_high = true }]
# Shutter release: the scanner rows (kind 4, sources 0 and 1; physical keys 25 and 26) read GPIO 0.0 (S1) and 0.1 (S2),
# active low, and the registration path takes their interrupt IDs from records 1 and 2 of the table at 0x01a62c58: 116
# and 117, as on the X-T5. Drive them with `--gpio 0:0=0@MS` (press) and `--gpio 0:0=1@MS` (release).
input_irqs = [{ port = 0, pin = 0, line = 116, active_high = false }, { port = 0, pin = 1, line = 117, active_high = false }]
