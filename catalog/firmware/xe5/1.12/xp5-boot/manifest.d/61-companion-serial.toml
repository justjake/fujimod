# VERIFIED on X-E5 1.12: companion descriptor 0x3a1dc selects SSP1.
# Local 0x3a2e..0x3a54 derives its data and status addresses, and 0x39bc reads status.
# Descriptor 0x3a1f1 selects clock polarity and phase 1, with 8-bit words and
# divisor 6 (descriptor field at 0x3a1ec). The source rate and the DMA/IRQ
# wiring below are inherited. IRQ 99 appears in descriptor 0x3a014.
[[device]]
base = 0xff911000
size = 0x1000
kind = "pl022"
[device.options]
source_hz = 48000000
# Emulator timebase in ticks per second.
ticks_per_second = 1000000000
receive_request = 2
transmit_request = 3
companion_irq_line = 99
[device.options.wire]
kind = "gpio-selected"
[[device.options.wire.endpoints]]
[device.options.wire.endpoints.select]
# VERIFIED: companion 0xb734 asserts 11.5 low and 0xb774 releases it high.
port = 11
pin = 5
active_high = false
[device.options.wire.endpoints.part]
kind = "bis-configuration-registers"
# HARDWARE-ONLY: 0xe810 and 0xe82e extract revision nibbles from reads of
# registers 0x21 and 0x22. No required values established.
revision = [0, 0]
# HARDWARE-ONLY: sampled values and idle MISO level.
samples = [0, 0]
idle_high = false
# VERIFIED transaction: local 0x23cd8 sends the seven-byte entry at 0x3a74c
# beginning with command 0x8a. Local 0x23ce2 reads the response.
# HARDWARE-ONLY: the six inherited response bytes.
block = [0, 0, 0, 0, 0, 0]
[[device.options.wire.endpoints]]
[device.options.wire.endpoints.select]
# VERIFIED: companion 0xb7be asserts 11.3 low and 0xb7e8 releases it high.
port = 11
pin = 3
active_high = false
[device.options.wire.endpoints.part]
kind = "lsm6ds-configuration-registers"
# VERIFIED protocol: 0xe888 writes 0x05 to register 0x12, 0xe8aa waits for
# reset bit 0 to clear on the polling path, and 0xe90e compares WHO_AM_I to 0x6c.
# HARDWARE-ONLY: temperature and motion samples.
temperature = 0
motion = { angular_rate = [0, 0, 0], acceleration = [0, 0, 0] }
