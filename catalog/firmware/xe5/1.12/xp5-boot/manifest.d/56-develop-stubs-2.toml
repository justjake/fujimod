# Taken from the X-T5 4.31 board fragment of the same name (the SoC profile's imaging windows are shared
# by the XP5 bodies), keeping only the windows the X-E5 manifest does not declare yet. Every value is
# INHERITED and UNVERIFIED for the X-E5: its use of these blocks has not been read from its firmware.

[[device]]
base = 0xffd27000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x10, mode = "constant", value = 0x10001 },
  { offset = 0x14, mode = "constant", value = 0x10001 },
]
irq = 215
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x30, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x34, mode = "w1c", status_offset = 0x30, bits = 0x1 }
irq_mask_offset = 0x38
irq_mask_bit = 0
irq_mask_set_masks = false

# CONDITIONAL: KB (recbfSubShadeRawProcess, step 0x0, sequence 0xd only; long-exposure
# dark-frame subtraction). Not used by a normal single JPEG. Same register family as RTCH.
# Process 0x2d3a7e0, open 0x2c61ef4, start 0x2c62178, ISR 0x2c61b9c.
#  +0x00  0x2c61fec writes 0; 0x2c61ffc polls until bit 0 reads 1                      -> constant 1
#  +0x10  0x2c620c4 (run) and 0x2c6211c (stop) poll until (v & 0x10001) == 0x10001      -> constant
#  +0x14  0x2c620e0 writes 0x10001 (run) / 0x2c62108 writes 0 (stop)
#  +0x38  0x2c6214c writes 1 / 0x2c6216c writes 0 = IRQ enable
#  +0x100 0x2c62258 reads bit 0 before start; 0 skips an optional cache loop (0x2c62274).
#  +0x04  0x2c622ac writes 1 = START (last write of 0x2c62178)
#  +0x34  ISR 0x2c6209c writes 1 = clear; the ISR reads no status word (callback only)
[[device]]
base = 0xffd21000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x10, mode = "constant", value = 0x10001 },
]
irq = 212
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x30, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x34, mode = "w1c", status_offset = 0x30, bits = 0x1 }
irq_mask_offset = 0x38
irq_mask_bit = 0
irq_mask_set_masks = false
