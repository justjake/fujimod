# X-E5 1.12 VERIFIED: 0x15602a0 reads the word at 0xff90e200, and 0x15602a4 masks
# bit 0. In 0x15626ec, zero posts event 0x1854 (0x1560b64); the dispatch row at
# 0x1aff458 points to 0x15621a0, which initializes HDMI at 0xff9c0000. A high bit
# schedules a recheck, and 0x1560fe8 exits the hot-plug poll when the bit goes high.
# The no-cable initial condition is a session input.
[[device]]
base = 0xff90e200
size = 4
kind = "hdmi-hot-plug-status"
[device.options]
connected_level = 0
