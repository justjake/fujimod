# X-E5 1.12 boot control. When the application leaves its main loop (auto power off, power
# switch), 0x15fc364 calls 0x1520d8c and then 0x14992dc, which reaches 0x14989f8 -> 0x1498ac4.
# 0x1498ac4 writes 0 (argument 0, 0x1498ae4) or 1 (argument 1, 0x1498afc) to 0xff90e400 through
# the word writer 0x9ed80. That word belongs to the boot-control block the ROM start already
# models (0xff90e000 straps, 0xff90e400 control, 0xfa140000), so the loader start declares the
# same block. The ROM start replaces this entry with its own. source_straps = 1 is the value of
# the setup handoff (setup-handoff.toml) and is UNVERIFIED for the X-E5, as there; the control
# words start at 0 as in the ROM start.
[[device]]
base = 0xff90e000
size = 4
kind = "boot-control"
[device.options]
source_straps = 1
initial_control = 0
initial_primary_control = 0
