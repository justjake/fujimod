# to 0xff9a1000, then polls bit 0 there at 0x155f2ec until it is set. The word at
# +0x18 ends at the declared window boundary. Initial configuration words of 0,
# the full ready word, and immediate completion are UNVERIFIED device behavior.
[[device]]
