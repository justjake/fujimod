# SSP instance 4 at 0xff914000, the window the X-T5 and X100VI boards give their audio codec
# (0x1495258 reads it first). The peer, its chip select (GPIO 12.7, active low), 16-bit words, mode 0
# and the 48 MHz source are the X-T5 board's declaration, INHERITED and UNVERIFIED for the X-E5: the
# X-E5's driver descriptor is not read yet. The peer is a command/data register endpoint, not a
# model of the codec: writes are retained and a read is refused because the reply is unknown.
[[device]]
base = 0xff914000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000

[[device.options.endpoints]]
select = { port = 12, pin = 7, active_high = false }
part = { kind = "serial-command-registers", bits = 16, mode = 0, read_flag = 0x8000, data_words = 1, miso_high = false }
