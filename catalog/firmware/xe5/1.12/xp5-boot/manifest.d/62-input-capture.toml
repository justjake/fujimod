# Input-capture banks (five channels at 0xff928000, three at 0xff929000, stride 0x20) and the USB
# connection status bit, declared as on the X-T5 board. The companion's first access is a word write
# of 0 at 0xff928040 (companion code 0x25fd4). The DMA request lane 32 is the X100VI value; every
# value here is INHERITED and UNVERIFIED for the X-E5.
[[device]]
base = 0xff928000
size = 0x1000
kind = "input-capture"
[device.options]
dma_transmit = [{ channel = 2, request = 32 }]

[[device]]
base = 0xff929000
size = 0x1000
kind = "input-capture"

# USB cable or jig connection status in bit 0; the default input is disconnected.
[[device]]
base = 0xff90e300
size = 4
kind = "usb-connection-status"
