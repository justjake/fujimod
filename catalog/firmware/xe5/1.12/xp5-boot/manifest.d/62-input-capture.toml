# VERIFIED: two input-capture banks at 0xff928000 (channels 0..4) and 0xff929000 (channels 5..7)
# with stride 0x20 per channel and 0x1000 between banks. Both the application (0x014cb6b4,
# 0x014cbe1c, 0x014cbe98, 0x014cbf4c, 0x014cbfa4, 0x014cc008, 0x014cc080) and the companion
# (0x29be0, 0x29c10, 0x29c30, 0x29c78, 0x29cc8, 0x29d28, 0x29d68, via its 0x5f9xxxxx alias) address
# +0x00 control, +0x04 transmit, +0x08 status/count, +0x0c interrupt status (masked with 0x10001),
# and +0x10 capture data; the application also accesses 0xff9290c0 and 0xff9290c4 (0x014cb6c8,
# 0x014cb76c, 0x014cba48). Exact hardware decode bounds beyond +0x90/+0xc4 are UNVERIFIED.
# VERIFIED dma_transmit: the companion binds capture channel 2 (descriptor 0x3a4b0 via 0x29bc8;
# transmit target 0xff928044 at 0x03e26..0x03e2a, control write 0 to 0x5f928040 via 0x25fd4) to DMA
# descriptor 2 (0x3a168 via 0x25e5c: DMA channel 4, request 32 / 0x20, routed to 0x5f90e508 in
# 0x256c0 after clamping in 0x24258).
[[device]]
base = 0xff928000
size = 0x1000
kind = "input-capture"
[device.options]
dma_transmit = [{ channel = 2, request = 32 }]

[[device]]
base = 0xff929000
size = 0x1000
kind = "input-capture"
[device.options]
dma_transmit = [{ channel = 0, request = 35 }]

# VERIFIED: USB connection status word at 0xff90e300 (size 4), bit 0 tested in 0x032e9808
# (0x032e9810..0x032e9814), 0x03072d0c, 0x03072d2c (paired with 0xffc0c70c), 0x01617fd4 (latches
# bit 0 and posts 0x3048), 0x016195fc, 0x015e5f78, 0x008ff25c, and 0x0326e674 (0x0326ece8).
# Disconnected default is a scenario input (HARDWARE-ONLY).
[[device]]
base = 0xff90e300
size = 4
kind = "usb-connection-status"
