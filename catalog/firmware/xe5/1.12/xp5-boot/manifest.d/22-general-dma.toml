# VERIFIED: eight banks spaced 0x1000 at 0xff930000 through 0xff937000 (0x014ada6c).
# companion_irq_base = 83 is carried over from the other XP5 boards and is
# UNVERIFIED for the X-E5; it only matters once the guest releases the M-core.
[[device]]
base = 0xff930000
size = 0x8000
kind = "general-dma"

[device.options]
companion_irq_base = 83
# VERIFIED: 0x014ab66c indexes the logical IDs at 0x01a61920 by hardware
# channel. The records at 0x01a63198 through 0x01a63288 map channels 0 through
# 15 to A53 INTIDs 237 through 252. Lens RX channel 2 and TX channel 3 map
# to 239 and 240 (0x01a631b8 and 0x01a631c8).
a53_irq_base = 237

[[device]]
base = 0xff90e748
size = 0x40
kind = "dma-address-high"

[[device]]
base = 0xff90e500
size = 0x20
kind = "dma-request-routing"
