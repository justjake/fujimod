# Eight banks spaced 0x1000 at ff930000..ff937000, as on the other XP5 bodies.
# companion_irq_base = 83 is carried over from the other XP5 boards and is
# UNVERIFIED for the X-E5; it only matters once the guest releases the M-core.
[[device]]
base = 0xff930000
size = 0x8000
kind = "general-dma"

[device.options]
companion_irq_base = 83
# The A53 driver also takes channel completions on the GIC (INTID 237 + channel on the X-T5 and
# X-H2S). UNVERIFIED for the X-E5, carried over so the reset stage's completion callbacks can fire.
a53_irq_base = 237

[[device]]
base = 0xff90e748
size = 0x40
kind = "dma-address-high"

[[device]]
base = 0xff90e500
size = 0x20
kind = "dma-request-routing"
