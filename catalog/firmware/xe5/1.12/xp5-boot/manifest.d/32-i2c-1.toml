# I2C instance 1. Base 0xff925000, size 0x1000, interrupt 289: VERIFIED (driver 0x14a6198..0x14a6380
# and 0x14a6930 address 0xff924000 + (n << 12) for n < 4 at 0x14a63a4, first write at 0xff925018
# from 0x14a61b4; 0x14a69bc maps selector 0x1a614c8[1] = 4 through 0x14be12c to GIC line 289 at
# 0x1a62c98, ISR 0x14a6900 -> 0x14a64a0(1)). Status bits: 0x14a6930 polls BSR (+0x00) bit 7 (BB);
# 0x14a69bc checks BCR (+0x04) bit 4 (MSS), BSR bit 5 (AL) and BC2R (+0x1c) bits 5:4; 0x14a64a0
# checks BCR bits 7/4 and BSR bits 5/4/3/0.
#
# Declared bus-1 target addresses VERIFIED in client table 0x1a614d8 (lookup 0x14a7190):
# - 0x36 (idx 8, 0x1a61558): fuel gauge (0x14ff060/0x14ff140/0x14ff2f0/0x14ff384/0x14ff44c/0x14ff78c
#   access regs 0x04, 0x0a, 0x0c, 0x0e, 0x18, 0x1a, 0x3e, 0x40, 0x80).
# - 0x39 (idx 2, 0x1a614f8): TMD2772-class eye sensor (0x14fd180 reads factory tag 0x11a0 = 0 and
#   spawns 0x14fce70; 0x14fc0bc/0x14fcb1c use 0x14fc9cc/0x14fca9c with 0xa0 | reg on 0x00, 0x02,
#   0x08, 0x18, 0x1e and 0x14fc90c clear 0xe5).
# - 0x66 (idx 0x11, 0x1a615e8) and 0x68 (idx 0x10, 0x1a615d8): write-only boot init at 0x14f6bf0
#   (0x66 regs 0x0b/0x20/0x28; 0x68 regs 0x0d/0x20/0x25/0x26; 0x14f6bf0 also writes 0x60 and 0x67,
#   and 0x15000bc opens 0x6a when tag 0x89eb = 0; undeclared addresses are not acknowledged).
#
# `byte_ns` and part responses are HARDWARE-ONLY / UNVERIFIED; 0x14a69bc waits 50 ticks (0x15e7be0(0x32))
# per transfer (longest single transfer is 66 wire bytes to 0x36 at 0x14ff140).
[[device]]
kind = "i2c-controller"
base = 0xff925000
size = 0x1000
[device.options]
interrupt = 289
byte_ns = 25000
[[device.options.targets]]
address = 0x36
part = { kind = "fuel-gauge" }
[[device.options.targets]]
address = 0x39
part = { kind = "tmd2772-proximity" }
[[device.options.targets]]
address = 0x66
part = { kind = "retained-registers" }
[[device.options.targets]]
address = 0x68
part = { kind = "retained-registers" }
