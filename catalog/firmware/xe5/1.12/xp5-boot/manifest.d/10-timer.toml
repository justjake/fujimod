# Reload timer channels; the loader reads channel 15's current count at 0xff908388.
[[device]]
base = 0xff908000
size = 0x1000
kind = "timer-focus-capture"

# Extended timers (IRQs 68..73 on the other XP5 bodies), declared as on the X-T5, X-H2 and X100VI
# boards. The companion's first access is a word write of 0x3330111 at 0xff909004 (0x29088). The
# interrupt numbers are INHERITED and UNVERIFIED for the X-E5.
[[device]]
base = 0xff909000
size = 0x1000
kind = "timer-extended"
