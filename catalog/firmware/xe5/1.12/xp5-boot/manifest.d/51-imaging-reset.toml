# VERIFIED X-E5 1.12 input reset gate base. The driver writes 0 to +0x0
# and polls bit 0 for 1 (0x0147bea8). It reads and updates +0x4 bit 0
# (0x0147beec) and +0x8 bit 4 (0x0147c00c). The diagnostic range reaches
# +0x7ac (0x04360ec0, read by 0x03349e1c).
# Exact aperture size and general last-write read-back are UNVERIFIED.
[[device]]
base = 0xff950000
size = 0x1000
kind = "imaging-reset"
[device.options]
retain_words = true
