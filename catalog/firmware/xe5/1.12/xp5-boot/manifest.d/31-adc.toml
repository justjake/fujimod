# ADC (the SoC's `adc` block). Base 0xff906000, size 0x1000, 15 12-bit channels at
# 0xff906010 + 4 * channel: VERIFIED (loader 0x9edc8..0x9f0fc accesses +0x00/+0x04/+0x08/+0x0c/
# +0x10..+0x48/+0x4c/+0x50/+0x54; 0x9eea4 masks 15 bits 0x7fff from 0x14c7938; 0x9efd0 checks
# ch <= 14, reads 0xff906010 + 4 * ch, and masks 12 bits; 0x14c7af4 checks ch < 15; 0x1525548
# caches channels 0..14 at 0x225c918 + 2 * ch).
#
# Channel assignments VERIFIED in firmware: ch 0 thermistor 0 (0x15c9930 -> 0x15c9878 12-bit NTC,
# normal bound < 73 C at 0x15c8c00; 2713 reads ~25.0 C), ch 1/2/8/11/14 key ladders (0x1523e60,
# 0x1523c94, 0x15240b8, 0x1523ff4, table 0x1e02e70; highest factory band ends at 3750, so 4095
# holds no key), ch 3 10-position dial (0x1524820, 4095 selects band 3887..4095), ch 4 4-band
# input (0x1534d64/0x15e694c, 3921..4095 selects idle 0), ch 7 20-position dial (0x152448c, 4095
# selects band 3992..4095), ch 9 focus-mode switch (0x1523bd0, 3751..4095 selects C), ch 10
# thermistor 2 (0x15c8dc4 -> 0x15c85e4 same NTC, normal bound < 54 C after linear scaling; 4095
# clamps to 0.0 C), ch 13 18-position dial (0x1524148, 4095 selects band 3965..4095); ch 5/6/12
# are cached by 0x1525548 with no consumer found. Battery voltage/thermistor are on the SPI power
# controller (0x14f4a7c/0x14f4a30), not this ADC.
#
# `samples`: HARDWARE-ONLY / UNVERIFIED external sensor and control inputs (bounded above).
[[device]]
base = 0xff906000
size = 0x1000
kind = "adc"
[device.options]
samples = [2713, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095]
