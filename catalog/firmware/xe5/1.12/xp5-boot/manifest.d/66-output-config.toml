# X-E5 1.12 VERIFIED register addresses and poll predicates. 0x153efbc and
# 0x153f050 write packed settings to +0x10 in the two blocks. 0x153f194 writes
# +0x6c, and 0x153f1f8 also writes packed data to +0x70. Setting 0x40d47 equal to
# 2 skips the second block. The polls at 0x153f100 and 0x153f114 require bit 0
# at +0x74. The tests at 0x153f12c and 0x153f148 require any bit in mask 0xa90
# at +0xb0. The constant response words and full 0x1000 apertures are UNVERIFIED.
[[device]]
base = 0xff9a2000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [
  { offset = 0x74, mode = "constant", value = 1 },
  { offset = 0xb0, mode = "constant", value = 0xa90 },
]

[[device]]
base = 0xff9a4000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [
  { offset = 0x74, mode = "constant", value = 1 },
  { offset = 0xb0, mode = "constant", value = 0xa90 },
]
