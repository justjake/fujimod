# Serial NOR (JEDEC 0x2c5b1b, the Micron MT35XU01GBBA family) shared by the controller, its DMA and
# the CPU aperture. OBSERVED on an X-E5 1.12 body: its boot-published flash identity (0xef490)
# reads 0x2c5b1b and the stock mixed NAND/NOR driver's mode flag (0xef5c0) reads 0, so the stock
# driver takes its NOR branch (the NOR initialization wrapper 0x149fa2c selects the supported
# device by that identity in the table at 0x1e020b8). The earlier serial-NAND declaration
# (JEDEC 0xefdc21) came from reading the driver's reachable NAND branch as the installed
# technology. The backing is the update's flash image from the layout profile; the missing tail
# starts erased, and CPU aperture stores fail.
[[device]]
base = 0xf0000000
size = 0x08000000
kind = "flash-storage"
[device.options]
dat_origin = 0x2bc
xor = 0xff
erased_tail = 0xff

[[device]]
base = 0xff90a000
size = 0x1000
kind = "flash-storage-controller"
[device.options]
jedec_id = 0x2c5b1b
# The loader start reaches its first aperture read (0xcc, 20 dummy cycles) with no write to the
# part's volatile dummy-cycle register, which an earlier boot stage leaves selecting 20 cycles, as
# on the X-H2 5.30. INFERRED for the X-E5 from that read; the setup start programs it itself.
inherited_dummy_cycles = 20

[[device]]
base = 0xff939000
size = 0x1000
kind = "flash-storage-dma"
