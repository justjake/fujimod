# Serial NAND (JEDEC 0xefdc21) shared by the controller, its DMA and the CPU aperture.
# The backing is the update's flash image from the layout profile; the missing tail starts
# erased, and CPU aperture stores fail.
[[device]]
base = 0xf0000000
size = 0x08000000
kind = "flash-storage"
[device.options]
dat_origin = 0x2bc
xor = 0xff
erased_tail = 0xff
medium = "serial-nand"

[[device]]
base = 0xff90a000
size = 0x1000
kind = "flash-storage-controller"
[device.options]
jedec_id = 0xefdc21

[[device]]
base = 0xff939000
size = 0x1000
kind = "flash-storage-dma"
