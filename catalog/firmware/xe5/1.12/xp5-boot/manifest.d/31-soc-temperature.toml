# SoC temperature sensor block. Base 0xff905000, size 0x1000: VERIFIED (application driver
# 0x14daf38..0x14db488 and low-segment copy 0x913bf0..0x914140 access +0x00c, +0x028, +0x810,
# +0x814, +0x818, +0x820..+0x82c via 0x1a7f600, +0x830, +0x834, and +0x840..+0x850; first access
# writes 0 at 0xff90500c from 0x14daf4c via 0x14da8cc). 0x14dac4c polls +0x830 bit 0; 0x14db250
# reads +0x834 and sign-extends bit 11; 0x14db4d0 multiplies the 12-bit signed sample by 125
# millidegrees C; 0x15c86b8 divides by 1000 to integer C. 0x14da9d8 accepts threshold bounds
# -40..+125 C (hysteresis 0..31 C, shifted << 3, IRQ selector 0x89 -> GIC line 285 at 0x1a634e8),
# though 0x15c8744 passes out-of-range factory halfwords so only polling runs; 0x15c8a98 compares
# integer C against factory thresholds 95/98/100 C (normal level < 95 C). The device's 25 C
# reading is HARDWARE-ONLY / UNVERIFIED, within that < 95 C bound.
[[device]]
base = 0xff905000
size = 0x1000
kind = "soc-temperature"
