# VERIFIED SPI8 base (0xff918000) and chip select (GPIO 15.15, active-high): reset-stage descriptor
# 0x14ac8 selects channel 8 (0x7df0..0x7df8 and 0x80c8..0x80d0 compute (ch + 0xff910) << 12) and
# GPIO 0xf000f active-high (asserted in 0x37a8..0x37b8, deasserted in 0x38a4..0x38b4); application
# descriptor 0x16 at 0x01a601f0 (via 0x0149517c in 0x014f3428) specifies the same channel 8 and
# active-high GPIO 0xf000f (0x014949cc, 0x01494a88).
# UNVERIFIED source_hz: only SPI clock divisors appear in firmware (0xc0 at reset-stage 0x14ad8,
# 0x20 at application 0x01a60200); 48 MHz is INHERITED and UNVERIFIED.
[[device]]
base = 0xff918000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 15, pin = 15, active_high = true }
[device.options.endpoints.part]
kind = "power-controller"
# VERIFIED RTC format and bound: 0x014f4870 reads 32-bit seconds from registers 0x23..0x24,
# 0x015ecec8 decodes seconds since 2000-01-01 with upper bound < 0x5fee6600 (2051-01-01), and
# 0x014fb37c tests register 0x27 bit 1 for RTC validity (0x014f48a8 sets 0x202). The concrete
# rtc_seconds value and initial rtc_valid state are virtual inputs (HARDWARE-ONLY / UNVERIFIED).
rtc_seconds = 0x325ffea2
rtc_valid = true
# VERIFIED firmware branch conditions on registers 0 and 0x10:
# - Register 0 bit 15 (0x8000): reset-stage 0x39f0..0x3a04 loops reading register 0 until bit 15 is
#   set; application 0x014f4214 also polls register 0 until bit 15 is set.
# - Register 0 bit 10 clear and bit 9 set (0x0200): application 0x015fbae0 returns 0 (power-off in
#   0x015fbe0c) when bit 10 is set and checks bit 9 in its wait loop (0x015fbd8c); 0x014f497c and
#   0x0144f580 also branch on bits 10 and 9.
# - Register 0x10 bit 1 (0x0002): reset-stage 0x3a18..0x3a80 (and application 0x014f6b90) maps
#   register 0x10 bits {0, 1, 4, 6, 2, 5} to factor bits {0, 1, 2, 3, 4, 7} stored at 0x1f140
#   (0x29ac..0x29dc) and handed off to 0x000ef000. Application 0x015fbae0 branches on factor bit 1
#   (0x015fbdec) to record mode 2 (0x014f497c(2), mapped to normal startup reason 0 in 0x015fdd64)
#   and return 1; 0x0325760c also tests register 0x10 bit 1 directly when register 0 bit 10 is clear.
# HARDWARE-ONLY / UNVERIFIED: what the physical chip reports in registers 0 and 0x10, and reading
# register 0x10 bit 1 specifically as the physical power button (remains an INFERENCE).
# VERIFIED firmware condition on register 0x0e (read through the cached reader 0x014f3a70, whose
# descriptor 0x01e02500 has cache class 1): the supply classifier 0x014f3b50 reports a data host
# (register 0x12 bits 5:4 = 0x10) only when register 0x0e bit 4 is set and the power-policy word at
# 0x0225b400 is nonzero. Only the power-policy init 0x014f3da0 invalidates class 1 (0x014f3794; the
# periodic charge policy 0x014f4a7c invalidates classes 2 and 4), so the classifier sees the value
# read at startup. INFERENCE (not measured): bit 4 reads set while the camera runs, because the
# classifier could never report a host that connects after startup otherwise. Bit 0 is the installed
# battery (the part's default).
registers = { "0" = 0x8200, "e" = 0x11, "10" = 0x2 }
