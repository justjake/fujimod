# I2C instance 2. Base 0xff926000, size 0x1000, interrupt 290: VERIFIED (driver 0x14a6198..0x14a6380
# and 0x14a6930 address 0xff924000 + (n << 12) for n < 4 at 0x14a63a4, first write at 0xff926018
# from 0x14a61b4; 0x14a69bc maps selector 0x1a614c8[2] = 5 through 0x14be12c to GIC line 290 at
# 0x1a62ca8, ISR 0x14a68e8 -> 0x14a64a0(2)). Status bits: 0x14a6930 polls BSR (+0x00) bit 7 (BB);
# 0x14a69bc checks BCR (+0x04) bit 4 (MSS), BSR bit 5 (AL) and BC2R (+0x1c) bits 5:4; 0x14a64a0
# checks BCR bits 7/4 and BSR bits 5/4/3/0.
#
# Bus-2 clients in table 0x1a614d8 (lookup 0x14a7190): 0x55 (idx 0x0b), 0x1d (idx 0x0c), 0x0e fast
# (idx 0x0e), 0x6a (idx 0x15), 0x68 (idx 0x16), 0x24 (idx 0x17), 0x20 (idx 0x19) and 0x3e (idx 0x1a).
# Active firmware callers: 0x6a (0x15024a8 selects 0x1502f1c on factory tag 0x89ea = 0: reset/poll
# 0x12, init 0x10..0x19, read 0x28 at 0x1503070), 0x20 (touch task 0x1536a2c via 0x1536688/0x15366f4/
# 0x1536768: page select 0xff, regs 0x00..0x03/0xa5/0xa6) and 0x3e (0x155977c: regs 0x00/0x01/0x03).
# No target is declared here (every address is not acknowledged); device responses and `byte_ns` are
# HARDWARE-ONLY / UNVERIFIED (0x14a69bc waits 50 ticks via 0x15e7be0(0x32) per transfer).
[[device]]
kind = "i2c-controller"
base = 0xff926000
size = 0x1000
[device.options]
interrupt = 290
byte_ns = 25000
