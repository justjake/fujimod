# DDR PHY mailbox pages, one per PHY. The setup stage writes both (16-bit stores at 0xfb1a006c and
# 0xfb5a006c).
# The status word +0x08 (reads 0, then 1) and the message word +0x64 (reads 7) follow the X-T5 and
# X100VI stubs for the same stage; they are UNVERIFIED for the X-E5, and this register file stands in
# for the PHY, it is not a model of it.
[[device]]
base = 0xfb1a0000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [{ offset = 0x08, mode = "toggle", value = 1 }, { offset = 0x64, mode = "constant", value = 7 }]

[[device]]
base = 0xfb5a0000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [{ offset = 0x08, mode = "toggle", value = 1 }, { offset = 0x64, mode = "constant", value = 7 }]
