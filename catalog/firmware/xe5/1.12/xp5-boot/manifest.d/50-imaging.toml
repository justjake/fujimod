# X-E5 1.12 imaging. VERIFIED marks firmware addresses and accepted register values.
# Window sizes are catalog allocations. The register dumps and accessors show the used
# offsets, with no evidence of the exact hardware aperture sizes.
# Frame periods are UNVERIFIED fixed cadences. The sensor timing calculation uses line
# length, frame line count, and clock parameters for the selected mode (0x034ed2cc,
# 0x034dfeac, 0x03445ad0).
# source_luma and retain_words are UNVERIFIED model inputs.
#
# VERIFIED sensor command / input buffer base (0x0146aec4). Reset clears +0x0 bit 0
# and waits for it to read 1. The driver writes +0x440..+0x47c (0x0146db84,
# 0x0146e048), reads those words (0x0146e50c, 0x0146e658), and also accesses
# +0x480/+0x484 and +0x4c0/+0x4c4 (0x0146d528, 0x0146d6d0).
[[device]]
base = 0xff948000
size = 0x1000
kind = "imaging-sensor"
[device.options]
retain_words = true
command_latency_us = 1 # UNVERIFIED packet latency.

# VERIFIED SLVS-EC receiver bases and 0x1000 bank stride (0x01484d8c, 0x01484dec).
# The reset tables write +0x0 bit 16, then also bit 0 for the enabled links
# (0x04375df0, 0x043760b0). They clear +0x104, later write 0x4001 there, and
# write 3 at +0x10c (0x04375e20, 0x04375e08, 0x043760c0).
# The diagnostic ranges extend to +0x254 (0x04360b78, 0x04360bf0).
[[device]]
base = 0xff940000
size = 0x1000
kind = "imaging-receiver"
[device.options]
frame_period_us = 33333
frame_active_us = 10000 # UNVERIFIED frame phase interval.
[[device]]
base = 0xff941000
size = 0x1000
kind = "imaging-receiver"
[device.options]
frame_period_us = 33333

# VERIFIED MOVDC bases and 0x1000 bank stride (0x0147931c, called with indices
# 0 through 2 at 0x030e4644, 0x030e4654, 0x030e4664). Each reset writes 0 at
# +0x0 and waits for bit 0 to read 1. The diagnostic ranges end at +0x114
# (0x04361148, 0x04361160, 0x04361178).
[[device]]
base = 0xff970000
size = 0x1000
kind = "movdc"
[device.options]
frame_period_us = 33333
source_luma = 128
retain_words = true
[[device]]
base = 0xff971000
size = 0x1000
kind = "movdc"
[device.options]
frame_period_us = 33333
source_luma = 128
retain_words = true
[[device]]
base = 0xff972000
size = 0x1000
kind = "movdc"
[device.options]
frame_period_us = 33333
source_luma = 128
retain_words = true

# VERIFIED preview base (0x01471910). Reset waits for +0x0 bit 0 and +0x504 bit 16,
# clears +0x500 bit 8, then waits for selected busy bits at +0x20 to clear
# (0x01471410). The diagnostic ranges extend to +0x508 (0x043611d8).
[[device]]
base = 0xff974000
size = 0x1000
kind = "imaging-preview"
[device.options]
frame_period_us = 33333
source_luma = 128
retain_words = true
# UNVERIFIED output interpretation. The driver programs the first output at
# +0x400/+0x404 (0x01475268, 0x030e390c).
focus_filters = true
# VERIFIED programmable grid at +0x7c/+0x80 (0x01472970, 0x01472ce4).
# Each word encodes origin in bits 27:16, count minus one in 15:12,
# and cell size minus one in 8:0. AF-S grid dimensions are UNVERIFIED.
focus_window = true

# VERIFIED RIFP register-list DMA base and bit 0 at START +0x40, IRQ enable
# +0x44, and acknowledge +0x48 (0x030e85dc, 0x030e8640, 0x030e86a4).
# The register dump reaches +0x17c (0x030e9be4).
# The still path submits 8-byte value/address entries (0x031be890, 0x030cbb48,
# 0x014df984), including RIFP START at 0xffd02004 = 1 (0x030cc08c).
# DMA IRQ maps to INTID 230 (0x0380d350, 0x014be12c, 0x01a62da8).
[[device]]
base = 0xffd01000
size = 0x1000
kind = "imaging-rifp-io"
[device.options]
queue_completion_us = 5 # UNVERIFIED queue latency.

# VERIFIED RIFP base (0x030cc050). Reset writes 0 at +0x0 and waits for bit 0
# to read 1. The ISR tests +0x144 bit 0 and writes 1 to +0x14c (0x030cb2f0,
# 0x030cccf4, 0x030ccd78). It restarts in 0x500-line bands (0x030ccebc).
# The still path writes sub-block pages 0xffd03000 through 0xffd08000 and
# 0xffd0a000 through 0xffd0b000 (0x030cbec8, tables at 0x0380b478 and
# 0x0380ce28). The last page is used through 0xffd0b800 (0x0380ce20).
# RESZ starts at 0xffd0c000 (0x014dbe9c).
[[device]]
base = 0xffd02000
size = 0xa000
kind = "imaging-rifp"
[device.options]
completion_us = 1000 # UNVERIFIED RIFP latency.
source_luma = 128
retain_words = true
