# X-E5 1.12 ff80 USB device controller. 0x03071b84 initializes the DWC3
# device registers at 0xffc0c700 and programs a 0x1000-byte event ring at
# 0x0437b000. 0x03072a70 sets DCTL.RUN.
[[device]]
base = 0xffc00000 # Core base at 0x015e3eac; device register writes at 0x030720bc..0x030720d0.
size = 0x10000 # UNVERIFIED hardware decode boundary; model aperture includes the device registers.
kind = "usb-device-controller" # 0x03071f9c resets DCTL; 0x03072000..0x03072034 programs GEVNT.
[device.options]
interrupt = 283 # Row 0x01a63378; 0x03072a9c..0x03072ab4 binds handler 0x030713a4.
speed = 0 # 0x03072d2c returns 1 for DSTS[2:0] == 0 with 0xff90e300 bit 0 set.
command_ticks = 1000 # UNVERIFIED latency; firmware waits for command bit 10 to clear (0x0307238c).
transaction_ticks = 125000 # UNVERIFIED latency; functional high-speed microframe interval.

# 0x03070e4c selects index[12:8], reads data[7:0] at +0x400, and pulses
# bit 16 on writes. 0x03072328 and 0x0307233c RMW the +4 parallel word.
[[device]]
base = 0xffc23800 # 0x03070e4c.
size = 0x404 # Covers the 32-bit readback at 0xffc23c00 in 0x03070e4c.
kind = "usb-phy" # 0x03070e4c; UNVERIFIED reset bytes and parallel word use model defaults.

# 0x0144cfbc RMWs 0xffc10c08 with OR 5. Register-file stub for that word.
[[device]]
base = 0xffc10000 # Window containing the glue word in 0x0144cfbc.
size = 0x1000 # UNVERIFIED decode boundary; aperture covers +0xc08.
kind = "bringup-stub" # 0x0144cfbc requires RMW.
[device.options]
registers = [] # UNVERIFIED reset value; use the stub default.

# 0x0144cfbc clears +0x08, writes +0x04 and +0x14, and polls +0x08 bits
# 1:0. Bit 0 means success. 0x0144cf6c then sets +0x40 low nibble to 5.
[[device]]
base = 0xffc30000 # 0x0144cfbc and 0x0144cf6c.
size = 0x1000 # UNVERIFIED decode boundary; firmware reaches +0x40.
kind = "completion-stub" # 0x0144cfbc polls until completion.
[device.options]
starts = [{ offset = 0x14, mask = 0x10 }] # 0x0144cfbc writes 0x11 or 0x15.
delay_us = 100 # UNVERIFIED latency; functional delay to answer the poll.
completion = [{ offset = 0x08, set = 0x1 }] # 0x0144cfbc takes success branch on bit 0.
ack = { offset = 0x08, mode = "w1c", bits = 0x1 } # 0x0144cfbc writes 0xffff before start; UNVERIFIED W1C semantics.
