# X-E5 1.12 imaging. Window sizes are catalog allocations. Exact aperture
# sizes and general last-write read-back behavior are UNVERIFIED.

# VERIFIED input base and one-bit control registers at +0x0 and +0x4
# (0x030ea2a0, 0x030ea304). The configuration accessors include +0x4c..+0x84
# (0x030e9f10, 0x030ea140), +0x10c bits 15:0 (0x030eb47c), and words
# +0x140..+0x17c (0x030eba24).
[[device]]
base = 0xff946000
size = 0x1000
kind = "imaging-input"
[device.options]
# VERIFIED for X-E5. The inherited true forces +0x17c bit 31 high when
# +0x140 bit 0 is clear. The firmware's stop check succeeds when both are
# clear (0x030eb548, 0x030eb9f8, 0x034f3498, 0x034f4664, 0x034f0070).
retain_words = true

# VERIFIED second reset gate base. Reset writes 0 and polls +0x0 bit 0 for
# 1 (0x01479358), then writes 3 to +0x38 (0x0147b0a4, 0x0147b050).
# The diagnostic range reaches +0x40 (0x04361190).
[[device]]
base = 0xff973000
size = 0x1000
kind = "imaging-reset"
[device.options]
retain_words = true

# VERIFIED MOVRSZ base. Reset clears +0x0 bit 0 and waits for it to read 1
# and for +0x54 bits 0 and 16 to read 1 (0x030bdfec). Start sets +0x04 bit 0
# after enabling +0x4c/+0x50 bit 16 (0x030be698). The dump reaches +0x64
# (0x030be7f0).
[[device]]
base = 0xff982000
size = 0x1000
kind = "imaging-resize"
[device.options]
completion_us = 1000 # UNVERIFIED resize latency.
retain_words = true

# VERIFIED PAF base. Reset writes 0 at +0x0 and waits for bit 16 to read 1
# (0x030ca25c). Start sets +0x0 bit 0 and +0x300/+0x308 bit 8 (0x030cae34).
[[device]]
base = 0xff976000
size = 0x1000
kind = "imaging-paf"
[device.options]
retain_words = true

# VERIFIED SSP3 base and 0x1000 bank stride (0x014940d8, 0x01495298,
# 0x014951b8). The firmware sets a clock selector at 0xff90c700 and a
# divider at +0x10. The root frequency, peer identity, chip select,
# and MISO response are UNVERIFIED.
[[device]]
base = 0xff913000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 19, pin = 15, active_high = false }
part = { kind = "generic-sink", miso_high = false }
