# Display chain, declared as on the X-T5 board (41-display.toml there) with the same SoC windows and
# kinds: the command renderer (the application's first access is a read at 0xff93d8c0 from 0x1703f6c),
# the four display pixel-clock PLLs and the two display controllers. The X-E5's own use of each block
# is not read from its firmware yet, so every declaration here is INHERITED and UNVERIFIED; the
# scanout geometry comes from the registers the application programs.
[[device]]
base = 0xff93c000
size = 0x3000
kind = "renderer"

[[device]]
base = 0xffa11000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa12000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa13000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa14000
size = 0x1000
kind = "panel-pll"

[[device]]
base = 0xff990000
size = 0x1000
kind = "display"
[[device]]
base = 0xff9a0000
size = 0x1000
kind = "display"
