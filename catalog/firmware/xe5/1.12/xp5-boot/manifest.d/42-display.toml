# X-E5 1.12 VERIFIED display bases: 0x154dc5c selects either bank, writes 0,
# then polls bit 0. 0x153a330 and 0x153a348 call the display-mode setup for
# banks 0 and 1. At 0x154649c the timing path writes +0x10 through +0x28 in
# bank 0 and through +0x2c in bank 1, with an extra bank 1 word at +0x4c.
# 0x1556148 enables either bank by writing 1 to +0x04. 0x1551338 writes plane
# registers starting at +0x48 in bank 0 and +0x50 in bank 1. The full 0x1000
# aperture of each bank is INHERITED.
[[device]]
base = 0xff990000
size = 0x1000
kind = "display"
[[device]]
base = 0xff9a0000
size = 0x1000
kind = "display"
