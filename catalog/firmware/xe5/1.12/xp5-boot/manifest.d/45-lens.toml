# X-E5 1.12 lens mount.
# VERIFIED: the lens communication state table at 0x01a89c50 selects the
# driver that opens SSP client 20 at 0x0150c08c.
# Client 20 (0x01a60190) replaces the inherited descriptor index 17. It selects
# instance 0, 8-bit frames, prescaler 0x20, and DMA mode (0x01495228, 0x01495298,
# 0x014951b8). SSP uses PL022 register offsets and a 0x1000 instance stride
# from base 0xff910000 (0x01495298).
#
# VERIFIED: the SSP DMA pair at 0x01a5fd20 supplies transmit descriptor 1 and
# receive descriptor 0 (0x01494190, 0x01494d64). Descriptors 0x01a619a0 and
# 0x01a619b4 select RX request 0 on channel 2 and TX request 1 on channel 3.
# Both channels use general-DMA bank 1 at 0xff931000 (0x014adfac). The receive
# completion drives the lens callback (0x01493cfc, 0x01494120). Channel INTIDs
# 239 and 240 follow the channel map in 22-general-dma.toml.
#
# UNVERIFIED: gic_line 36 is inherited. SSP enables IMSC 0xf (0x014953a0).
# The timer driver (0x01495f70) looks up logical ID 0x1c at 0x01a604d8,
# which resolves to INTID 36 (0x01a62e18). The SSP open and transfer paths
# yielded no controller interrupt mapping.
# UNVERIFIED: source_hz 48 MHz is inherited. The SSP clock selection and
# divider writes (0x014941f4, 0x01495298) left the input rate undetermined.
# ticks_per_second is the emulator time scale.
#
# VERIFIED: detect 0.11 is active low (0x01512414, 0x01513e6c). The scanner
# uses row 0, physical key 6 (0x01e02e70), in place of the inherited row 101.
# The lens task posts UI code 0x33 (0x0150fcd4). The standard lens path
# requires sense pads 10.0, 10.1, and 10.2 to read 1/0/1: 10.0 must equal 1
# (read 0x01512468, compare 0x01512470), 10.1 must read 0 (0x01512480,
# 0x01512484) and 10.2 must equal 1 (0x0151253c, 0x01512540), with no
# mismatch flag set (0x01512548). The driver enables 15.9 at detect start
# (0x015123b4) and 15.10 after the sense check (0x01512564).
# VERIFIED: ready 14.1 must read high before the second supply (0x01512428).
# The driver selects pad function 3 (0x01512574) and waits for INTID 131
# for ready low (selectors 0x9d/0x9e, records 0x01a63628/0x01a63638) and
# INTID 115 for ready high (selectors 0x9b/0x9c, records
# 0x01a63608/0x01a63618) at 0x01503a54.
#
# HARDWARE-ONLY: startup_us, busy_us, operation_us, the lens selection, and
# identity and status responses are scenario values. Firmware polls INTID 131 up to
# ten times with one delay unit per miss (0x01512d3c) before the interrupt wait.
# Its subsequent ready-low wait uses timeout arguments 550 or 5000
# (0x01512df0, 0x01512db4). The ready-high wait uses 5000 (0x01510278).
# These are firmware wait limits.
#
# XT5_LENS=none|xf18-55|prime selects the lens for one run.
# XT5_LENS_READY=STARTUP_US,BUSY_US overrides the ready timing.
# Snapshots require the same lens selection when loaded.
[[device]]
base = 0xff910000
size = 0x1000
kind = "pl022"
[device.options]
source_hz = 48000000
ticks_per_second = 1000000000
receive_request = 0
transmit_request = 1
gic_line = 36
[device.options.wire]
kind = "x-mount-lens"
lens = "xf18-55"
detect = { port = 0, pin = 11 }
sense = [{ port = 10, pin = 0 }, { port = 10, pin = 1 }, { port = 10, pin = 2 }]
sense_unpowered = [true, false, true]
supplies = [{ port = 15, pin = 9 }, { port = 15, pin = 10 }]
ready = { port = 14, pin = 1 }
ready_mux = 3
ready_low_line = 131
ready_high_line = 115
startup_us = 2000
busy_us = 50000
operation_us = 1000
