# The application's drain routine (0x15eb2b0, selected by a mask in w0) calls the word reader
# 0x9eda8 on 0x1eb4250 (bit 0), 0x68000000 (bit 1, 0x15eb2fc), 0x80000000 (bit 2) and 0x1c0000000
# (bit 3) and discards the value. The target ranges are bus ports, not RAM: only the first word
# is read. Zero readback is a session assumption, as on the X-T5 and X100VI boards. 0x68000000 lies
# inside the RAM that runs to 0x80000000 and 0x80000000 is DRAM channel 2 (manifest.toml), so only
# 0x1c0000000 needs a window.
[[device]]
base = 0x1c0000000
size = 4
kind = "discarded-read"
