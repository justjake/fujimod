version = 1
firmware = "xe5-112"
load_firmware = true
# Host execution only: the companion M4 serves the stabilizer and lens traffic far more than it
# waits in delay loops, so it runs in block execution. The guest state is the same either way.
mprofile_block_execution = true

# The XP5 device tree maps Linux DRAM and shared arenas below 0x67f00000, but the application also
# uses DRAM up to 0x80000000: CPU1 writes 0x7ec00000 (a memset from 0x3271124, as on the X-T5, whose
# still subject-detection arena is 0x7ec00000 + 0x1400000), and the drain routine reads 0x68000000
# from inside that range. So RAM runs to 0x80000000. Installed capacity is unmeasured.
[[ram]]
base = 0
size = 0x80000000

# DRAM channel 2. A half-press trains channels 2 and 3, and 0.19 s after S2 the still sequence
# reaches 0xbb00f6b0, the address the X-T5 4.31 still sequence writes after the same boost
# (its manifest.toml). Declared as on the X-T5: 0x80000000 + 1 GiB, with the run's DRAM space
# ending at 0xc0000000 (run.json). The X-E5 channel table is UNVERIFIED.
[[ram]]
base = 0x80000000
size = 0x40000000

# DRAM channel 3, as on the X-T5 (0x1c0000000 + 1 GiB; its playback opens a heap there). The first
# 16 KiB granule stays with the discarded bus-drain read at 0x1c0000000 (64-bus-drain.toml).
# UNVERIFIED for the X-E5.
[[ram]]
base = 0x1c0004000
size = 0x3fffc000

# M-core SRAM, as on the other XP5 bodies. The extent and the source of the
# stock M-core image copy are UNVERIFIED for the X-E5.
[[ram]]
base = 0xfa200000
size = 0x100000

# DDR PHY register and firmware space, two PHYs of 0x1a0000 bytes below their mailbox pages, as on
# the X-T5 and X100VI. Extents unverified for the X-E5.
[[ram]]
base = 0xfb000000
size = 0x1a0000

[[ram]]
base = 0xfb400000
size = 0x1a0000

# The rest of each PHY's register file, plain memory as in the ROM start (rom-start.toml). A
# half-press (S1) in the shooting screen reads 0xfb640032 (APB register 0x120019 of the second PHY,
# the register the ROM start's stock setup reads first on 0xfb240032) through the halfword reader
# 0x9edb0 (caller 0x14cd000). A store reads back; nothing is modeled.
[[ram]]
base = 0xfb1a4000
size = 0x25c000

[[ram]]
base = 0xfb5a4000
size = 0x25c000

# Boot SRAM (the SoC profile's boot-sram region). The ROM start loads the setup stage here; in the
# loader start the application's live-view path still reaches it once the shooting screen starts
# (first access 0xff8075a0, from a non-CPU master). Contents at the handoff are not preloaded.
[[ram]]
base = 0xff800000
size = 0x40000

# Companion window onto the shared DRAM region. The application stores the region's physical base
# 0x8c73000 in the companion's SRAM word 0xf6f8c (companion view), and the companion code adds the
# 0x60000000 alias (0x312a stores to 0x69030080). The SoC's own window for the same structure sits
# 0x800000 lower (0x68473000, 5754880 bytes), so this one has the same size at the X-E5 base. The
# extent is UNVERIFIED for the X-E5.
[[companion_window]]
address = 0x68c73000
physical = 0x8c73000
size = 5754880

# SD slots: no card inserted, the run input of each slot of 25-sd.toml (as on the X-T5 board).
[[sd]]
base = 0xff9b0000
present = false
protected = false
files = []
[sd.format]
sectors = 0x3b9e000
max_dirty_sectors = 65536
partition_start = 8192
sectors_per_cluster = 64
label = "NO NAME"

[[sd]]
base = 0xff9b4000
present = false
protected = false
files = []
[sd.format]
sectors = 0x3b9e000
max_dirty_sectors = 65536
partition_start = 8192
sectors_per_cluster = 64
label = "NO NAME"
