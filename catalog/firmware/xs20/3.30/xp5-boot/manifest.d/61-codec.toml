# Video codec IP: HEVC core 0xffd14000, H.264 core 0xffd15000 with the shared stream and
# image interface at 0xffd15e00..0xffd15ff4 (driver 0x13cbee0..0x13d2d80; one named leaf
# setter per register at 0x13cbee0..0x13cf474, all through 0x5dd28/0x5dd50). The model also
# owns the address-high words 0xff90e710 ExIADDR0, 0xff90e714 ExOADDR0, 0xff90e718 ExIADDR1
# (input picture) and 0xff90e71c ExOADDR1 (stream banks and NALU table), bits 34..32, that
# 0x13cf638 writes; no other window holds 0xff90e710..0xff90e71f.
#
# Open 0x13cfe84 (from recmv 0x2db7b74): power gate 0xff90db04 bit 16 cleared and 0xff90db24
# polled (power-gates), IP_CODEC_CTRL/IP_CLK_CTRL/IP_INT_CTRL at +0x14088/+0x14080/+0x14008,
# H264_CORESEL +0x15200 = 1, H264_INT_EN +0x15128 = 0x010c0000, PERI_INT_EN +0x15fd8, then
# logical interrupt 0x10 to the ISR 0x13d1da0. Entry 0x10 of the interrupt table 0x18ea918
# is INTID 210 (priority 0xc0). Configure 0x13d0220/0x13cf638 writes the image banks
# (IMG_WIDX +0x15ee4 / IMG_WADR +0x15ee8, even index Y, odd index C), IMG_LINE_OFS +0x15f10,
# BADR_STR0/1 +0x15e40/+0x15e44, STR_BUF_SIZE +0x15e60, STR_BUF_MODE +0x15e68 = 0,
# BADR_NALU +0x15e90, NALU_BUF_SIZE +0x15eb0 and the PARregs +0x15300..+0x15684. Frame start
# 0x13d197c writes Y/C, IMG_BANK_RST, reads the bank in +0x15e64 bit 12 and writes
# H264_CMD +0x15100 = 0x8000 (bit 14 is stop, 0x13d1b0c). The ISR reads +0x15fd0, +0x15120,
# +0x14120, +0x15124, +0x14124 and writes the status back; task 0x13d200c takes
# +0x15124 bits 1..0 as a coded picture, +0x15120 bit 18 as a ready NALU table (16-byte
# entries ending at type 0x3f, end at +0x15ebc, reset by +0x15ea0 = 1) and bit 19 as stop
# done. Details: scratch/movie/codec-contract.md (static reading, not run).
#
# Model: crates/emulator-xp5-board/src/board/codec.rs, the workspace software H.264 encoder.
# Inferred, not observed: 0x15120 as pending (write one to clear) beside 0x15124 as raw
# status, NV12 (Cb first) chroma, PARreg5 as the GOP length. run_ticks (1 ms of board time)
# is functional, not measured. The encoder state is not serializable, so an exact checkpoint
# is refused while a recording is open.
[[device]]
base = 0xffd14000
size = 0x2000
kind = "xp5-codec"

[device.options]
irq = 210
run_ticks = 1000000
