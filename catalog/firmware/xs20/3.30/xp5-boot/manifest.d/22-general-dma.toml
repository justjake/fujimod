# Eight banks spaced 0x1000 at ff930000..ff937000, initialized by 0x138ee74..0x138ef5c
# DMA register contract matches X-T5 reset 0x139b998 and descriptor 0x18eafd8.
# companion_irq_base = 83 is the X100VI-derived M-core NVIC line for bank 0, NOT
# separately observed on the X-T5 (the companion's vector table is installed at
# run time). It only matters once the guest releases the M-core. The X-T5 M-core
# image binds IRQ stubs for slots 93..103 and slot 94 serves the serial DMA pair
# (channels 10/11), consistent with 83 + 11; the base itself is UNVERIFIED
[[device]]
base = 0xff930000
size = 0x8000
kind = "general-dma"

# a53_irq_base = 237: the A53 driver also takes channel completions on the GIC.
# Driver channel ids 0..15 are the eight banks x two lanes (0x138babc: ids <= 0xf
# are this controller; 0x138ef60/0x138efdc address ff930000 + (id >> 1) * 0x1000
# + (id & 1) * 0x30). When a caller passes a completion callback, the start
# function 0x138ca78 (at 0x138cbdc) looks up logical interrupt 0x18e95e0[id] =
# 0x54 + id, gets its record from 0x139f424 (table 0x18ea918) and registers the
# callback with 0x139f1b4, which enables the INTID. Records 0x54..0x63 hold INTIDs
# 237..252, edge-triggered (flag 3 -> GICD_ICFGR 2 in 0x5d46c). Example: the DDR
# PHY warm-training copy 0x13ae0b8 opens descriptor 0x18 (0x18e9660 + 0x18 * 0x14
# = {channel 1, request 0x3f}), so its callback 0x13ae308 waits on INTID 238.
# The companion line stays as well; the real routing to the M-core is unverified.
[device.options]
companion_irq_base = 83
a53_irq_base = 237

# Global words at ff90e564..578 and the bank high-address and request-routing
# views (0x13905d8..0x1390644 clear/acknowledge them; application-boot.md).
[[device]]
base = 0xff90e748
size = 0x40
kind = "dma-address-high"

[[device]]
base = 0xff90e500
size = 0x20
kind = "dma-request-routing"
