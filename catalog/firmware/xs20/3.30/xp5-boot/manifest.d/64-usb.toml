# USB device controller and PHY (scratch/usb/REPORT.md, static decode of X-T5 4.31).
#
# DesignWare USB3 dual-role core at 0xffc00000; the device registers sit at
# +0xc100.., the same offsets as on XP4 and XPP. The ff80 ("App80") driver at
# 0x2bf9000..0x2c0a000 initializes it in 0x2bfbb68: DCTL.CSFTRST, event buffer
# 0x37a7000 (GEVNTSIZ 0x1000, 1024 events, bus address = guest address),
# DEVTEN 7, DCFG |= 0x420005, DCTL.RUN at 0x2bfca48. Interrupt record 0x72 of
# table 0x18ea918 is INTID 283 (0x11b), priority 0xd0, handler 0x2bfb390, which
# masks GEVNTSIZ (bit 31) and posts to the USB task; 0x2bfefb8 drains the ring.
# The speed getter 0x2bfcd0c needs 0xff90e300 bit 0 = 1 and DSTS speed 0 (high
# speed) to keep the 2.00 / 64-byte ff80 device descriptor at 0x3717000.
# Board ticks are nanoseconds: commands take 1 us, a bus transaction one
# 125 us microframe (functional latencies, not measured values).
#
# Nothing touches these windows before a cable is seen: the strict boot reached
# REC without them. The xHCI (host) side of the core (0xffc00000..0xffc02000)
# is used only by the host driver at 0x14c0000..0x14c4000 and the role switch
# 0x14bc934 (PC connection / webcam stack); those accesses stay unmodeled.
[[device]]
base = 0xffc00000
size = 0x10000
kind = "usb-device-controller"
[device.options]
interrupt = 283
speed = 0
command_ticks = 1000
transaction_ticks = 125000

# Indexed USB2 PHY port, the XP4 protocol (X-T3 0xffb23800): index[12:8],
# data[7:0], write strobe = rising edge of bit 16, readback at +0x400 (helper
# 0x2bfae38). The parallel word at +0x04 is read-modify-written with masks
# 0x70 (0x2bfc2f8) and 0x1 (0x2bfc310). Initial values are unknown; zeros.
[[device]]
base = 0xffc23800
size = 0x404
kind = "usb-phy"

# ---------------------------------------------------------------------------------------------
# Bring-up stubs, NOT models (same status as 49-gap-stubs.toml). The ff80 device init 0x2bfbb68
# calls 0x13391f8(mode) at 0x2bfbd1c (also called by the host side, 0x14bcb5c). It toggles clock
# gate bit 0x27 of 0xff90c918, then:
#   0xffc10c08 |= 5                         (USB glue word; read-modify-write)
#   0xffc30010 |= 0x10; 0xffc30008 = 0xffff (status clear); 0xffc30004 = 0x1003;
#   0xffc30014 = mode word (bits 1:0 = 1, bit 2 = mode == 1, bit 4 set, bit 3 clear);
#   poll 0xffc30008 until bits 1:0 != 0; bit 0 -> success, then 0x13391a8(1) sets
#   0xffc30040 bits 3:0 = 0b0101 (0x13391a8(0) clears them on unplug).
# The real block (a USB PHY/PLL control, unidentified; X100VI peripherals.md lists 0xffc10000 and
# 0xffc30000 as unmodeled) is unknown. The completion below only answers the poll: the write of
# +0x14 with bit 4 set "starts", and 100 us later +0x08 bit 0 is set; +0x08 is write-one-to-clear.
[[device]]
base = 0xffc10000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = []

[[device]]
base = 0xffc30000
size = 0x1000
kind = "completion-stub"
[device.options]
starts = [{ offset = 0x14, mask = 0x10 }]
delay_us = 100
completion = [{ offset = 0x08, set = 0x1 }]
ack = { offset = 0x08, mode = "w1c", bits = 0x1 }
