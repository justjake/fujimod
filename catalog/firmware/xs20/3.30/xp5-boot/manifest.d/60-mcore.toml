# Companion mailbox (status/cause 0x1/0x20 raise A53 INTID 142,
# releases it; its section is copied into the SRAM RAM region at 0xfa200000.
[[device]]
base = 0xff90e100
size = 0x24
kind = "interprocessor-mailbox"

# Companion serial controller at ff911000 (transmit DMA channel 10 fa24b1b4 ->
# The first exchange (09, then 01 01) is the BIS configuration sequence of the
# X100VI M-core: same command bytes, same select line (port 11 pin 5, active
# low) and the same LSM6DS-class chip select (port 11 pin 3); see
# parts are the existing explicit models; revision nibbles and idle MISO are
# scenario inputs, not X-T5 measurements. UNVERIFIED on the X-T5: DMA request
# numbers 2/3 and NVIC line 99 are the X100VI session's values (same SoC). The
# X-T5 M-core programs channel configurations 0x209011 (tx) and 0x309011 (rx), whose
# lane factors 2/3 the model checks, but no code writes the request numbers for these
# channels; slot 99 of the M-core handler table holds a stub (k = 6) of unknown purpose.
# Channel 11 completing on IRQ94 (83 + 11) is consistent with the README's IRQ94
# handler. source_hz: the Linux DTB has a 48 MHz root clock but does not say which
# clock feeds the SSP blocks (hvf-board.md, "Values that are inherited or unverified").
# X-S20 3.30 DRAFT: the companion link is SSP7 (0xff917000), not the X-T5's SSP1. The
# first strict stop of the X-T5-derived run was an M-core read of 0xff91700c. In the
# M-core image (flash 0x1c0000..0x200000), the X-S20 holds GPIO literals 0x000f000c and
# 0x000f000d at the same offsets (0x1c3590/0x1c3a84/0x1caa38 and 0x1caaa0/0x1cf4b4) where
# the X-T5 holds 0x000b0005 (BIS select) and 0x000b0003 (LSM6DS select): selects 15.12
# and 15.13, as on the X-H2S. DMA requests 14/15 and NVIC line 105 follow the X-H2S
# 2n/2n+1, 98+n rule for n = 7; UNVERIFIED.
[[device]]
base = 0xff917000
size = 0x1000
kind = "pl022"
[device.options]
source_hz = 48000000
ticks_per_second = 1000000000
receive_request = 14
transmit_request = 15
companion_irq_line = 105
[device.options.wire]
kind = "gpio-selected"
[[device.options.wire.endpoints]]
[device.options.wire.endpoints.select]
port = 15
pin = 12
active_high = false
[device.options.wire.endpoints.part]
kind = "bis-configuration-registers"
revision = [0, 0]
samples = [0, 0]
idle_high = false
# A body at rest: the 0a..0f block (command 8a) reads zero, as before it became
# a declared input.
block = [0, 0, 0, 0, 0, 0]
[[device.options.wire.endpoints]]
[device.options.wire.endpoints.select]
port = 15
pin = 13
active_high = false
[device.options.wire.endpoints.part]
kind = "icm42688-configuration-registers"
temperature = 0
# X-S20 3.30 DRAFT: the companion's gyro on 15.13 is an ICM-42688-class part, not the
# X-T5's LSM6DS: its start-up writes DRIVE_CONFIG, GYRO/ACCEL_CONFIG0, bank 1
# GYRO_CONFIG_STATIC2/10, clears the bank 4 user offsets, sets PWR_MGMT0 0x0f and
# burst-reads from TEMP_DATA1 (0x1d). DISCOVERY (UNVERIFIED): a body at rest, zero
# angular rate and 1 g on Z at the +-2 g scale it selects (16384 LSB/g); the mounting
# axis is not measured.
motion = { angular_rate = [0, 0, 0], acceleration = [0, 0, 0x4000] }

# Input-capture banks (five channels at ff928000, three at ff929000, stride 0x20).
# The X-T5 companion writes ff928040 and streams fa234adc -> ff928044 on general
# register at 0xff928000 + 2*0x20 + 4. UNVERIFIED: request lane 32 is the X100VI value;
# no store of it was found in the X-T5 M-core image or the A53 DMA driver callers.
[[device]]
base = 0xff928000
size = 0x1000
kind = "input-capture"
[device.options]
dma_transmit = [{ channel = 2, request = 32 }]
# IBIS stage position sensor behind capture channel 2. Every servo tick the
# M-core (0x3cd4, DMA handle 0x4000d) streams the 41-word table at M-core RAM
# 0x34adc to ff928044 and takes NVIC line 62 (descriptor 0x31fb4) twice; handler
# 0x31e8 reads one capture from ff928050 per interrupt (two samples, then one).
# The servo 0x284cc linearizes each raw sample as (sample - 0x8000) * -256 >> 8
# (runtime offsets/gains at M-core 0xf6b3c/0xf6b42), so 0x8000 is stage position
# zero. Task 8 latches an axis error after |position - target| > 3200 for 800
# consecutive 2.5 ms checks (0x107c8; FINDINGS 2026-11-08 00:30). rest = 0: the
# stage held centered while the body is still. latency_ns and lag_shift are
# scenario inputs, not X-T5 measurements.
[device.options.sequencer]
channel = 2
companion_irq_line = 62
latency_ns = 20000
center = [32768, 32768, 32768]
rest = [0, 0, 0]
lag_shift = 2
# Coil drive: extended timer general channels 2, 4 and 0 carry the servo's three
# PWM outputs (M-core duty words 0xf6e68/0xf6e6c/0xf6e70 matched the channels'
# second compare in a run); 872 (first compare) is zero drive. The gain sign
# follows the servo's own drive compensation; the size is a scenario input.
drive_channels = [2, 4, 0]
drive_gain = [6, 6, -3]
# IS MODE does not change this wiring. The body sends request 0x80 with the mode in
# bits 18..16 (A53 0x13f85e0: 1 CONTINUOUS, 2 SHOOTING ONLY, 0 OFF); the M-core
# handler 0x4390 stores operation 2, 3 or 1 at +0x20 of the stabilizer task block
# 0x3521c, the task (0x5428) stays in state 2 (servo running) for each of them, and
# 0xb354 stores the mode the servo's correction tables are indexed with at 0x39acc
# (1, 2, 0). So the servo samples and holds the stage in all three modes, and the
# stage model follows whatever drive it outputs. The model's diagnostic state reports
# that drive and the position it commands (`stage`). No gyro motion is modeled, so
# the modes command the same position for a body at rest.
# Faithful by default: the sensor always answers. For quick development runs only,
# XT5_IBIS_SETTLE_FRAMES=32000 stops answering after 2 s of servo (not hardware behavior).
[[device]]
base = 0xff929000
size = 0x1000
kind = "input-capture"

# USB cable/jig connection status in bit 0: 0x14f61d8 latches it and posts event
# 0x3047 when set, 0x2bfcd0c reads it with 0xffc0c70c. The default input is
# disconnected, as on the X100VI.
[[device]]
base = 0xff90e300
size = 4
kind = "usb-connection-status"
