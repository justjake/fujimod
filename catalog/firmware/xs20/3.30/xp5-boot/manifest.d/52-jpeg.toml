# JPEG encoder. Register helpers 0x13c39b8..0x13c480c, driver 0x2c428b8..0x2c42eac; the
# still job 0x2dd7958 starts it at 0x2dd8440 and waits for the handler's callback.
# Reset 0x2c42974: +0x118 = 1, wait for +0x24 bit 16, write the status back, +0x00 = 0x100,
# wait for bit 8 to read clear. Programmer 0x2c42ae0: +0x0c = 0x000a0003, mask +0x28 =
# 0x00fd0000 (bit 4 clear), format +0x40 = 1, pitch +0x130, origin +0x12c (y << 16 | x),
# size +0x44 (height << 16 | width), +0x48, restart +0x80, source +0x140/+0x100 and
# destination +0x14c/+0x10c (bits 34..32, then the low word), limit +0x110, +0x11c = 1,
# +0x120 = 0, then +0x84 = select << 8, the 32 table words at +0x8c (luma then chroma, first
# byte in bits 31..24) when the request selects tables, and +0x84 = select. Start 0x2c42a30
# sets +0x00 bit 0. Handler 0x2c428b8 (interrupt record 0xd, INTID 207) reads +0x24, writes
# it back, takes bit 4 as a finished run and reads the stream size at +0x98/+0x94.
# These are the words and sequences of the X-T3 5.11 driver, so the model is the shared
# X-Processor encoder: it writes a whole stream (SOI, DHT, DQT, DRI, SOF0 4:2:2, SOS, scan,
# EOI) at the destination. That the X-T5 block also writes the headers, and that format 1
# is packed Y0 Y1 Cb Cr as on the X-Processor 4, is inferred from the shared driver, not
# observed on the part. run_ticks is functional, not measured.
[[device]]
base = 0xffd10000
size = 0x1000
kind = "jpeg-encoder"

[device.options]
irq = 207
run_ticks = 1000
