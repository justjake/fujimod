# Firmware entry after the mask ROM loads the SD card startup stage.
pc = 0xff800000
sp = 0xff83c000
slot = 0xff9b0000
stage_max_bytes = 0x3c000

[power_controller_registers]
"0" = 0x8202
"10" = 0x0002

# GPIO pad model of a start that runs the stock setup. The setup programs each port's +4 word
# (output enables) and +8 word; the default "legacy" model reads +8 as the output mask and +4 as
# the data, which holds only while both stay zero, as on the loader start. With the setup's
# values it returns wrong pad levels (port 0 then reads the shutter pins and the lens detect pin
# from +4, and the application never powers the lens or the sensor: REC with a black display).
# "data-latch" (+4 output enable, +0 output data) is the model the X100VI manifest uses, inferred
# from the same setup program. The loader start keeps its model: this option is set for ROM and
# SD card starts only, so the default boot manifest and its snapshots do not change.
[[window_options]]
base = 0xff907000
set = { pad_model = "data-latch" }

# Windows the X-T5 SD card stage needs beyond the shared ROM-start fragment
# (catalog/soc/xp5/rom-start.toml). They belong to this start only: the default loader start
# never runs the stock setup, and its boot manifest and snapshots stay unchanged.

# Memory-controller status. The stock setup in the stage file writes 0xfaf07680 = 0x97100005
# (0xff800be8) and polls 0xfaf07780 until it reads non-zero (0xff800bf4..0xff800bfc), then takes
# the low byte of 0xfaf07784 as a result code. It never writes 0x780 itself, so the fragment's
# answer-after-a-write stub would read 0 for ever. The constant is the answer the former X-T5
# bring-up runner gave (0x780 = 1). A scripted answer, not a model. All four controllers get it;
# the fragment adds its other registers (0x784, 0x800) to each page.
[[device]]
base = 0xfaf07000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [{ offset = 0x780, mode = "constant", value = 1 }]

[[device]]
base = 0xfaf17000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [{ offset = 0x780, mode = "constant", value = 1 }]

[[device]]
base = 0xfaf27000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [{ offset = 0x780, mode = "constant", value = 1 }]

[[device]]
base = 0xfaf37000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [{ offset = 0x780, mode = "constant", value = 1 }]

