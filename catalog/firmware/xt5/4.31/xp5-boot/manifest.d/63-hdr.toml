# X-T5 4.31 HDR still (drive dial HDR, Recf sequence 0x23/0x25/0x27): completion stubs for the
# blocks after the alignment pyramid that no other window owns. Decoded statically from the stock
# drivers (2026-11-19); not checked against hardware, not run.
#
# HDR steps in order (sequence 0x23 at 0x3331318, step names 0x33315a8, block per step from the
# step switch 0x2d8c9c0):
#   0x4b..0x51 HdrYC        RIFP (RCIF)                  modelled (still path)
#   0x52..0x58 HdrDst       RESZ 0xffd0c000              modelled
#   0x59..0x5c HdrPrProcess MOVRSZ 0xff982000 (PR_S)     modelled: half-size 8-bit luma pyramid
#   0x5d, 0x5e HdrTpSp      TPSP 0xff986000              below
#   0x5f, 0x60 HdrGme       software (0x2d88d10 reaches no imaging MMIO)
#   0x61..0x63 HdrAlignment RTCH 0xffd27000              56-develop-stubs-2.toml
#   0x64..0x69 HdrMotionCorrection MAP 0xffd23000 / MIX 0xffd22000   MAP below, MIX in 57
#   0x6a       HdrGeneratCompositeMap HDRCR: image DSP 0xff000000 / 0xff400000   below
#   0x6b       HdrComposite MIX 0xffd22000               57-develop-stubs-3.toml
#   0x6c, 0x6d HdrPostProcessing / PostYCHdr RIFP        modelled
# then the normal develop and JPEG steps.
#
# INTIDs from the logical IRQ table 0x18ea918 (16-byte entries): 0x6f -> 198 (TPSP),
# 0x1a -> 214 (MAP), 0xa0 -> 221 (image DSP); all level (flag 1).
# Ownership checked against manifest.toml and manifest.d/*.toml (10..62): none of the windows
# below overlaps an owned range (nearest: 0xff984000 RZL2, 0xff987000 stub, 0xffd22000 MIX,
# 0xffd24000 TNR, 0xff90e720 and 0xff90e748 words, 0xff800000 boot SRAM).
# delay_us is functional, not measured.

# TPSP (logical 0x6f). Driver 0x2c643f0..0x2c654c0, state words 0x3832e14 / 0x3833320.
# Users: recfTpSpProcess 0x2d3d734 (steps 0x5d/0x5e).
# Open 0x2c643f0: clocks 0x13ab5d0(0xc, ...), reset release 0xff90db10 bit 9 (power gates),
#   0x2c64768: +0x00 write 0, then a plain load loop until +0x00 reads exactly 1  -> constant 1;
#   0x2c6479c: +0xf8 |= 1.
# Set 0x2c64494: address-high words 0xff90e700 / 0xff90e704 (0x2c65194, window below), then
#   parameters +0x10..+0xe8 (0x2c647c0, 0x2c64c3c, 0x2c64d14, 0x2c64ef8) and +0xf0 / +0xf4
#   (0x2c651fc), all stored.
# Start 0x2c64584 -> 0x2c65294: ISR 0x2c643c0 on logical 0x6f, cache maintenance on
#   0xff90e700 << 32 | +0x10, +0x08 = mode, +0xf0 / +0xf4 |= 1 << 28, +0x04 = 1 = START (last).
# ISR 0x2c643c0: +0xf8 |= 1 (read-modify-write, 0x2c6479c), state 3, callback. No status read.
# Stop 0x2c65340: +0xf0 / +0xf4 &= ~(1 << 28), then polls +0xf8 until bits 16 and 8 are both
#   set -> +0xf8 reads 0x10100. The completion status is kept in +0xfc (no driver access) so
#   the ISR's write of +0xf8 bit 0 can acknowledge it.
[[device]]
base = 0xff986000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x000, mode = "constant", value = 0x1 },
  { offset = 0x0f8, mode = "constant", value = 0x10100 },
]
irq = 198
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0xfc, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0xf8, mode = "w1c", status_offset = 0xfc, bits = 0x1 }

# TPSP address bits 34..32: 0x2c65194 writes 0xff90e700 / 0xff90e704 (3 bits each); the start
# 0x2c65294 reads 0xff90e700 back for cache maintenance. Plain words (register file).
[[device]]
base = 0xff90e700
size = 0x8
kind = "bringup-stub"
[device.options]
registers = []

# MAP (logical 0x1a). Driver 0x2c494c8..0x2c4ae70, state words 0x3832e0c / 0x3832f78.
# Users: recfMapProcess 0x2d3db94 (MAP_S; steps 0x64..0x69 with MIX).
# Open 0x2c4a250: clocks 0x13ab5d0(0x10, ...), reset release 0xff90db08 bit 4 (0x2c4a1e8),
#   ISR 0x2c49878 on logical 0x1a, +0x34 = 1 (0x2c49854, clear).
# Reset handshake 0x2c49814: +0x00 = 0 (0x2c4a390), poll until +0x00 bit 0 reads 1 -> constant 1.
# Start 0x2c4a018 (state 4 -> 2): handshake, address words (0x2c49ee8: +0x50.. with high bytes),
#   0x2c49fb8 polls +0x10 until bit 16 AND bit 0 read 1 (-> constant 0x10001), writes +0x18,
#   +0x1c, +0x14 = 0x10001 (link enables); +0x38 = 1 (0x2c4a5c4, IRQ enable); reads +0x40
#   (mode) for cache maintenance; +0x04 = 1 = START (0x2c4a3f8, last).
# ISR 0x2c49878: +0x34 = 1 (clear), state 3, callback. No status read; +0x30 is the status by
#   analogy with RTCH and 0xff987000 (+0x30 status, +0x34 clear, +0x38 enable).
# Stop 0x2c4a18c: +0x38 = 0, +0x14 = 0, polls +0x10 (bits 16 and 0) again, handshake.
[[device]]
base = 0xffd23000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x000, mode = "constant", value = 0x1 },
  { offset = 0x010, mode = "constant", value = 0x10001 },
]
irq = 214
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x30, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x34, mode = "w1c", status_offset = 0x30, bits = 0x1 }
irq_mask_offset = 0x38
irq_mask_bit = 0
irq_mask_set_masks = false

# Image DSP (logical 0xa0), used by HDRCR (step 0x6a, recfHdrcrProcess 0x2d3d94c) and by DMEX,
# CLMP, CLTY and CLST. Driver 0x13890b0..0x138a730, state word 0x2006ca0. It loads a program
# into the DSP and runs it; the stub accepts the program and completes each run.
# Window 0xff000000..0xff401fff: the program/data memory and control words at 0xff000000 and
#   the debug/status page at 0xff400000 (no other access to 0xff001000..0xff3fffff was found).
# Open 0x13890f4 (semaphore 0x86): 0xff90ea20 / 0xff90ea10 control bits (window below), clock
#   gates 0xff90c914 bits 9..12 (clock-gates), clocks 0x13ab5d0(0, ...);
#   0x138a234: address words +0x10 / +0x14 / +0x18 (bits 31..0; bits 34..32 to 0xff90e740 and
#   0xff90ea1c), program images copied by 0x1389fa8 to 0xff000000 + destination (image table
#   0x2006cc8 from 0x138a484; destinations 0x200 and 0x10c40 / 0x18c40, sizes up to 0xe00);
#   0x138a334: +0x08 = select fields; 0x138a120 polls 0xff400518 until bit 1 reads 0.
# Start 0x1389238: ISR 0x13890b0 on logical 0xa0; 0x138a468 copies the 0x2c-byte parameter
#   block to +0x40; +0x1c = 0x40 (0x138a368, the parameter offset) = START here; 0x138a388
#   polls 0xff400410 until bit 29 reads 0; then pulses the run reset 0xff90c914 bit 9
#   (0x138a074(0), delay 0x14c749c(1), 0x138a074(1)).
# ISR 0x13890b0: 0x138a3b4 sets 0xff90ea10 bit 7, writes 0xff40119c = 0xff (taken as the
#   acknowledge), polls 0xff400604 until bits 0..12 and 16 read 1 (-> constant 0x11fff), clears
#   0xff90ea10 bit 7; 0x138a434 clears 0xff400624 bit 31; run reset asserted; callback.
# The completion is due after the start's reset pulse: delay_us is longer than the 1-unit delay.
[[device]]
base = 0xff000000
size = 0x402000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x400604, mode = "constant", value = 0x11fff },
]
irq = 221
starts = [{ offset = 0x1c, mask = 0xffffffff }]
delay_us = 2000
completion = [{ offset = 0x40119c, set = 0x1 }]
ack = { offset = 0x40119c, mode = "w1c" }

# Image DSP control words: 0x138a0e4 / 0x138a14c / 0x138a1f8 / 0x138a3b4 read-modify-write
# 0xff90ea10 bits 0, 1, 2, 7; 0x138a234 writes 0xff90ea1c (address bits 34..32); 0x138a188 /
# 0x138a1c4 read-modify-write 0xff90ea20 bits 23..16 and 30..28. Plain words (register file).
[[device]]
base = 0xff90ea10
size = 0x14
kind = "bringup-stub"
[device.options]
registers = []

# Image DSP address bits 34..32 (0x138a234 at 0x138a2b8). No read found.
[[device]]
base = 0xff90e740
size = 0x4
kind = "write-only-registers"
