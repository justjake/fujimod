# DV720 neural accelerator registers at ffe00000, the X100VI layout (47-dv720.toml there).
# The AI task 0x2de0b50 zeroes +0x100..+0x14c one word at a time (0x2de0d04..0x2de0d20,
# end 0xffe00150 from 0x2de0b98) and then calls the initializer 0x57ce844, which takes the
# register base 0xffe00000 (0x57ce8d4), writes +0x800 = 0, +0x810, +0x820 = 0, +0x800 = 1
# (0x57ce9d0..0x57cea14), reads +0x11c and keeps its 1 MiB default capacity unless the
# value is positive (0x57cea2c..0x57cea40), and writes +0x144 = 0x177654 (0x57cea5c).
# FujiMod's bring-up register file stores each write and reads it back, so +0x11c reads the
# zero the loop wrote. It is declared only over those registers: the job start through the
# table at 0x580c258 (its registers not read) and the completion poll of 0x57cfad4 (+0x808
# for unit 0, from 0x580c208) stay unowned and refuse.
# Not a model of the accelerator; nothing here is checked against the part.
[[device]]
base = 0xffe00100
size = 0x50
kind = "bringup-stub"
[device.options]
registers = []

[[device]]
base = 0xffe00800
size = 0x4
kind = "bringup-stub"
[device.options]
registers = []

[[device]]
base = 0xffe00810
size = 0x4
kind = "bringup-stub"
[device.options]
registers = []

[[device]]
base = 0xffe00820
size = 0x4
kind = "bringup-stub"
[device.options]
registers = []
