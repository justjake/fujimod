# X-T5 4.31 gap stubs: MMIO pages the firmware reaches that no window owns (static scan of the
# 4.31 image, 2026-11-18, plus the unowned-MMIO ledger of the local discovery run scratch/up/run2).
# None of these is a model. `bringup-stub` stores the last write and reads it back, apart from the
# listed registers; `write-only-registers` stores 32-bit words and refuses every read. They only
# turn a strict stop into "the guest goes on"; a block that must raise a completion interrupt will
# then show as a hang, not as a stop. Nothing here is checked against hardware.
#
# Checked against the manifest as of 2026-11-18 19:10 (with the 0xff800000 boot-SRAM RAM region and
# manifest.d/52-jpeg.toml): no window below overlaps an owned range.

# ---------------------------------------------------------------------------------------------
# Tier 1: live view start (shooting screen). Hit or next in line after 8.73 s.
# ---------------------------------------------------------------------------------------------

# IBUF, the imaging input buffer (driver 0x138a8dc..0x138ba9c, strings "IBUF MAX ERROR.",
# "IBUF PARAM ERROR."). run2 discovery: unowned writes to +0x08, +0x14, +0x18, +0x20, +0x24 and a
# read of +0x08 from 8.73 s. Open (0x138b9e0) writes 1 to +0x6c, clears bit 0 of +0x00
# (0x138a970(0)) and then waits in 0x138a8f0 for bit 0 of +0x00 to read 1, with no timeout: the
# same reset handshake as the display and LZ blocks. +0x00 therefore reads 1 here (inferred).
# The X100VI discovery run 1794510140489 touched this page too (25 writes, 1 read).
# 2026-11-19: now the shared `imaging-buffer` model with its transfer completion, no longer
# a stub. Movie live view re-arms IBUF once a frame (start = +0x40 bit 0) and waits for its
# completion (INTID 169, clear +0x6c) before saclac reports the movie job done; the stub never
# completed, so movie live view stayed black (run52). +0x00 still reads 1 outside a reset.
# completion_us is a guess shorter than one 33.3 ms frame, not a measured transfer time.
[[device]]
base = 0xff945000
size = 0x1000
kind = "imaging-buffer"
[device.options]
completion_us = 8000

# Four table pages of the sensor/IBUF driver (0x1353fe4, 0x135425c, 0x1354628; bases 0xff94c000,
# 0xff94d000, 0xff94e000, 0xff94f000 plus a computed index). The register-dump table 0x378db0c
# lists +0x00..+0x28 on each. Read or write direction of the computed accesses is not resolved, so
# this is a register file, not a write-only window. Reach in live view is a guess (same driver as
# the sensor program path that already runs).
[[device]]
base = 0xff94c000
size = 0x4000
kind = "bringup-stub"
[device.options]
registers = []

# Two lookup tables of up to 0x1000 words each: 0x1364940 writes 0xff951000 + 4*i and 0x1364a74
# writes 0xff955000 + 4*i (i < count <= 0x1000), so each table spans four pages. With count 0 the
# code writes 0x3fff3fff to +0 and 0 to +4. All 32-bit writes; no read found.
[[device]]
base = 0xff951000
size = 0x4000
kind = "write-only-registers"

[[device]]
base = 0xff955000
size = 0x4000
kind = "write-only-registers"

# Table block written by 0x1366e70 (eight sub-tables at +0x000..+0x700, 32-bit writes only).
[[device]]
base = 0xff959000
size = 0x1000
kind = "write-only-registers"

# Three 0x400-byte tables per page (+0x000, +0x400, +0x800), written word by word by 0x1367c74
# (0xff95a000) and 0x1367d80 (0xff95b000). The X100VI discovery run recorded 5376 writes on each
# page and no read.
[[device]]
base = 0xff95a000
size = 0x1000
kind = "write-only-registers"

[[device]]
base = 0xff95b000
size = 0x1000
kind = "write-only-registers"

# One word at 0xff960000, named by the register descriptor 0x18dc658. 0x137345c writes it and
# 0x13734e4 reads it back (table reader 0x1370f00) together with the 0xff96cb00 group.
[[device]]
base = 0xff960000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = []

# Live-view pipeline stage programmed from the descriptor tables 0x18dc610..0x18de1d0 by
# 0x2c6e1c4 (table writer 0x1370e54; callers are the sensor-control code under "MOVDC"). run2
# discovery: 187 unowned writes on 188 offsets and one read of +0xb30 (0x1373568 keeps bit 0;
# 0x1373538 writes it). 0x2e5888c reads groups back through 0x1370f00, so reads must work.
[[device]]
base = 0xff96c000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = []

# Second stage of the same tables (0x18dd4c8..0x18de068: +0x000, +0x100.., +0x200.., +0x400..,
# +0x500.., +0x600.., +0x700). run2 discovery: 136 unowned writes on 124 offsets, no read. The
# X100VI discovery run recorded 22304 writes here.
[[device]]
base = 0xff96e000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = []

# ---------------------------------------------------------------------------------------------
# Tier 2: first half-press (S1) and the first card transfer.
# ---------------------------------------------------------------------------------------------

# DRAM channels 2 and 3, controller page +0x9000. The S1 boost 0x13adb58 ends in 0x13aeec8, which
# calls 0x13af194 for each channel whose flag at 0x24d3350 is 1; it writes ten words (+0x08,
# +0x14, +0x1c, +0x20, +0x2c, +0x30, +0x3c, +0x40, +0x44, +0x4c) through 0x13bb99c (base table
# 0x18fcf30 = 0xfaf00000 + channel * 0x10000). Writes only. The X100VI ROM start recorded the
# same ten writes on 0xfaf09000..0xfaf39000. Channels 0 and 1 are trained before the hand-off and
# are not listed.
[[device]]
base = 0xfaf29000
size = 0x1000
kind = "write-only-registers"

[[device]]
base = 0xfaf39000
size = 0x1000
kind = "write-only-registers"

# 0x13afabc (called once from 0x13aeec8, not per channel) writes 0x20 to 0xfae62050, 0xfae62250
# and 0xfae62450 after the 0xfae000a0.. loop that the 0xfae00000 window already takes.
[[device]]
base = 0xfae62000
size = 0x1000
kind = "write-only-registers"

# SD address-high words. 0x13a8ea0(slot, port, high), called through 0x13a1e4c and 0x13a3638
# from the block read 0x13a2340 and the block write 0x13a2574, writes 0xff90e7d8 + slot*0xc
# (port 0) or 0xff90e7d0 and 0xff90e7d4 + slot*0xc (port 1). The port 0 words 0xff90e7d8 and
# 0xff90e7e4 belong to the slot hosts (address_high in 25-sd.toml). The UHS-II port 1 words
# stay writes only: the UHS-II ports run no data transfers.
[[device]]
base = 0xff90e7d0
size = 8
kind = "write-only-registers"

[[device]]
base = 0xff90e7dc
size = 8
kind = "write-only-registers"

# Audio serial instance 1 (0xff991000) moved to 62-audio.toml as an `audio-serial` window.

# Tier 3 (capture and develop stages) is left out on purpose: a clean strict stop at the first
# capture block is easier to model than a hang. Candidate stubs: scratch/mmiogap/49-gap-stubs.toml.

# Capture register tables: 0.19 s after S2 the table writer 0x1370e54/0x1370ec8 (CPU3) writes
# 0xff961000..0xff96b18f (about 11,000 words; discovery run scratch/up/run17, 2026-11-18). Reads not
# seen yet, so this is a plain register file.
[[device]]
base = 0xff961000
size = 0xb000
kind = "bringup-stub"
[device.options]
registers = []
