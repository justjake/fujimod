# Receiver PHY at ff944000, the X100VI layout: 0x136a93c writes the control
# word +0x0 (bits 1 and 0) and 0x2eb9ca8 polls +0x0 bit 0 (0x136a9ac) until it
# reads 1; the global words +0x4..+0xc have one setter and one getter each
# (0x136a9e4..0x136ab5c). Lane words +0x100..+0x148 repeat per lane at
# 0x100 + n * 0x100, n < 4 (0x136aba4..0x136bdd0); the lane loops 0x2eb9e24,
# 0x2eba8bc, 0x2eba964 and 0x2ebaa70 read a word, change fields and write it
# back. The shared model stores these words and refuses all others.
[[device]]
base = 0xff944000
size = 0x1000
kind = "imaging-phy"
