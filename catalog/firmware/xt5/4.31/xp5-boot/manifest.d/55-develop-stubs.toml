# X-T5 4.31 still develop chain: completion stubs for PPFP, IIFP, the recf register queue, RESZ and RZL2.
# Decoded statically from the stock drivers (scratch/still/REPORT.md); not checked against hardware.
#
# All accesses below go through the 32-bit helpers 0x5dd28 (write) / 0x5dd50 (read) with
# constant addresses; no 8/16-bit helper (0x5dd30/0x5dd3c/0x5dd58/0x5dd60) touches these
# pages. INTIDs come from the logical IRQ table 0x18ea918 (16-byte entries, word 0 = INTID):
# logical 8 -> 199 (PPFP), 9 -> 206 (IIFP), 0xa -> 203 (RESZ, shared with RCIZ), 0xc -> 205 (RZL2),
# 0x70 -> 202 (RIFP).
#
# Ownership checked against manifest.toml and manifest.d/*.toml: none of these windows
# overlaps an owned window (nearest owned: 0xff974000 imaging-preview, 0xff976000 imaging-paf,
# 0xff982000 imaging-resize, 0xffd01000 imaging-rifp-io, 0xffd02000 imaging-rifp,
# 0xffd10000 jpeg-encoder).
#
# delay_us is functional, not measured.

# PPFP. Open 0x2c43484, run 0x2c43190 -> 0x2c43818 + 0x2c43ef0, stop 0x2c4327c, ISR 0x2c43084.
#  +0x00  0x2c437d4 writes 0 (bit 0 = 0); 0x2c43834 polls until bit 0 reads 1   -> constant 1
#  +0x28  0x2c43aec writes 1 (first write of the run, before the +0x10 poll)
#  +0x10  0x2c43f14 (run) and 0x2c43944 (stop) poll until bit 0 AND bit 16 read 1 -> constant
#  +0x14  0x2c4390c writes 0x10001 (run) / 0 (stop)
#  +0x04  0x2c43878 writes 1 = START (last write of 0x2c43ef0, called at 0x2c44044)
#  +0x20  ISR 0x2c43a54 reads bit 0 (not tested; the ISR always runs the callback)
#  +0x24  ISR 0x2c43a8c writes back the bit 0 it read from +0x20 -> w1c on +0x20
# No interrupt enable/mask word found.
[[device]]
base = 0xffd00000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x10, mode = "constant", value = 0x10001 },
]
irq = 199
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x20, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x24, mode = "w1c", status_offset = 0x20, bits = 0x1 }

# IIFP. Open 0x2c45adc, run 0x2c45984 -> 0x2c457d8, close 0x2c45b5c, ISR 0x2c45004.
#  +0x10c 0x2c46c08 writes 1 (0x2c45964, run, before start) / 0 (0x2c45a2c, close) = IRQ enable
#  +0x98, +0x100  0x2c4580c..0x2c45828 polls until (+0x98 bit 0) & (+0x100 bit 0) != 0
#  +0x9c, +0x94   read-modify-write, bit 8 set (0x2c4584c, 0x2c45854)
#  +0x28, +0x2c   address words (0x2c4586c, 0x2c45874)
#  +0x00  0x2c45efc writes 0; 0x2c45884 (run) and 0x2c44fc8 (open) poll until bit 0 reads 1
#  +0x04  0x2c45f64 writes 1 = START (0x2c458e4, last write of the run)
#  +0x104 ISR 0x2c46b98 reads bit 0 (not tested)
#  +0x108 ISR 0x2c46bd0 writes constant 1 (0x2c44fe4), also at open/close
[[device]]
base = 0xff975000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x98, mode = "constant", value = 0x1 },
  { offset = 0x100, mode = "constant", value = 0x1 },
]
irq = 206
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x104, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x108, mode = "w1c", status_offset = 0x104, bits = 0x1 }
irq_mask_offset = 0x10c
irq_mask_bit = 0
irq_mask_set_masks = false

# The register pages of the recf develop sub-blocks between RIFP and RESZ
# (0xffd03000..0xffd0bfff) belong to the imaging-rifp window (50-imaging.toml).

# RESZ (standalone still step 0x2d3b658 -> run 0x1487bd4; stop 0x1487acc; ISR 0x1486738, shared
# with RCIZ on logical 0xa). In this path every write is direct (queue pointer x1 = 0).
#  +0x114 0x13be92c writes 3 (0x1487c74, before start) / 0 (0x1487b24, stop) = IRQ enable bits 0..1
#  +0xfc, +0x100  bit 28 set (0x1487b9c, 0x1487bb4) / cleared at stop (0x1487a2c, 0x1487a44)
#  +0x04  0x13bd420 writes 1 = START (0x1487bc4, last write of the run)
#  +0x10c ISR 0x13be84c reads bit 1 and bit 0; nothing done if both are 0. Bit 1 goes to the
#         callback 0x2d39c2c, which stores it in 0x393ece0; the step treats non-zero as an
#         error (0x2d3b6a8). So completion sets bit 0 only.
#  +0x110 ISR 0x13be8a0 writes back the bits it read (w1c); stop writes 3 (0x1487b28)
#  +0x118 stop 0x13be99c: bits 0..3 or 8..11 non-zero -> -0xff. Left unwritten (reads 0).
#  +0x108 stop polls 0x1487a48 until bit 24 and bit 8 read 1 -> constant
#  +0x00  stop 0x13bd38c writes 0; 0x14879f4 polls until bit 0 reads 1 -> constant
# imaging-resz is this completion stub (same options); with XT5_STILL_PATH=real each start
# also scales the packed 4:2:2 source (+0xd0/+0xd4, pitch +0xe0, size +0x14) to the
# destination (+0xe4/+0xe8, pitch +0xf4, size +0x20), nearest neighbour; a zero source
# (RCIZ inline) reads the RIFP still output (emulator-xp5-imaging imaging_still.rs).
[[device]]
base = 0xffd0c000
size = 0x1000
kind = "imaging-resz"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x108, mode = "constant", value = 0x01000100 },
]
irq = 203
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x10c, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x110, mode = "w1c", status_offset = 0x10c, bits = 0x3 }
irq_mask_offset = 0x114
irq_mask_bit = 0
irq_mask_set_masks = false

# RZL2. Open 0x1489cbc, run 0x14899c8, stop 0x1489b20, ISR 0x1489e04.
#  +0x10c 0x13c0b10 writes 7 (0x148997c, table 0x15ee7b0 = 1,1,1) / 0 (0x1489ab4) = IRQ enable
#  +0xf8, +0xfc  bit 28 set (0x1489900(1), 0x13c0334 / 0x13c0354) / cleared at stop
#  +0x04  0x13c02a4 writes 1 = START (0x148995c, last write of the run)
#  +0x104 ISR 0x13c09b8 reads bits 0, 1, 2. Callback code = (bit1 ? 1 : 0), +2 if bit 2;
#         0 = clean finish. So completion sets bit 0 only.
#  +0x108 ISR 0x13c0a64 writes constant 7 (table 0x15ee7c0 = 1,1,1)
#  +0x110 stop 0x13c0b50: bits 0..3, 8..11 or 16..19 non-zero -> -0xff. Left unwritten.
#  +0x100 stop polls 0x1489938 until bit 24 and bit 8 read 1 -> constant
#  +0x00  0x13c023c writes 0; 0x14896b8 polls until bit 0 reads 1 -> constant
# imaging-rzl2 is this completion stub (same options); with XT5_STILL_PATH=real each start
# also scales the packed 4:2:2 source (+0xcc/+0xd0, pitch +0xdc, size +0x14, crop +0x18/+0x1c)
# to the destination (+0xe0/+0xe4, pitch +0xf0, size +0x20), nearest neighbour: the RESZ
# layout with the address words 4 bytes lower (parameters 0x14896d4 -> 0x13c055c, addresses
# 0x1489874 -> 0x13c0384). CreateInnerYC (step 0x26) runs it twice: main -> 640x480 preview
# (id 0x25), preview -> 160x120 thumbnail (id 0x26) (emulator-xp5-imaging imaging_still.rs).
[[device]]
base = 0xff984000
size = 0x1000
kind = "imaging-rzl2"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x100, mode = "constant", value = 0x01000100 },
]
irq = 205
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x104, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x108, mode = "w1c", status_offset = 0x104, bits = 0x7 }
irq_mask_offset = 0x10c
irq_mask_bit = 0
irq_mask_set_masks = false
