# X-T5 4.31 still develop chain, part 2: completion stubs for RTCH (rotate) and KB (dark-frame subtract).
# Decoded statically from the stock drivers (scratch/still/s2/); not checked against hardware.
#
# A normal single JPEG runs Recf sequence 3 (posted by 0x2d77380, called from 0x2d48648) and then
# sequence 4 (0x2d7747c, called from 0x2d4ebc8). The only hardware those two sequences touch that
# no earlier window covers is RTCH at 0xffd27000, used by the Rotate steps 0x43 (seq 3) and
# 0x44 (seq 4) for every orientation: 0x2d83f94 -> 0x2d31080 -> 0x2ddd5a0 -> 0x2c3cf1c
# ("imgTransformProcess", marks RTCH_S/RTCH_E). The step skips the block only when the job flag
# at job+0x6044 is set (0x2d84050), which the cancel paths set.
#
# All accesses go through the 32-bit helpers 0x5dd28 (write) / 0x5dd50 (read) with constant
# addresses (plus RTCH 0xffd270a0 + n*0x30 / 0xffd270a4 / 0xffd270a8 in 0x2c4e4d4, inside the page).
# INTIDs come from the logical IRQ table 0x18ea918: logical 0x1b -> 215 (RTCH), 7 -> 212 (KB),
# both level (flag 1).
#
# Ownership checked against manifest.toml and manifest.d/*.toml (including 55-develop-stubs.toml):
# nothing is owned in 0xffd20000..0xffd2ffff.
#
# delay_us is functional, not measured.

# RTCH (rotate). Open 0x2c4e00c, params 0x2c4dd28, start 0x2c4ddb8, stop 0x2c4deb0, ISR 0x2c4dce8.
#  +0x00  0x2c4e15c writes 0; 0x2c4e16c polls until bit 0 reads 1 (open and stop)      -> constant 1
#  +0x10, +0x14  0x2c4e21c (run) and 0x2c4e2a0 (stop) poll until (v & 0x10001) == 0x10001 on
#         both words                                                                  -> constant
#  +0x18, +0x1c  0x2c4e27c / 0x2c4e28c write 0x10001 (run), 0x2c4e2bc / 0x2c4e2cc write 0 (stop)
#  +0x38  0x2c4e340 writes 0x11000101 (table {1,1,0,0,1,1} -> bits 0,8,24,28) before start;
#         0x2c4e390 writes 0 at stop = IRQ enable
#  +0x04  0x2c4e334 writes 1 = START (0x2c4de50, last write of the start)
#  +0x30  ISR 0x2c4ebf8 reads the status and saves it to 0x3833fd8; 0x2c4df14 returns it and
#         0x2c3cfb8 ignores the value. Waiter 0x2c3cf9c: event flag 0x30, OK when bit 5 is clear
#         (callback 0x2c3c9e8 sets 0x10).
#  +0x34  0x2c4e210 writes 0x11110101 (ISR, open, stop) = clear
#  +0x20, +0x24, +0x40..+0xc8, +0x400: parameters, stored.
[[device]]
base = 0xffd27000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x10, mode = "constant", value = 0x10001 },
  { offset = 0x14, mode = "constant", value = 0x10001 },
]
irq = 215
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x30, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x34, mode = "w1c", status_offset = 0x30, bits = 0x1 }
irq_mask_offset = 0x38
irq_mask_bit = 0
irq_mask_set_masks = false

# CONDITIONAL: KB (recbfSubShadeRawProcess, step 0x0, sequence 0xd only; long-exposure
# dark-frame subtraction). Not used by a normal single JPEG. Same register family as RTCH.
# Process 0x2d3a7e0, open 0x2c61ef4, start 0x2c62178, ISR 0x2c61b9c.
#  +0x00  0x2c61fec writes 0; 0x2c61ffc polls until bit 0 reads 1                      -> constant 1
#  +0x10  0x2c620c4 (run) and 0x2c6211c (stop) poll until (v & 0x10001) == 0x10001      -> constant
#  +0x14  0x2c620e0 writes 0x10001 (run) / 0x2c62108 writes 0 (stop)
#  +0x38  0x2c6214c writes 1 / 0x2c6216c writes 0 = IRQ enable
#  +0x100 0x2c62258 reads bit 0 before start; 0 skips an optional cache loop (0x2c62274).
#  +0x04  0x2c622ac writes 1 = START (last write of 0x2c62178)
#  +0x34  ISR 0x2c6209c writes 1 = clear; the ISR reads no status word (callback only)
[[device]]
base = 0xffd21000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x10, mode = "constant", value = 0x10001 },
]
irq = 212
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x30, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x34, mode = "w1c", status_offset = 0x30, bits = 0x1 }
irq_mask_offset = 0x38
irq_mask_bit = 0
irq_mask_set_masks = false
