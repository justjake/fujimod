# Movie audio capture: audio serial interface instance 0 and the PL330 that moves its samples.
# Static reading of the X-T5 4.31 drivers (scratch/movie/audio/, 2026-11-19); not run.
#
# Audio serial driver 0x1388700..0x1389098: instance id 0/1 at 0xff91c000 + id * 0x75000, that
# is 0xff91c000 and 0xff991000 (0x1388730; table 0x18e93b8). The `audio` task opens instance 0
# (handle 0x1c121c4) at 0x1491420 for receive (and channel-1 playback) and instance 1 (handle
# 0x1c121c8) at 0x1491508 for channel-2 playback. Registers: +0x00 receive FIFO (0x1388d6c),
# +0x04 transmit FIFO (0x1388d98), +0x08 control, +0x0c format (bits 4..0 word length - 1:
# 0xf 16-bit, 0x17 24-bit), +0x10 slot mask (3 stereo, 0xf four slots), +0x14, +0x18 enable
# (bit 0), +0x1c soft reset (write 1, poll bit 0 to 0: 0x1388744), +0x20 interrupt mask,
# +0x24 status (0x1388e00 polls bit 16 or 17 after enable, no timeout), +0x28 DMA enable.
# This window replaces the former +0x1c-only reset-handshake at 0xff91c000 (20-storage.toml).
# Instance 1 (0xff991000) is the same interface. In movie mode the audio task enables it
# (0x1388658 -> 0x1388e00 with id 1) and polls +0x24 for bit 16 or 17 with no timeout. It was a
# bring-up stub whose +0x24 read 0, so the poll spun forever on its core (run58: CPU 3 at
# 0x1388e84..0x1388e9c reading 0xff991024 from before S1 to the end). That most likely starved
# the `hist` task (mailbox 0xaf, entry 0x2e17e58), so the movie AE histogram job (0x3051d84 -> 0x2e17e00,
# done callback 0x304a4f0 -> MOVDC message 0x16a3) never completed and MOVDC deferred every
# STOP request (+0x30 bit 0x20000000 from 0x304522c, cleared only in 0x3051e5c).
#
# Receive DMA: 0x1491a8c starts handle 0x1c121d4 = descriptor 0xa (0x18e9660 + 0xa * 0x14 =
# {channel 0x10, request 0x40, class 1, burst 0x10}). Channels 0x10..0x17 (0x138babc class 1)
# are the threads 0..7 of an ARM PL330 at 0xff938000 (DBGSTATUS +0xd00, DBGCMD +0xd04,
# DBGINST0/1 +0xd08/+0xd0c, INTEN +0x20, INTCLR +0x2c, CSR +0x100, SAR/DAR +0x400/+0x404;
# driver 0x139ad80..0x139b6c8). Thread 0 runs peripheral request 0 (0x40 - 0x40). Its program
# (0x1396af8 16-bit, 0x1398168 24-bit, at 0x1c75a40 + thread * 0x1000) is a two-buffer ring of
# 240 frames each: DMALDPS from +0x00, DMAST into the buffer, DMAWFE 1 (the CPU's permit,
# DMASEV 1 from 0x139b280), DMASEV 0, the other buffer, then DMALP 1/DMALPEND back to the start.
# Event n is logical interrupt 0x18e95e0[0x10 + n] = 0x64 + n, INTID 253 + n (table 0x18ea918,
# edge, priority 0xc0); the buffer-done callback is 0x1490fbc.
#
# The receive signal is a host test signal (sine tone or silence), paced at sample_rate_hz:
# the serial clock dividers are not decoded, so 48 kHz is a declared value. setup_ticks and
# bytes_per_tick time the PL330's unpaced transfers; they are functional, not measured.
[[device]]
base = 0xff91c000
size = 0x1000
kind = "audio-serial"
[device.options]
sample_rate_hz = 48000
tone_hz = 1000
tone_amplitude = 0.25

# Instance 1: transmit only in the paths read so far; the same test signal options are declared
# because the model requires them, and its receive FIFO is not read.
[[device]]
base = 0xff991000
size = 0x1000
kind = "audio-serial"
[device.options]
sample_rate_hz = 48000
tone_hz = 1000
tone_amplitude = 0.25

[[device]]
base = 0xff938000
size = 0x1000
kind = "audio-dma"
[device.options]
irq_base = 253
setup_ticks = 1000
bytes_per_tick = 1

# PL330 peripheral request select words: 0x1390014 writes 0xff90e500 + (request / 2 + 8) * 4
# (even request: 0x10000 | request; odd: 0x1000000 | request << 8). Request 0 writes 0xff90e520.
# The general-DMA routing view owns 0xff90e500..0xff90e51f. No read was found.
[[device]]
base = 0xff90e520
size = 0x40
kind = "write-only-registers"

# PL330 thread address bits 34..32: 0x138fe44/0x138fe80 write source/destination at
# 0xff90e788 + thread * 8 / +4 (0xff90e748 + (thread + 8) * 8); 0x138febc/0x138ff0c read them back
# for the position query 0x138dc44 (audio caller 0x1491f80). Plain words (register file).
[[device]]
base = 0xff90e788
size = 0x40
kind = "bringup-stub"
[device.options]
registers = []
