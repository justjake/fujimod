# Input reset gate at ff950000, the X100VI layout: 0x13630fc writes +0x0 = 0
# and polls +0x0 bit 0 until set; 0x1363140 (from 0x2eb893c and 0x2c6cb8c)
# reads +0x4, sets or clears bit 0 and writes it back. The shared model owns
# only +0x0 and +0x4; the later block registers (+0x8 onward) stay unmodeled.
[[device]]
base = 0xff950000
size = 0x1000
kind = "imaging-reset"
[device.options]
# Bring-up: the later block registers read back their last write (image-geometry setup
# from +0x8 onward, reached on the way to the shooting screen).
retain_words = true
