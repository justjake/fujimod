# Lazy-code/font streaming DMA and conversion block. 0x139f6d8 powers it (gate
# 0xff90db10 bit 3, polled at 0xff90db30) and runs the reset handshake 0x139f9d0
# (write 0 to +0x00, wait for nonzero, then for +0x24 == 0x10001); 0x139fa20 and
# 0x139fac8 write the address-high words 0xff90e70c/e708 that the model also owns.
[[device]]
base = 0xff980000
size = 0x1000
kind = "lz"

# SMAPH-H/OpenVG command renderer; 0x15ddae8 programs +0x01c, +0x034,
# +0xc18/+0xc1c and +0x1000..+0x18c0 (discovery-boot.md, item 5). Same window
# and kind as the X100VI. The model also owns the address-high word 0xff90e73c,
# which 0x1478854 sets to bits 34..32 of a draw buffer around each draw and
# clears afterwards (discovery-boot.md, item 7).
[[device]]
base = 0xff93c000
size = 0x3000
kind = "renderer"

# Display pixel-clock PLLs. The X-T5 clock API uses the same tables as the X100VI:
# PLL bases 0x18f2138 (index 6..9 = 0xffa11000..0xffa14000) and dividers 0x18f1ea8
# (16-byte rows; 0x13 = 0xffa11040, 0x16 = 0xffa12040, 0x17 = 0xffa13040,
# 0x18 = 0xffa14040). 0x13abcd0 writes N (+0x00) and the fraction (+0x08), then
# requests 3 at +0x80 (0x13ab894 waits for bits 0..2 clear) and waits for +0xf0 bit
# 0 clear (0x13abc9c); 0x13abaa8 writes a divider. The programmers 0x141ed3c (PLL 6,
# divider 0x13) and 0x141ee08 (PLL 7, divider 0x16) and the pixel-clock query
# 0x141f4ec (bank 1: PLL 6 and divider 0x13 times 12; bank 0: PLLs 8, 9 and
# dividers 0x17, 0x18 with the selector 0xff90c608 bit 0, via 0x13ab9ec) are
# instruction-for-instruction the X100VI 0x14f3220, 0x14f32ec and 0x14f3520, so the
# panel-pll model and its pixel-clock arithmetic apply unchanged. The N and divider
# values come from the configuration bytes the stock code reads (0x197da70,
# 0x197db00), not from this file.
[[device]]
base = 0xffa11000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa12000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa13000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa14000
size = 0x1000
kind = "panel-pll"

# Display controllers. 0x142dfa8(n) resets controller n (write 0 to +0x00, wait
# for bit 0) at 0xff990000 (n = 0) and 0xff9a0000 (n = 1); 0x142bebc reads
# +0x08 (discovery-boot.md, item 3). Same windows and kind as the X100VI; the
# scanout geometry comes from the registers the stock code programs.
[[device]]
base = 0xff990000
size = 0x1000
kind = "display"
[[device]]
base = 0xff9a0000
size = 0x1000
kind = "display"
