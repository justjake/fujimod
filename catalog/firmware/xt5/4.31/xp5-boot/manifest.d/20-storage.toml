# Original XOR-DAT payload; camera-specific missing tail starts erased.
# One backing is shared with serial flash and DMA; CPU aperture stores fail.
[[device]]
base = 0xf0000000
size = 0x08000000
kind = "flash-storage"
[device.options]
dat_origin = 0x274
xor = 0xff
erased_tail = 0xff

[[device]]
base = 0xff90a000
size = 0x1000
kind = "flash-storage-controller"
[device.options]
# Selected stock descriptor geometry; not an observed camera chip ID.
jedec_id = 0x20bb20

[[device]]
# Functional 1us completion, level INTID225 until masked ACK at +1c.
base = 0xff939000
size = 0x1000
kind = "flash-storage-dma"

[[device]]
# Known gate/reset latches start zero; this is a session assumption.
base = 0xff90c000
size = 0x1000
kind = "clock-gates"
[device.options]
configuration_word = 0

[[device]]
base = 0xff91c000
size = 0x1000
kind = "reset-handshake"
[device.options]
trigger_offset = 0x1c

# "Table-driven controller apertures".
[[device]]
base = 0xfaf05000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf15000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf25000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf35000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfae00000
size = 0x3000
kind = "write-only-registers"

[[device]]
base = 0xff90d000
size = 0x1000
kind = "power-gates"

# The bus-drain helper at 0x14c9af8 (selected by a mask in w0; the same shape as the X100VI
# helper) calls the word reader 0x5dd50 on 0x60000000 (bit 1, 0x14c9b3c), 0x80000000 (bit 2,
# 0x14c9b48) and 0x1c0000000 (bit 3, 0x14c9b54) and discards the value; bit 0 reads
# 0x1c8c378. Zero readback is a session assumption. The target ranges are bus ports, not
# RAM: the stock code reads only the first word. The 0x60000000 aperture replaces the
# X100VI's 0x68000000, which no X-T5 code path reads.
[[device]]
base = 0x60000000
size = 4
kind = "discarded-read"

[[device]]
base = 0x80000000
size = 4
kind = "discarded-read"

[[device]]
base = 0x1c0000000
size = 4
kind = "discarded-read"
