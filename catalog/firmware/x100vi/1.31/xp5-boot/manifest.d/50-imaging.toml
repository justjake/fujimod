# Sensor command DMA; stock program/readback/retry code remains intact.
[[device]]
base = 0xff948000
size = 0x1000
kind = "imaging-sensor"
[device.options]
# Functional scheduled latency, not measured camera timing.
command_latency_us = 1

# Sensor stream and receiver enables gate RAW14-LE16 ramp production.
# Guest-programmed raw input DMA receives pixels; causes1/0 drive stock IRQs.
[[device]]
base = 0xff940000
size = 0x1000
kind = "imaging-receiver"
[device.options]
# Functional1Hz cadence keeps stock IRQ164 from starving SACLAC on the VM.
# No measured sensor cadence claim.
frame_period_us = 1000000
frame_active_us = 10000 # Functional phase interval; DMA completes after frame-end.
[[device]]
base = 0xff941000
size = 0x1000
kind = "imaging-receiver"
[device.options]
frame_period_us = 1000000
[[device]]
base = 0xff944000
size = 0x1000
kind = "imaging-phy"

