size = 0x1000
kind = "imaging-serial-sink"
[[device]]
base = 0xff914000
size = 0x1000
kind = "focus-actuator"
# Serial client1/descriptor5 uses SPI4. Finite focus batches -> IRQ127;
# functional virtual home sensor is GPIO0.8.

# Subsequent AF analog stage polls SPI5 as well.
[[device]]
base = 0xff915000
size = 0x1000
kind = "iris-actuator"
# Logical serial client3 uses descriptor6/physical SPI5. Aperture pulse
# batches complete through GIC125/165139c.
