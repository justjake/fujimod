# Original XOR-DAT payload; camera-specific missing tail starts erased.
# One backing is shared with serial flash and DMA; CPU aperture stores fail.
[[device]]
base = 0xf0000000
size = 0x08000000
kind = "flash-storage"
[device.options]
dat_origin = 0x274
xor = 0xff
erased_tail = 0xff

[[device]]
base = 0xff90a000
size = 0x1000
kind = "flash-storage-controller"
[device.options]
# The stock setup probes the body's declared NOR part.
jedec_id = 0x2c5b1b

[[device]]
# Functional 1us completion, level INTID225 until masked ACK at +1c.
base = 0xff939000
size = 0x1000
kind = "flash-storage-dma"

[[device]]
# Known gate/reset latches start zero; this is a session assumption.
base = 0xff90c000
size = 0x1000
kind = "clock-gates"
[device.options]
configuration_word = 0

# The 1000-tick commit latency is a session assumption, as for x100vi-131.
[[device]]
base = 0xfaf05000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf15000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf25000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf35000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
# Table-selected setup words (xt5-431.d/20-storage.toml).
base = 0xfae00000
size = 0x3000
kind = "write-only-registers"

[[device]]
base = 0xff90d000
size = 0x1000
kind = "power-gates"

# The bus-drain helper 0x17f1794 (mask in w0) calls the word reader 0x5de38 on 0x80000000
# (bit 1, 0x17f17d8), 0x100000000 (bit 2, 0x17f17e4) and 0x180000000 (bit 3, 0x17f17f0) and
# discards the value; bit 0 reads 0x1fef3a8. The read at 0x100000000 also
# uses RAM, where the first H.264 bitstream bank starts at +0x1000.
[[device]]
base = 0x80000000
size = 4
kind = "discarded-read"

[[device]]
base = 0x180000000
size = 4
kind = "discarded-read"
