# General DMA banks and their global words: the same SoC windows and options as
# xt5-431.d/22-general-dma.toml (companion_irq_base 83 is the X100VI-derived value).
[[device]]
base = 0xff930000
size = 0x8000
kind = "general-dma"

[device.options]
companion_irq_base = 83
# Recorder DDR training waits for the channel-1 completion on INTID 238.
a53_irq_base = 237

[[device]]
base = 0xff90e748
size = 0x40
kind = "dma-address-high"

[[device]]
base = 0xff90e500
size = 0x20
kind = "dma-request-routing"
