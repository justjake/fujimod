# SSP instance 4 (0xff910000 + n*0x1000). Client 2 of the X-H2S table 0x1c072f8 is
# the X-T5's client 2 word for word: instance 4, select GPIO 12.7 active-low, mode 0,
# 16-bit words. On the X-T5 the peer is the audio codec; its part is not identified,
# so this is the write-only command/data register endpoint of xt5-431.d/40-serial.toml.
# source_hz and miso_high are UNVERIFIED inherited values.
[[device]]
base = 0xff914000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 12, pin = 7, active_high = false }
part = { kind = "serial-command-registers", bits = 16, mode = 0, read_flag = 0x8000, data_words = 1, miso_high = false }
