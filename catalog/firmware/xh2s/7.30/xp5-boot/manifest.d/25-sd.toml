# SD host instances at 0xff9b0000 + (n << 14), each with a UHS-I SDH30 port at +0,
# its selection words at +0x1e0, the UHS-II PHY block at +0x2000 and a UHS-II port at
# +0x2200: the X-T5 layout (xt5-431.d/25-sd.toml). The X-H2S driver references
# 0xff9b0000, 0xff9b2000 and 0xff9b4000 from 83, 73 and 1 sites (0x16c3d80.., 0x16c3c24..,
# 0x16c718c), the X-T5 driver's counts exactly. Card presence is the [[sd]] run input in
# xh2s-730.toml. transfer_ticks, clock_ticks, rca and capabilities (bit 35, UHS-II) are
# the X-T5 session assumptions; ram_bytes is this run's DRAM limit.

[[device]]
base = 0xff9b0000
size = 0x1e0
kind = "sdhci"
[device.options.controller]
base = 0xff9b0000
protocol = "sdhc"
transfer_ticks = 1000
clock_ticks = 1000
rca = 1
ram_bytes = 0xc0000000
ram_banks = [[0x1c0000000, 0x40000000]]
dram_alias = false
address_high = 0xff90e7d8

[[device]]
base = 0xff9b01e0
size = 8
kind = "sd-interface"

[[device]]
base = 0xff9b2000
size = 0x300
kind = "sdhci-uhs2"
[device.options]
slot = 0xff9b0000
capabilities = 0x800000000
clock_ticks = 1000

[[device]]
base = 0xff9b4000
size = 0x1e0
kind = "sdhci"
[device.options.controller]
base = 0xff9b4000
protocol = "sdhc"
transfer_ticks = 1000
clock_ticks = 1000
rca = 1
ram_bytes = 0xc0000000
ram_banks = [[0x1c0000000, 0x40000000]]
dram_alias = false
address_high = 0xff90e7e4

[[device]]
base = 0xff9b41e0
size = 8
kind = "sd-interface"

[[device]]
base = 0xff9b6000
size = 0x300
kind = "sdhci-uhs2"
[device.options]
slot = 0xff9b4000
capabilities = 0x800000000
clock_ticks = 1000
