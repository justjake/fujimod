# Movie REC programs these XP5 blocks. Their completion timings are functional.
# The X-H2S interrupt table maps source 0x10 (row 0x1c0a098) to INTID 210.
[[device]]
base = 0xffd14000
size = 0x2000
kind = "xp5-codec"
[device.options]
irq = 210
run_ticks = 1000000

# X-H2S interrupt source 0xa at 0x1c0a038 maps to INTID 203.
[[device]]
base = 0xffd0c000
size = 0x1000
kind = "imaging-resz"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x108, mode = "constant", value = 0x01000100 },
]
irq = 203
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x10c, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x110, mode = "w1c", status_offset = 0x10c, bits = 0x3 }
irq_mask_offset = 0x114
irq_mask_bit = 0
irq_mask_set_masks = false

# X-H2S interrupt source 0x18 at 0x1c0a118 maps to INTID 218.
[[device]]
base = 0xffd24000
size = 0x1000
