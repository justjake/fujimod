# SSP instance 5 (0xff910000 + 5*0x1000; configured by 0x169cf34) carries the two
# panels. Clients of the X-H2S descriptor table 0x1c072f8 (stride 0x30, lookup
# 0x169ce88) that name instance 5:
#   3 (0x1c07388): select GPIO 12.8 active-low, mode 0, 16-bit words. The LCD driver
#     opens it in 0x175d2f0, 0x175d720, 0x175e224 and 0x175eb5c. 0x175e224 sends one
#     word, register << 8 | value; 0x175d2f0 streams a table of such words. Both
#     read each reply word and discard it. This is the X-T5's client 3; the X-T5's
#     8-bit client 4 on the same select has no X-H2S row.
#   7 (0x1c07448): select GPIO 12.10 active-low, mode 0, 16-bit words (opened in
#     0x1760d80).
#   8 (0x1c07478): the same select, mode 0, 8-bit words (opened in 0x175f318 and
#     0x17605f0).
#   The descriptor's clock selector (word 3) is 2. Its CPOL and CPHA fields
#   (words 6 and 7) are both zero, giving mode 0 at SSP CR0.
# Neither panel part is identified, so both are FujiMod's write-only command/data
# register endpoint: writes are retained and a read is refused. The LCD has no read
# flag in its words that any driver uses. MISO during writes is discarded by both
# drivers; miso_high = false is UNVERIFIED. source_hz is the X100VI value,
# UNVERIFIED.
[[device]]
base = 0xff915000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 12, pin = 8, active_high = false }
part = { kind = "serial-command-registers", bits = 16, mode = 0, miso_high = false }
[[device.options.endpoints]]
select = { port = 12, pin = 10, active_high = false }
part = { kind = "serial-command-registers", bits = 8, mode = 0, miso_high = false }
