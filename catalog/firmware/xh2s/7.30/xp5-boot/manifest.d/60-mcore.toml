# Companion mailbox, input-capture banks and the USB connection status word: the same
# SoC windows and kinds as xt5-431.d/60-mcore.toml (X-H2S references 0xff928000 at
# 0x16cca40 and 0xff929000 at 0x16cc2bc). The companion serial controller is added when
# the X-H2S companion reaches it.
[[device]]
base = 0xff90e100
size = 0x24
kind = "interprocessor-mailbox"

# Input-capture banks (five channels at ff928000, three at ff929000, stride 0x20);
# request lane 32 is the X100VI value, UNVERIFIED.
[[device]]
base = 0xff928000
size = 0x1000
kind = "input-capture"
[device.options]
dma_transmit = [{ channel = 2, request = 32 }]
[[device]]
base = 0xff929000
size = 0x1000
kind = "input-capture"
[device.options]
dma_transmit = [{ channel = 0, request = 35 }]

# USB cable/jig connection status in bit 0; disconnected.
[[device]]
base = 0xff90e300
size = 4
kind = "usb-connection-status"
