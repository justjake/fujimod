# DISCOVERY EXPERIMENT: the X100VI 1.31 imaging windows, without its
# SSP3/4/5 actuator sinks (SSP5 is the X-H2S panel link, 43-panel-serial.toml). Not yet
# justified for the X-H2S sensor; without them a run stopped at the first sensor
# command read 0xff948204 (from 0x1677398) at 19.31 s, right after the companion stop.
# Sensor command DMA; stock program/readback/retry code remains intact.
# Register map, chosen reset standby and timing: as for x100vi-131.
[[device]]
base = 0xff948000
size = 0x1000
kind = "imaging-sensor"
[device.options]
retain_words = true
# Functional scheduled latency, not measured camera timing.
command_latency_us = 1

# Sensor stream and receiver enables gate RAW14-LE16 ramp production.
# Guest-programmed raw input DMA receives pixels; causes1/0 drive stock IRQs.
[[device]]
base = 0xff940000
size = 0x1000
kind = "imaging-receiver"
[device.options]
# Functional1Hz cadence keeps stock IRQ164 from starving SACLAC on the VM.
# No measured sensor cadence claim.
frame_period_us = 1000000
frame_active_us = 10000 # Functional phase interval; DMA completes after frame-end.
[[device]]
base = 0xff941000
size = 0x1000
kind = "imaging-receiver"
[device.options]
frame_period_us = 1000000
[[device]]
base = 0xff944000
size = 0x1000
kind = "imaging-phy"

# Input-engine reset/ready gate used by native imgdc startup.
[[device]]
base = 0xff946000
size = 0x1000
kind = "imaging-input"
[device.options]
retain_words = true

[[device]]
base = 0xff950000
size = 0x1000
kind = "imaging-reset"
[device.options]
retain_words = true

# MOVDC bank0 shares the reset-bit0 handshake (144b838).
[[device]]
base = 0xff970000
size = 0x1000
kind = "movdc"
[device.options]
retain_words = true
frame_period_us = 1000000
source_luma = 128
[[device]]
base = 0xff971000
size = 0x1000
kind = "movdc"
[device.options]
retain_words = true
frame_period_us = 1000000
source_luma = 128
[[device]]
base = 0xff972000
size = 0x1000
kind = "movdc"
[device.options]
retain_words = true
frame_period_us = 1000000
source_luma = 128
[[device]]
base = 0xff973000
size = 0x1000
kind = "imaging-reset"
[device.options]
retain_words = true

# MOVRSZ2f0aebc requires reset+0[0] and idle+54[0,16].
[[device]]
base = 0xff982000
size = 0x1000
kind = "imaging-resize"
[device.options]
retain_words = true
completion_us = 1000

# Fixed Y0,Y1,Cb,Cr source at programmed DMA outputs. Native callbacks own
# buffer descriptors and display state; no private ring fields are written.
[[device]]
base = 0xff800000
size = 0xeb40
kind = "imaging-statistics"

[[device]]
base = 0xff976000
size = 0x1000
kind = "imaging-paf"
[device.options]
retain_words = true

[[device]]
base = 0xff974000
size = 0x1000
kind = "imaging-preview"
[device.options]
retain_words = true
frame_period_us = 1000000
source_luma = 128

[[device]]
base = 0xffd01000
size = 0x1000
kind = "imaging-rifp-io"
[device.options]
queue_completion_us = 5

[[device]]
base = 0xffd02000
size = 0x1000
kind = "imaging-rifp"
[device.options]
retain_words = true
completion_us = 1000
source_luma = 128
