[[device]]
base = 0xff948000
size = 0x1000
kind = "imaging-sensor"
[device.options]
retain_words = true
# Functional scheduled latency, not measured camera timing.
command_latency_us = 1
# X-H2S starts streaming without setting the X100VI standby bit and issues
# readback commands without configuring the X100VI read gate.
standby_gate = false
read_gate = false

# Sensor stream and receiver enables gate RAW14-LE16 ramp production.
# Guest-programmed raw input DMA receives pixels; causes1/0 drive stock IRQs.
[[device]]
base = 0xff940000
size = 0x1000
kind = "imaging-receiver"
[device.options]
# Functional receiver cadence shared with the X-T5.
frame_period_us = 33333
frame_active_us = 10000 # Functional phase interval; DMA completes after frame-end.
[[device]]
base = 0xff941000
size = 0x1000
kind = "imaging-receiver"
[device.options]
frame_period_us = 33333
[[device]]
base = 0xff944000
size = 0x1000
kind = "imaging-phy"

# Input-engine reset/ready gate used by native imgdc startup.
[[device]]
base = 0xff946000
size = 0x1000
kind = "imaging-input"
[device.options]
retain_words = true
# Restart waits for +0x17c bit 31 after the run bit at +0x140 clears.
idle_status = true

