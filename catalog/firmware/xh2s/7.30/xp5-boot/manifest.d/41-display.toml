# Lazy-code/font streaming block, renderer, display pixel-clock PLLs and the two
# display controllers: the same SoC windows and kinds as xt5-431.d/41-display.toml.
# X-H2S references 0xff980000 (0x16bf518..), 0xff93c000 (0x1907000), 0xff990000 and
# 0xff9a0000 (0x1749788..). The PLLs are addressed through clock tables.
[[device]]
base = 0xff980000
size = 0x1000
kind = "lz"

[[device]]
base = 0xff93c000
size = 0x3000
kind = "renderer"

[[device]]
base = 0xffa11000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa12000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa13000
size = 0x1000
kind = "panel-pll"
[[device]]
base = 0xffa14000
size = 0x1000
kind = "panel-pll"

[[device]]
base = 0xff990000
size = 0x1000
kind = "display"
[device.options]
# Observed two-plane geometry. Interleaved Cb/Cr byte order is assumed.
hdmi_nv12 = true
[[device]]
base = 0xff9a0000
size = 0x1000
kind = "display"
