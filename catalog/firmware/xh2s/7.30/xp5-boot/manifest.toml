[cpu.regs]
x19 = 2
x20 = 0x18017f4
x21 = 0x18350
[cpu.sysregs]
ICC_PMR_EL1 = 0xff
ICC_IGRPEN0_EL1 = 1
ICC_IGRPEN1_EL1 = 1
MIDR_EL1 = 0x410fd034
VBAR_EL1 = 0x59800
SCTLR_EL1 = 0x30d00800
