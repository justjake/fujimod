[gic]
distributor = 0xfa000000
redistributor = 0xfa080000
redistributor_stride = 0x20000
spi_max = 511

[gic.registers]
"0x0" = 0x7

# Run input: no card in either SD host instance. Each declares the blank FAT32 card
# (32 GB geometry) that an insertion would present; its contents are not read.
[[sd]]
base = 0xff9b0000
present = false
protected = false
files = []
[sd.format]
sectors = 0x3b9e000
max_dirty_sectors = 65536
partition_start = 8192
sectors_per_cluster = 64
label = "NO NAME"

[[sd]]
