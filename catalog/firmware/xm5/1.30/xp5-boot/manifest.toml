version = 1
firmware = "xm5-130"
load_firmware = true

# The body's DRAM catalog extent: Linux 256 MiB at 0x40000000 plus the shared arenas
# (research/xm5-130/linux-boot.md). Installed capacity is unmeasured.
[[ram]]
base = 0
size = 0x68000000

# M-core SRAM. The X-T5 stock code copies its M-core image here before reset release; the
# X-M5 source of that copy is not located yet.
[[ram]]
base = 0xfa200000
size = 0x100000

# DDR PHY register and firmware space, as on the X-T5. Boot setup writes PHY registers at
# 0xfb000000 / 0xfb400000 + 2*index (boot_ddr_phy_write16, 0xff80dd6c); the mailbox pages above
# each region are stubs (processor blocks).
[[ram]]
base = 0xfb000000
size = 0x1a0000

[[ram]]
base = 0xfb400000
size = 0x1a0000

# Run input: no card in either SD slot. A body without a second socket reads the same empty slot.
[[sd]]
base = 0xff9b0000
present = false
protected = false
files = []
[sd.format]
sectors = 0x3b9e000
max_dirty_sectors = 65536
partition_start = 8192
sectors_per_cluster = 64
label = "NO NAME"

[[sd]]
base = 0xff9b4000
present = false
protected = false
files = []
[sd.format]
sectors = 0x3b9e000
max_dirty_sectors = 65536
partition_start = 8192
sectors_per_cluster = 64
label = "NO NAME"
