# ADC (the SoC's `adc` block, the shared model), declared as on the X-T5, X-H2 and X-E5. The
# reset stage's sampler 0x3c3c configures it (0x11ac8: +0x00 = 4, +0x04, +0x4c = 0xff, +0x08 = 1,
# +0x54 = 0), sets the 15-bit field +0x00 bits 30..16 to 0x7fff (0x11ba4), writes +0x0c = 1
# (0x11d9c), waits for +0x50 & 0x3ff == 8 (0x11dc0), starts with +0x00 bit 0 (0x11c38), waits for
# +0x0c bit 0 (0x11d4c), stops (0x11b68) and reads the 12-bit channels 0..14 at
# 0xff906010 + 4 * channel (0x11cd0, ch <= 14).
#
# `samples`: the X-T5's channel 0 thermistor value and no-key levels elsewhere, INHERITED and
# UNVERIFIED for the X-M5 (no channel assignment is established). The reset stage's channel 7
# check (0x41cc: bits 9..2 above 0x8a) is not reached at the setup start.
[[device]]
base = 0xff906000
size = 0x1000
kind = "adc"
[device.options]
samples = [2713, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095, 4095]
