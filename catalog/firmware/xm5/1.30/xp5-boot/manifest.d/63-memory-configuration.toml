# Memory-parameter banks (the shared `memory-configuration` model, declared as on the X-T5,
# X-H2, X100VI and X-E5). The register-list writer 0x14c1f6c(group, mode) accepts group <= 3
# and mode <= 10, takes [count, list] for that mode and group from table 0x1a79058 (16-byte
# rows), stores every [address, value] pair through 0x9ed60 and then reads the last address
# through 0x9ed88 until it returns 0 (0x14c1fd4..0x14c1fdc, no timeout). All 44 lists hold 114
# pairs on one bank 0xfaf05000 + 0x10000 * group, offsets +0x000..+0x908, ending with 1 to
# +0x704. commit_ticks is the siblings' functional latency, not a camera measurement
# (UNVERIFIED).

[[device]]
base = 0xfaf05000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

[[device]]
base = 0xfaf15000
size = 0x1000
kind = "memory-configuration"
[device.options]
commit_ticks = 1000

