# Audio serial instance 0's soft reset at 0xff91c000 + 0x1c, declared as on the X-E5 and X-H2.
# 0x159abf0 (called at 0x159d024) stores 1 to 0xff91c01c (0x159ac0c..0x159ac18, via 0x9ed60) and
# polls it until it reads 0 (0x159ac24..0x159ac2c, via 0x9ed88, no timeout): the X-E5's
# 0x15ab050 step for step. The audio driver's other registers are not reached before the next
# stop and are refused. Immediate completion is UNVERIFIED / HARDWARE-ONLY.
[[device]]
base = 0xff91c000
size = 0x1000
kind = "reset-handshake"
[device.options]
trigger_offset = 0x1c
