# Companion serial controller SSP1 (PL022) at 0xff911000. Companion descriptor 0x21918 (from
# 0x19f54(0)) names instance 1, no hardware select (0xffffffff), divisor 6, clock polarity and
# phase 1 (0x1010000) and 8-bit words (0x10008), the X-E5 descriptor's settings. The open at
# companion 0x3694 derives data +0x08 and status +0x0c as (instance + 0xff910) << 12 into the
# state at 0x24218, drains the receive FIFO (0x361c: status bit 2) and configures one GPIO chip
# select, 11.3 (literal 0xb0003), as an output idling high; 11.5, the X-E5's BIS select, is
# never configured (the X-M5 has no in-body stabilizer).
#
# The part behind 11.3 is not identified. Its transaction 0x77f0 asserts 11.3 low, sends a 32-bit
# command most significant byte first (register in bits 31..24, value in 23..16; registers 0x10
# to 0x17, 0x73 to 0x75 from 0x78dc..0x7aaa) and receives two bytes through 0x3538, then releases
# 11.3. It is declared write-only (serial-command-registers): writes are retained and a read
# refuses, because the part's reply is not known. No WHO_AM_I check like the X-E5's LSM6DS 0x6c
# exists in this image. Not reached before the next stop.
#
# INHERITED, UNVERIFIED for the X-M5: source_hz, DMA requests 2/3 and companion IRQ line 99 are
# the X100VI values the X-T5 and X-E5 declare.
[[device]]
base = 0xff911000
size = 0x1000
kind = "pl022"
[device.options]
source_hz = 48000000
ticks_per_second = 1000000000
receive_request = 2
transmit_request = 3
companion_irq_line = 99
[device.options.wire]
kind = "gpio-selected"
[[device.options.wire.endpoints]]
[device.options.wire.endpoints.select]
port = 11
pin = 3
active_high = false
[device.options.wire.endpoints.part]
kind = "serial-command-registers"
bits = 8
mode = 3
miso_high = false
