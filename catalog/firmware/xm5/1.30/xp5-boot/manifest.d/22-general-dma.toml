# Eight banks spaced 0x1000 at ff930000..ff937000, as on the other XP5 bodies.
# companion_irq_base = 83 is carried over from the other XP5 boards and is UNVERIFIED for
# the X-M5; it only matters once the guest releases the M-core.
[[device]]
base = 0xff930000
size = 0x8000
kind = "general-dma"

[device.options]
a53_irq_base = 237
companion_irq_base = 83

[[device]]
base = 0xff90e748
size = 0x40
kind = "dma-address-high"

[[device]]
base = 0xff90e500
size = 0x20
kind = "dma-request-routing"
