# DDR PHY mailbox pages, above the two PHY regions of the manifest. Boot setup reads training
# messages through boot_ddr_phy_read_message (0xff80db8c): it waits for bit 0 of the 16-bit
# status word +0x08 to read 0, reads the message +0x64 (and +0x68 for the high half), writes 0
# to +0x62, waits for bit 0 to read 1 and writes 1 to +0x62. boot_ddr_phy_wait_training
# (0xff80e040) repeats this until the message reads 7 or 0xff. This is the X-T5 handshake, so
# these are the X-T5's bring-up register files, not models: +0x08 alternates 0, 1 on each read
# and +0x64 always reads 7 ("training complete"); every other register stores its last write.
[[device]]
base = 0xfb1a0000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [
  { offset = 0x08, mode = "toggle", value = 1 },
  { offset = 0x64, mode = "constant", value = 7 },
]

[[device]]
base = 0xfb5a0000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [
  { offset = 0x08, mode = "toggle", value = 1 },
  { offset = 0x64, mode = "constant", value = 7 },
]
