# I2C instance 1 at 0xff925000 (controllers at 0xff924000 + (n << 12)): the OS open 0x149bc78
# writes 3 to +0x18 through 0x149b3f0, first at 0xff925018. Its interrupt is selector
# 0x1a654d0[1] = 4, descriptor 0x1a66c60 + 4 * 16 = line 0x121 (289), as on the X-T5 and X-E5.
#
# The client table 0x1a654e0 (lookup 0x149c3e8, 16-byte entries: address, flag, bus) is the
# X-E5's entry for entry. The first opener, boot init 0x14ebc90, uses clients 0x0d (0x60), 0x10
# (0x68), 0x11 (0x66) and 0x12 (0x67), the X-E5's write-only boot-init set, and the setup start
# probes those four in that order. 0x66 and 0x68 are the retained power registers every XP5 body
# here declares (inherited from the X100VI board, UNVERIFIED for the X-M5); 0x60, 0x67 and the
# rest of the table are not acknowledged, as on the X-T5 and X-E5. The fuel gauge (0x36) and the
# eye sensor (0x39) are not opened before the next stop, so none is declared. byte_ns is the
# X-E5's functional latency, not a bus rate.
[[device]]
kind = "i2c-controller"
base = 0xff925000
size = 0x1000
[device.options]
interrupt = 289
byte_ns = 25000
[[device.options.targets]]
address = 0x66
part = { kind = "retained-registers" }
[[device.options.targets]]
address = 0x68
part = { kind = "retained-registers" }
