# Serial-NAND storage: the update payload is the die's linear main area (flash.generated.json:
# serial-nand, efdc21, dat_offset 0x2bc, xor 0xff); the missing tail starts erased.
[[device]]
base = 0xf0000000
size = 0x08000000
kind = "flash-storage"
[device.options]
medium = "serial-nand"
dat_origin = 0x2bc
xor = 0xff
erased_tail = 0xff

[[device]]
base = 0xff90a000
size = 0x1000
kind = "flash-storage-controller"
[device.options]
jedec_id = 0xefdc21

[[device]]
base = 0xff939000
size = 0x1000
kind = "flash-storage-dma"
