# Streaming decompression and conversion block (the SoC's `lz` block, the shared `lz` model,
# declared as on the X-T5, X100VI and X-H2). The reset stage (registry extent base 0) runs the
# reset handshake 0x9954 (write 0 to +0x00, wait for nonzero, then for +0x24 == 0x10001), the
# stream setup 0x99a4 (+0x40 = 0, address-high 0xff90e70c, +0x10..+0x1c with +0x18 = 0x14,
# then +0x20 = 0x84000400 and 0x94001400) and the page start 0x9a4c (address-high 0xff90e708,
# +0x08, +0x0c, +0x04 = 1); 0x9aac polls and acknowledges +0x28 bit 0, 0x9af8 writes +0x68 = 1
# and 0x9b18 rewrites +0x20 = 0x84000400. These are the X-H2's 0x13a1928, 0x13a1978 and
# 0x13a1a20 word for word, and all of the reset stage's accesses to the page. The OS image
# drives the same block (for example the page start 0x9106d0). The model also owns the
# address-high words 0xff90e708/e70c. Completion timing is the model's functional assumption,
# not a camera measurement (UNVERIFIED).
[[device]]
base = 0xff980000
size = 0x1000
kind = "lz"
