# Power controller on SPI8 (0xff918000), as on the X-T5 and X-E5. The reset stage's client
# descriptor 0x14ac8 names instance 8, chip select GPIO 15.15 (0xf000f) active-high; its
# register read 0x38d4 sends the register number with an inverted checksum through the generic
# serial driver (0x374c, enable/disable 0x7fb8/0x8024 on +0x04). The calendar is an arbitrary
# virtual input (seconds since 2000-01-01), not a captured value; source_hz is the X100VI value,
# UNVERIFIED.
[[device]]
base = 0xff918000
size = 0x1000
kind = "spi-controller"
[device.options]
source_hz = 48000000
[[device.options.endpoints]]
select = { port = 15, pin = 15, active_high = true }
[device.options.endpoints.part]
kind = "power-controller"
rtc_seconds = 0x325ffea2
rtc_valid = true
# At the addresses the X-E5 1.12 manifest cites for its reset stage (not byte-compared),
# 0x39f0..0x3a04 reads register 0 until bit 15 (0x8000) is set and 0x3a18..0x3a80 folds
# register 0x10 bits {0, 1, 4, 6, 2, 5} into the wake-cause bits it hands off. Bit 9 of
# register 0 and bit 1 of register 0x10 are the X-E5 manifest's normal power-on (its
# application decodes them, 0x015fbae0); taken over for the X-M5, INFERRED. What the
# physical chip reports is HARDWARE-ONLY / UNVERIFIED.
registers = { "0" = 0x8200, "10" = 0x2 }
