# The boot-setup stage as the boot ROM leaves it. The ROM copies the stage from internal flash
# into boot SRAM and branches to its base; the mask ROM is not captured, so this start does the
# same copy from the update image. The extent is the boot-setup stage (update-file offset 0xabc,
# size 0x2c000, base 0xff800000); its SHA-256 is checked on load. The stage sets its own stack
# (SP_EL0 = 0xff830d00 at 0xff800004..0xff800020); sp is only the entry value.
# source_straps = 1 selects the direct-flash path: setup samples 0xff90e000 bit 0 and
# initializes the serial-flash controller.
pc = 0xff800000
sp = 0xff830d00
dat_offset = 0xabc
length = 0x2c000
sha256 = "d65899f242562666e9986e5fc5b7b23136c1b06fc224e7db6511b5ebe8d36426"
source_straps = 1

# Memory-controller setup words boot setup stores through its word writer (0xff8017a0 via
# 0xff80de80) and never reads back by address: 0xfae60000..0xfae63450 (+0x0, +0x8, +0x10, +0x50
# at +0x000, +0x200 and +0x400 of each 0x1000 page), 0xfae70050/0xfae71050/0xfae72050 and
# 0xfae80000..0xfae83004. The X-T5 SD card start declares the same words. Store-only latches: a
# read stays unmodeled and refuses.
[[device]]
base = 0xfae60000
size = 0x4000
kind = "write-only-registers"

[[device]]
base = 0xfae70000
size = 0x3000
kind = "write-only-registers"

[[device]]
base = 0xfae80000
size = 0x4000
kind = "write-only-registers"

# DDR controller pages +0x9000 of the four channels (base table 0xff816f70: 0xfaf00000,
# 0xfaf10000, 0xfaf20000, 0xfaf30000). Boot setup writes +0x9008..+0x9030 through the channel
# writer 0xff80de98 and polls only +0x7800/+0x7820 (0xff80debc), which the shared ROM-start
# fragment's +0x7000 stubs answer. The X-T5 SD card start declares the same pages for its two
# channels. Store-only latches: a read stays unmodeled and refuses.
[[device]]
base = 0xfaf09000
size = 0x1000
kind = "write-only-registers"

[[device]]
base = 0xfaf19000
size = 0x1000
kind = "write-only-registers"

[[device]]
base = 0xfaf29000
size = 0x1000
kind = "write-only-registers"

[[device]]
base = 0xfaf39000
size = 0x1000
kind = "write-only-registers"

# Configuration group words. Boot setup writes them in 22 banks of stride 0x200 from 0xfae00000:
# 0xff801f38(group) stores table words to +0x20 + 4*group and +0x40 + 4*group (tables
# 0xff816d00, 0xff816cf0), and 0xff801fb8 stores 0xff to +0xa0. Nothing in setup reads them. The
# X-T5 declares the same 0x3000 bytes write-only; meaning UNVERIFIED.
[[device]]
base = 0xfae00000
size = 0x3000
kind = "write-only-registers"
