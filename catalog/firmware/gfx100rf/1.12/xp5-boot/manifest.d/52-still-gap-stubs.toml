# Register pages the still capture touches (full shutter press with a card), added one by one
# from runs that stopped on them. Each is a plain store: a word reads back what was written.
# Nothing here is decoded; the comment of each entry gives the first access seen.

# First access: write4 at 0xff960000 from 0x1460c34 (X-T5 4.31 models this page as bringup-stub).
[[device]]
base = 0xff960000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = []

