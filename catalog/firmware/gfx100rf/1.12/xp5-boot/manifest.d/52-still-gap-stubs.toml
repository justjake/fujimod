# DRAM controller page +0x7000 of channel 2 (base table 0x19eca60: 0xfaf00000 + channel *
# 0x10000). The training of channels 2 and 3 waits here with no timeout: 0x149fb54 polls +0x800
# until bit 0 reads 1, and 0x149f820 polls +0x820 until bit 0 reads 0 (both through 0x14b56a8).
# The same answers as the X-T5 4.31 file gives these pages. A register file, not a model.
[[device]]
base = 0xfaf27000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = [{ offset = 0x800, mode = "constant", value = 1 }, { offset = 0x820, mode = "constant", value = 0 }]

# DRAM controller page +0x7000 of channel 3 (base table 0x19eca60: 0xfaf00000 + channel *
