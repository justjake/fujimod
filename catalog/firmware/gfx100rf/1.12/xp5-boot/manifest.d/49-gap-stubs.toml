# Imaging windows this firmware used on its way to the shooting screen (emulator run of
# 2026-11-24: strict, first start passed, 13 s). Declarations are those of the X-E5 1.12 fragment
# of the same name, which is the X-T5 4.31 one. Kept: only windows the GFX100RF firmware touched
# in that run: 0xff945000 (IBUF; 15 functions of the 1.13 image name the page, first write
# 0xff945014 from 0x147adcc), 0xff959000, 0xff95a000, 0xff95b000, 0xff96c000 and 0xff96e000.
# Their models and options are INHERITED and UNVERIFIED for this body. The seven other windows
# of that fragment (0xff94c000, 0xff951000, 0xff955000, 0xff960000, 0xff961000, 0xff90e7d0,
# 0xff90e7dc) were not touched and are not declared.
# Firmware evidence (1.13): IBUF driver 0x145aa30..0x145bb3c and 0x147a4b0..0x147b5b4 (ready poll
# 0x147a4b0 on +0x00 bit 0); table loads 0x1456b1c (0xff959000), 0x14579e0 (0xff95a000), 0x1457aec
# (0xff95b000), writes only; 0xff96c000 and 0xff96e000 are written and read back through register
# tables 0x19cbaa8, 0x19cc7c8, 0x19cc138, 0x19cd3e0 by 0x1460bc0 / 0x1460c6c. IBUF's
# completion_us was not exercised in live view (no transfer started).

[[device]]
base = 0xff945000
size = 0x1000
kind = "imaging-buffer"
[device.options]
completion_us = 8000

# Four table pages of the sensor/IBUF driver (0x1353fe4, 0x135425c, 0x1354628; bases 0xff94c000,
# 0xff94d000, 0xff94e000, 0xff94f000 plus a computed index). The register-dump table 0x378db0c
# lists +0x00..+0x28 on each. Read or write direction of the computed accesses is not resolved, so
# this is a register file, not a write-only window. Reach in live view is a guess (same driver as
# the sensor program path that already runs).
[[device]]
base = 0xff959000
size = 0x1000
kind = "write-only-registers"

# Three 0x400-byte tables per page (+0x000, +0x400, +0x800), written word by word by 0x1367c74
# (0xff95a000) and 0x1367d80 (0xff95b000). The X100VI discovery run recorded 5376 writes on each
# page and no read.
[[device]]
base = 0xff95a000
size = 0x1000
kind = "write-only-registers"

[[device]]
base = 0xff95b000
size = 0x1000
kind = "write-only-registers"

# One word at 0xff960000, named by the register descriptor 0x18dc658. 0x137345c writes it and
# 0x13734e4 reads it back (table reader 0x1370f00) together with the 0xff96cb00 group.
[[device]]
base = 0xff96c000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = []

# Second stage of the same tables (0x18dd4c8..0x18de068: +0x000, +0x100.., +0x200.., +0x400..,
# +0x500.., +0x600.., +0x700). run2 discovery: 136 unowned writes on 124 offsets, no read. The
# X100VI discovery run recorded 22304 writes here.
[[device]]
base = 0xff96e000
size = 0x1000
kind = "bringup-stub"
[device.options]
registers = []

# ---------------------------------------------------------------------------------------------
# Tier 2: first half-press (S1) and the first card transfer.
# ---------------------------------------------------------------------------------------------

# DRAM channels 2 and 3, controller page +0x9000. The S1 boost 0x13adb58 ends in 0x13aeec8, which
# calls 0x13af194 for each channel whose flag at 0x24d3350 is 1; it writes ten words (+0x08,
# +0x14, +0x1c, +0x20, +0x2c, +0x30, +0x3c, +0x40, +0x44, +0x4c) through 0x13bb99c (base table
# 0x18fcf30 = 0xfaf00000 + channel * 0x10000). Writes only. The X100VI ROM start recorded the
# same ten writes on 0xfaf09000..0xfaf39000. Channels 0 and 1 are trained before the hand-off and
# are not listed.
