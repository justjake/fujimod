# Develop and playback completion stubs and helper blocks, ported as declared on the
# X-T5 (xt5/4.31: 55-develop-stubs, 56-develop-stubs-2, 57-develop-stubs-3, 59-raw-stubs,
# 63-hdr) so X-H2 playback can open a picture. The X-H2 is the same XP5 SoC; these were
# added because X-H2 5.20 playback (the same hardware addresses apply to 5.30 and 5.33; both open a camera JPEG in playback) reached the X-T5 windows (0xffd11118, 0xffd0c114)
# with nothing declared there. Interrupt lines, register constants and delays are the
# X-T5's, UNVERIFIED on the X-H2. Completion stubs are not models of their blocks.

# From xt5/4.31 55-develop-stubs.toml.
[[device]]
base = 0xff975000
size = 0x1000
kind = "completion-stub"
[device.options]
registers = [
  { offset = 0x00, mode = "constant", value = 0x1 },
  { offset = 0x98, mode = "constant", value = 0x1 },
  { offset = 0x100, mode = "constant", value = 0x1 },
]
irq = 206
starts = [{ offset = 0x04, mask = 0x1 }]
delay_us = 200
completion = [{ offset = 0x104, set = 0x1 }, { offset = 0x04, clear = 0x1 }]
ack = { offset = 0x108, mode = "w1c", status_offset = 0x104, bits = 0x1 }
irq_mask_offset = 0x10c
irq_mask_bit = 0
irq_mask_set_masks = false

