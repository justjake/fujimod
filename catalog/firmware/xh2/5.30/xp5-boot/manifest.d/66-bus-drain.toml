# Bus-drain port at the end of the first memory region (the body's bus_drain address),
# declared as the X-T5 declares its drain ports. The drain helper 0x14d1c00 (selected by
# a mask in w0) reads through the word reader 0x5de38 and discards the value: bit 0 reads
# the RAM word 0x1cd53a8 (0x14d1c34), bit 1 0x80000000 (0x14d1c44), bit 2 0x100000000
# (0x14d1c50) and bit 3 0x180000000 (0x14d1c5c). The classifier 0x14d1a1c drains an
# address below 0x200000000 the same way: below 0x80000000 through 0x1cd53a8, then
# 0x80000000, 0x100000000 or 0x180000000 for each 2 GiB region above. The stock code
# reads only the first word. Zero readback is a session assumption; only 0x80000000 is
# reached, so the other two ports are not declared. Whether 0x80000000 is a bus port or
# the start of further DRAM is UNVERIFIED (0x2d547e8 maps and fills 0x80000000+0x8000000
# and 0x90000000+0x8000000).
[[device]]
base = 0x80000000
size = 4
kind = "discarded-read"
