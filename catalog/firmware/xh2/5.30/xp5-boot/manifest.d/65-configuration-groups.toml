# Configuration group words (the SoC's configuration_group<n>_words20/40 windows, as in
# the xp5 hardware profile). The only writer is 0x13b0978(group, mode), called from the
# power-up path 0x13af778 at 0x13afa68 with mode 0 for every group (< 4) whose bit is set.
# For each of the 22 bank offsets in table 0x18f4a38 (0, 0x200, ... 0x2a00; count
# 0x18f4a90) it stores two words through 0x5de10: mode 0 (table 0x18f4ad8) writes 0 to
# +0x40 + 4 * group and then 1 to +0x20 + 4 * group (0x13b09fc..0x13b0a2c); mode 1
# (table 0x18f4a98, no static caller) writes 0x80 * group to +0x20 + 4 * group and
# 0x80 * group + 0x7f to +0x40 + 4 * group. 0x13b0978 holds the only references to
# 0xfae00000 and nothing reads these words, so each bank declares only +0x20..+0x2c and
# +0x40..+0x4c; the rest of the 0x200 stride still refuses. Meaning UNVERIFIED.
[[device]]
base = 0xfae00020
size = 0x10
kind = "write-only-registers"

